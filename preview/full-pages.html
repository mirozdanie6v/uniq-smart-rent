<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b09">
<title>UNIQ Smart Rent · Full Pages Preview</title>
<style>
:root{--bg:#080b09;--panel:#111713;--panel2:#151d18;--line:#28342e;--text:#f4f7f5;--muted:#98a69f;--green:#20e38f;--green2:#8bffc4;--ink:#06130c;--warn:#ffd166;--danger:#ff6b6b;--radius:22px;--shadow:0 24px 90px rgba(0,0,0,.32)}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 86% -8%,rgba(32,227,143,.14),transparent 31%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-width:320px;min-height:100dvh}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{min-height:100dvh;padding-bottom:92px}.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:72px;padding:10px clamp(12px,3vw,34px);background:rgba(8,11,9,.88);backdrop-filter:blur(22px);border-bottom:1px solid rgba(255,255,255,.07)}.brand{border:0;background:transparent;padding:0}.brand img{display:block;width:190px;max-width:42vw;height:42px;object-fit:contain;object-position:left center}.top-actions{display:flex;align-items:center;gap:8px}.role{display:flex;gap:4px;padding:4px;border:1px solid var(--line);background:#0d120f;border-radius:999px}.role button{border:0;background:transparent;color:var(--muted);min-height:34px;padding:0 11px;border-radius:999px;font-size:10px;font-weight:900}.role button.active{background:var(--green);color:var(--ink)}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 16px var(--green)}
main{width:min(1260px,100%);margin:auto;padding:clamp(18px,3vw,36px) clamp(12px,4vw,42px) 44px}.eyebrow{display:inline-block;color:var(--green);font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.hero,.dash-hero{padding:clamp(44px,7vw,88px) 0 26px}.hero h1,.dash-hero h1,.page-head h1{margin:10px 0 16px;font-size:clamp(44px,7vw,86px);line-height:.92;letter-spacing:-.055em;max-width:930px}.hero p,.dash-hero p,.page-head p{max-width:760px;color:#b0bbb5;line-height:1.65;font-size:14px}.hero-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:26px;align-items:end}.hero-card,.panel{border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#121914,#0d120f);box-shadow:var(--shadow)}.hero-card{padding:20px}.hero-card b.big{display:block;font-size:46px;letter-spacing:-.05em}.hero-card span{color:var(--muted);font-size:11px}.metric-grid,.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}.metric-grid>div,.kpi-grid>div{padding:15px;border:1px solid var(--line);border-radius:16px;background:#0d120f}.metric-grid b,.kpi-grid b{display:block;font-size:26px;letter-spacing:-.04em}.metric-grid span,.kpi-grid span{display:block;color:var(--muted);font-size:10px;margin-top:4px}.section{margin-top:34px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:14px}.section-head h2{margin:4px 0 0;font-size:clamp(27px,4vw,40px);letter-spacing:-.04em}.section-head small{color:var(--muted)}
.toolbar{position:sticky;top:82px;z-index:45;display:grid;grid-template-columns:minmax(0,1fr) repeat(2,auto);gap:8px;padding:9px;border:1px solid var(--line);border-radius:18px;background:rgba(12,17,14,.93);backdrop-filter:blur(18px);margin-bottom:16px}.toolbar input,.toolbar select,.field input,.field textarea,.field select{width:100%;min-height:44px;border:1px solid #324038;border-radius:12px;background:#090d0b;padding:0 12px;outline:none}.field textarea{padding:12px;min-height:90px;resize:vertical}.toolbar input:focus,.toolbar select:focus,.field input:focus,.field textarea:focus{border-color:var(--green)}.vehicle-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.vehicle-card{border:1px solid var(--line);border-radius:22px;background:var(--panel);overflow:hidden;min-width:0}.vehicle-media{position:relative;aspect-ratio:4/3;background:#0b100d;overflow:hidden}.vehicle-media img{display:block;width:100%;height:100%;object-fit:cover}.fallback{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:18px;color:#cfd8d3}.fallback b{font-size:20px}.fallback small{color:var(--muted)}.badge{position:absolute;left:10px;bottom:10px;padding:6px 8px;border-radius:999px;background:rgba(5,8,6,.78);border:1px solid rgba(255,255,255,.14);font-size:9px;font-weight:900;letter-spacing:.08em}.vehicle-body{padding:15px}.vehicle-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.vehicle-head h3{margin:8px 0 3px;font-size:20px;line-height:1.05}.vehicle-head small{color:var(--muted)}.type-pill,.state-pill{display:inline-flex;align-items:center;min-height:23px;padding:0 8px;border-radius:999px;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;background:rgba(32,227,143,.09);border:1px solid rgba(32,227,143,.18);color:var(--green2)}.price{text-align:right;white-space:nowrap}.price b{font-size:16px}.price small{display:block;color:var(--muted);margin-top:3px}.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:13px 0}.specs span{padding:8px;border-radius:9px;background:#0a0f0c;color:#afbbb5;font-size:9px;line-height:1.25;overflow-wrap:anywhere}.actions,.manager-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.primary,.secondary,.ghost{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;padding:0 14px;font-weight:900;font-size:12px}.primary{border:1px solid var(--green);background:var(--green);color:var(--ink)}.secondary{border:1px solid #344039;background:#19211c;color:#fff}.ghost{border:1px solid var(--line);background:transparent;color:#d8dfdb}.primary:disabled{opacity:.45;cursor:not-allowed}.source{margin-top:24px;padding:13px 15px;border:1px solid var(--line);border-radius:15px;color:var(--muted);font-size:10px;line-height:1.6;background:rgba(255,255,255,.02)}
.bottom{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));z-index:55;transform:translateX(-50%);display:flex;gap:3px;padding:5px;border:1px solid rgba(255,255,255,.11);border-radius:20px;background:rgba(11,15,13,.92);backdrop-filter:blur(20px);box-shadow:0 16px 55px rgba(0,0,0,.4)}.bottom button{border:0;background:transparent;color:var(--muted);min-width:82px;height:50px;border-radius:15px;font-size:10px;font-weight:850}.bottom button.active{background:#1a231e;color:#fff}.bottom b{display:block;font-size:15px;margin-bottom:2px}.request-list,.table-list{display:grid;gap:9px}.request-row,.table-row{border:1px solid var(--line);border-radius:17px;background:var(--panel);padding:14px}.request-row{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(110px,.6fr));gap:10px;align-items:center}.request-row h3{margin:0 0 4px;font-size:16px}.request-row p,.request-row small{margin:0;color:var(--muted);font-size:10px}.request-row select{min-height:40px;border:1px solid var(--line);border-radius:10px;background:#0b100d;padding:0 9px}.owner-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.panel{padding:18px}.panel h3{margin:7px 0 8px;font-size:22px}.panel p{color:var(--muted);font-size:11px;line-height:1.6}.bar{height:8px;border-radius:999px;background:#0a0e0c;overflow:hidden;border:1px solid #26312b}.bar span{display:block;height:100%;background:var(--green)}.status-stack{display:grid;gap:9px;margin-top:14px}.status-line{display:grid;grid-template-columns:130px 1fr 36px;gap:8px;align-items:center;font-size:10px;color:var(--muted)}.status-line b{color:#fff;text-align:right}.empty{padding:30px;border:1px dashed #344039;border-radius:18px;color:var(--muted);text-align:center}.page-head{padding:34px 0 18px}.contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.contact-card{padding:17px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.contact-card span{display:block;color:var(--muted);font-size:10px}.contact-card b,.contact-card a{display:block;margin-top:7px;font-size:15px}.modal-bg{position:fixed;z-index:100;inset:0;background:rgba(0,0,0,.75);display:none;align-items:end;justify-content:center}.modal-bg.open{display:flex}.modal{width:min(620px,100%);max-height:91dvh;overflow:auto;background:#111713;border:1px solid #344139;border-radius:28px 28px 0 0;padding:24px}.modal h2{font-size:31px;margin:6px 0 4px}.modal p{color:var(--muted);font-size:11px;line-height:1.55}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.field{display:grid;gap:6px;color:#aeb9b3;font-size:10px}.wide{grid-column:1/-1}.flash{position:fixed;z-index:120;top:84px;left:50%;transform:translateX(-50%);padding:11px 15px;border-radius:999px;background:#fff;color:#111;font-size:11px;font-weight:900;box-shadow:0 14px 50px rgba(0,0,0,.35)}
@media(max-width:930px){.hero-grid,.owner-grid{grid-template-columns:1fr}.vehicle-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric-grid,.kpi-grid{grid-template-columns:repeat(2,1fr)}.request-row{grid-template-columns:1fr 1fr}.contact-grid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.brand img{width:150px}.role button{padding:0 8px}.role button span{display:none}main{padding-inline:11px}.vehicle-grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr;top:76px}.toolbar input{grid-column:1/-1}.request-row{grid-template-columns:1fr}.contact-grid{grid-template-columns:1fr}.bottom{width:calc(100% - 18px);justify-content:space-between}.bottom button{min-width:0;flex:1}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
<script src="../assets/fleet-manifest.js"></script>
</head>
<body><div id="app" class="app"></div>
<div class="modal-bg" id="modalBg"><section class="modal" role="dialog" aria-modal="true"><span class="eyebrow">UNIQ BOOKING</span><h2 id="modalTitle">Бронирование</h2><p id="modalPrice"></p><form id="bookingForm"><div class="form-grid"><label class="field">Получение<input type="date" name="from" required></label><label class="field">Возврат<input type="date" name="to" required></label><label class="field wide">Имя<input name="name" required placeholder="Ваше имя"></label><label class="field wide">Телефон / Telegram / WhatsApp<input name="contact" required placeholder="+84… / @username"></label><label class="field wide">Место выдачи<input name="place" placeholder="Офис / отель"></label><label class="field wide">Комментарий<textarea name="note" placeholder="Пожелания по аренде"></textarea></label></div><div class="manager-actions"><button class="secondary" type="button" id="closeModal">Закрыть</button><button class="primary" type="submit">Создать заявку</button></div></form></section></div>
<script>
const app=document.getElementById('app');
const fleet=(window.UNIQ_FLEET||[]).map((v,i)=>({...v,_i:i}));
const sync=window.UNIQ_ASSET_SYNC||{vehicleCount:fleet.length,imageCount:0,failureCount:0};
const statusLabels={new:'Новая',contacted:'Связались',awaiting_confirmation:'Ждёт подтверждения',confirmed:'Подтверждена',vehicle_issued:'Выдана',active:'В аренде',return_due:'Возврат',returned:'Возвращена',completed:'Завершена',cancelled:'Отменена'};
const statusOrder=Object.keys(statusLabels);
let state={role:localStorage.getItem('uniq-preview-role')||'client',route:'home',query:'',type:'all',price:'all',selected:null,bookings:JSON.parse(localStorage.getItem('uniq-preview-bookings')||'[]'),fleetState:JSON.parse(localStorage.getItem('uniq-preview-fleet-state')||'{}')};
const fmt=n=>n?new Intl.NumberFormat('ru-RU').format(n)+' ₫':'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labelType=t=>t==='car'?'Авто':t==='scooter'?'Скутер':'Мотоцикл';
const save=()=>{localStorage.setItem('uniq-preview-bookings',JSON.stringify(state.bookings));localStorage.setItem('uniq-preview-fleet-state',JSON.stringify(state.fleetState));};
function flash(msg){const n=document.createElement('div');n.className='flash';n.textContent=msg;document.body.append(n);setTimeout(()=>n.remove(),1800)}
function shell(content){return `<header class="top"><button class="brand" data-route="home"><img src="../assets/brand/uniq-logo.svg" alt="UNIQ Nha Trang Rent Bike"></button><div class="top-actions"><span class="status-dot" title="local preview"></span><div class="role">${[['client','Клиент'],['team','Сотрудник'],['owner','Владелец']].map(([id,l])=>`<button data-role="${id}" class="${state.role===id?'active':''}"><span>${l}</span>${id==='client'?'CLIENT':id==='team'?'TEAM':'OWNER'}</button>`).join('')}</div></div></header><main>${content}</main>${nav()}`}
function nav(){const client=[['home','⌂','Главная'],['catalog','▦','Парк'],['bookings','◷','Мои заявки'],['contacts','◎','Контакты']];const team=[['home','⌂','Операции'],['catalog','▦','Парк'],['bookings','◷','Заявки'],['contacts','◎','Контакты']];const owner=[['home','⌂','Dashboard'],['catalog','▦','Парк'],['bookings','◷','Заявки'],['contacts','◎','Контакты']];const items=state.role==='client'?client:state.role==='team'?team:owner;return `<nav class="bottom">${items.map(([r,ic,l])=>`<button data-route="${r}" class="${state.route===r?'active':''}"><b>${ic}</b>${l}</button>`).join('')}</nav>`}
function vehicleCard(v){const photo=v.photos?.[0];const fstate=state.fleetState[v.id]||'manager_confirmation';return `<article class="vehicle-card"><button class="vehicle-media" data-open="${esc(v.id)}">${photo?`<img src="../${photo.replace(/^\.\//,'')}" loading="lazy" decoding="async" alt="${esc(v.title)}" onerror="this.remove()">`:''}<div class="fallback"><b>${esc(v.title)}</b><small>Локальная фотография UNIQ</small></div><span class="badge">${v.photos?.length||0} фото · LOCAL</span></button><div class="vehicle-body"><div class="vehicle-head"><div><span class="type-pill">${labelType(v.type)}</span><h3>${esc(v.title)}</h3><small>${v.year||''} · ${esc(v.engine||'')}</small></div><div class="price"><b>${fmt(v.dailyVnd)}</b><small>/ день</small></div></div><div class="specs"><span>${esc(v.weight||'—')}</span><span>${esc(v.cruiseSpeed||'—')}</span><span>${esc(v.capacity||'—')}</span></div>${state.role!=='client'?`<div class="state-pill">${fstate==='available'?'Свободна':fstate==='service'?'Сервис':fstate==='reserved'?'Бронь':'Менеджер подтверждает'}</div>`:''}<div class="actions" style="margin-top:12px"><a class="secondary" href="${esc(v.sourceUrl)}" target="_blank" rel="noreferrer">Источник ↗</a>${state.role==='client'?`<button class="primary" data-book="${esc(v.id)}">Выбрать</button>`:`<button class="primary" data-fleet="${esc(v.id)}">Статус</button>`}</div></div></article>`}
function filteredFleet(){const q=state.query.toLowerCase();const cap=state.price==='all'?Infinity:Number(state.price);return fleet.filter(v=>(state.type==='all'||v.type===state.type)&&(!v.dailyVnd||v.dailyVnd<=cap)&&(!q||`${v.title} ${v.year} ${v.engine}`.toLowerCase().includes(q)))}
function catalog(){const rows=filteredFleet();return `<section class="page-head"><span class="eyebrow">LOCAL ASSETS · OFFICIAL SOURCE</span><h1>Парк UNIQ</h1><p>Карточки собраны из официального каталога. Фотографии хранятся локально в этой ветке проекта.</p></section><div class="toolbar"><input id="search" type="search" value="${esc(state.query)}" placeholder="Поиск по модели"><select id="type"><option value="all">Вся техника</option><option value="motorcycle" ${state.type==='motorcycle'?'selected':''}>Мотоциклы</option><option value="scooter" ${state.type==='scooter'?'selected':''}>Скутеры</option><option value="car" ${state.type==='car'?'selected':''}>Авто</option></select><select id="price"><option value="all">Любая цена</option><option value="500000" ${state.price==='500000'?'selected':''}>до 500.000 ₫</option><option value="1000000" ${state.price==='1000000'?'selected':''}>до 1 млн ₫</option><option value="2000000" ${state.price==='2000000'?'selected':''}>до 2 млн ₫</option><option value="4000000" ${state.price==='4000000'?'selected':''}>до 4 млн ₫</option></select></div><div class="section-head"><div><span class="eyebrow">Каталог</span><h2>${rows.length} из ${fleet.length}</h2></div><small>${sync.imageCount||0} локальных фото</small></div>${rows.length?`<section class="vehicle-grid">${rows.map(vehicleCard).join('')}</section>`:`<div class="empty">По текущему фильтру ничего нет.</div>`}<div class="source">Источник: uniqmoto.com. Доступность конкретной единицы техники подтверждает менеджер. Локальная копия фотографий создана для стабильной работы прототипа.</div>`}
function clientHome(){return `<section class="hero"><div class="hero-grid"><div><span class="eyebrow">UNIQ SMART RENT · TELEGRAM MINI APP</span><h1>Выбрать технику. Отправить заявку. Получить подтверждение.</h1><p>Полный парк UNIQ в одном интерфейсе: актуальные карточки, локальные фотографии, цены из официального каталога и быстрый сценарий обращения к менеджеру.</p><div class="actions" style="max-width:420px;margin-top:20px"><button class="primary" data-route="catalog">Открыть парк</button><button class="secondary" data-route="bookings">MY UNIQ</button></div></div><aside class="hero-card"><span class="eyebrow">Синхронизация</span><b class="big">${fleet.length}</b><span>единиц техники</span><div class="metric-grid" style="grid-template-columns:1fr 1fr"><div><b>${sync.imageCount||0}</b><span>локальных фото</span></div><div><b>${sync.failureCount||0}</b><span>ошибок загрузки</span></div></div></aside></div></section><section class="section"><div class="section-head"><div><span class="eyebrow">Популярное</span><h2>Быстрый выбор</h2></div><button class="ghost" data-route="catalog">Весь парк</button></div><div class="vehicle-grid">${fleet.slice(0,6).map(vehicleCard).join('')}</div></section>`}
function teamHome(){const open=state.bookings.filter(b=>!['completed','cancelled'].includes(b.status));const available=Object.values(state.fleetState).filter(x=>x==='available').length;return `<section class="dash-hero"><span class="eyebrow">EMPLOYEE · OPERATIONS</span><h1>Сегодняшняя работа с заявками и парком.</h1><p>Сотрудник видит новые обращения, переводит заявку по статусам и отмечает операционный статус техники. В preview данные сохраняются локально в браузере.</p><div class="metric-grid"><div><b>${open.length}</b><span>активные заявки</span></div><div><b>${fleet.length}</b><span>техника в каталоге</span></div><div><b>${available}</b><span>отмечено свободными</span></div><div><b>${sync.imageCount||0}</b><span>локальных фото</span></div></div></section><section class="section"><div class="section-head"><div><span class="eyebrow">Заявки</span><h2>Очередь менеджера</h2></div><button class="ghost" data-route="bookings">Открыть все</button></div>${requestRows(open.slice(0,8),true)}</section><section class="section owner-grid"><div class="panel"><span class="eyebrow">FLEET CONTROL</span><h3>Статус техники</h3><p>В каталоге сотрудник может переключать: менеджер подтверждает → свободна → бронь → сервис. Это локальный operational demo до подключения реального backend.</p><button class="primary" data-route="catalog">Открыть парк</button></div><div class="panel"><span class="eyebrow">DATA</span><h3>Источник синхронизирован</h3><p>${fleet.length} карточек, ${sync.imageCount||0} изображений, ${sync.failureCount||0} ошибок скачивания.</p></div></section>`}
function ownerHome(){const total=state.bookings.length;const counts=Object.fromEntries(statusOrder.map(s=>[s,state.bookings.filter(b=>b.status===s).length]));const max=Math.max(1,...Object.values(counts));return `<section class="dash-hero"><span class="eyebrow">OWNER · CONTROL CENTER</span><h1>Бизнес перед глазами — с телефона.</h1><p>Owner Dashboard показывает только фактические данные этой demo-сессии и состояние локального каталога. Выдуманные проценты и обороты исключены.</p><div class="kpi-grid"><div><b>${fleet.length}</b><span>парк в каталоге</span></div><div><b>${total}</b><span>создано заявок</span></div><div><b>${state.bookings.filter(b=>['confirmed','vehicle_issued','active','return_due'].includes(b.status)).length}</b><span>подтверждено / активно</span></div><div><b>${sync.imageCount||0}</b><span>локальных фото</span></div></div></section><section class="section owner-grid"><div class="panel"><span class="eyebrow">BOOKING PIPELINE</span><h3>Статусы заявок</h3><div class="status-stack">${statusOrder.slice(0,8).map(s=>`<div class="status-line"><span>${statusLabels[s]}</span><div class="bar"><span style="width:${counts[s]/max*100}%"></span></div><b>${counts[s]}</b></div>`).join('')}</div></div><div class="panel"><span class="eyebrow">ASSET HEALTH</span><h3>Каталог и медиа</h3><p>Техника: <b>${fleet.length}</b><br>Локальные фотографии: <b>${sync.imageCount||0}</b><br>Ошибки синхронизации: <b>${sync.failureCount||0}</b></p><button class="secondary" data-route="catalog">Проверить парк</button></div></section><section class="section"><div class="section-head"><div><span class="eyebrow">Последние обращения</span><h2>Заявки</h2></div><button class="ghost" data-route="bookings">Все заявки</button></div>${requestRows(state.bookings.slice().reverse().slice(0,6),false)}</section>`}
function requestRows(rows,editable){if(!rows.length)return `<div class="empty">Заявок пока нет. Создайте тестовую заявку в режиме Клиент.</div>`;return `<div class="request-list">${rows.map(b=>{const v=fleet.find(x=>x.id===b.vehicleId);return `<article class="request-row"><div><span class="state-pill">${statusLabels[b.status]||b.status}</span><h3>${esc(v?.title||b.vehicleId)}</h3><p>${esc(b.name)} · ${esc(b.contact)}</p></div><div><small>Даты</small><b>${esc(b.from)} → ${esc(b.to)}</b></div><div><small>Создана</small><b>${new Date(b.createdAt).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</b></div><div>${editable?`<select data-status="${esc(b.id)}">${statusOrder.map(s=>`<option value="${s}" ${b.status===s?'selected':''}>${statusLabels[s]}</option>`).join('')}</select>`:`<button class="secondary" data-role-jump="team">Открыть у сотрудника</button>`}</div></article>`}).join('')}</div>`}
function bookingsPage(){return `<section class="page-head"><span class="eyebrow">${state.role==='client'?'MY UNIQ':'BOOKINGS'}</span><h1>${state.role==='client'?'Мои заявки':'Все заявки demo'}</h1><p>${state.role==='client'?'История запросов, созданных в этом браузере.':'Заявки из текущей локальной demo-сессии; статусы редактируются сотрудником.'}</p></section>${requestRows(state.bookings,state.role==='team')}`}
function contacts(){return `<section class="page-head"><span class="eyebrow">UNIQ MOTO · NHA TRANG</span><h1>Контакты и выдача</h1><p>Контактный раздел оставлен единым для клиента, сотрудника и владельца.</p></section><section class="contact-grid"><div class="contact-card"><span>Официальный сайт</span><a href="https://uniqmoto.com/ru" target="_blank">uniqmoto.com ↗</a></div><div class="contact-card"><span>Telegram</span><a href="https://t.me/uniqmotovietnam" target="_blank">Открыть Telegram ↗</a></div><div class="contact-card"><span>Формат выдачи</span><b>Офис или отель в Нячанге</b></div></section>`}
function page(){if(state.route==='catalog')return catalog();if(state.route==='bookings')return bookingsPage();if(state.route==='contacts')return contacts();return state.role==='team'?teamHome():state.role==='owner'?ownerHome():clientHome()}
function render(){app.innerHTML=shell(page());bind()}
function bind(){document.querySelectorAll('[data-route]').forEach(el=>el.onclick=()=>{state.route=el.dataset.route;render();scrollTo({top:0,behavior:'smooth'})});document.querySelectorAll('[data-role]').forEach(el=>el.onclick=()=>{state.role=el.dataset.role;state.route='home';localStorage.setItem('uniq-preview-role',state.role);render();scrollTo({top:0})});document.querySelectorAll('[data-role-jump]').forEach(el=>el.onclick=()=>{state.role=el.dataset.roleJump;state.route='bookings';localStorage.setItem('uniq-preview-role',state.role);render()});document.querySelectorAll('[data-book]').forEach(el=>el.onclick=()=>openBooking(el.dataset.book));document.querySelectorAll('[data-status]').forEach(el=>el.onchange=()=>{const b=state.bookings.find(x=>x.id===el.dataset.status);if(b){b.status=el.value;save();render();flash('Статус обновлён')}});document.querySelectorAll('[data-fleet]').forEach(el=>el.onclick=()=>cycleFleet(el.dataset.fleet));const s=document.getElementById('search');if(s)s.oninput=()=>{state.query=s.value;render()};const t=document.getElementById('type');if(t)t.onchange=()=>{state.type=t.value;render()};const p=document.getElementById('price');if(p)p.onchange=()=>{state.price=p.value;render()}}
function cycleFleet(id){const order=['manager_confirmation','available','reserved','service'];const now=state.fleetState[id]||order[0];state.fleetState[id]=order[(order.indexOf(now)+1)%order.length];save();render();flash('Статус техники изменён')}
let bookingVehicle=null;const modalBg=document.getElementById('modalBg'),modalTitle=document.getElementById('modalTitle'),modalPrice=document.getElementById('modalPrice'),form=document.getElementById('bookingForm');
function openBooking(id){bookingVehicle=fleet.find(v=>v.id===id);if(!bookingVehicle)return;modalTitle.textContent=bookingVehicle.title;modalPrice.textContent=`${fmt(bookingVehicle.dailyVnd)} / день · доступность подтверждает менеджер`;const from=new Date(),to=new Date();from.setDate(from.getDate()+1);to.setDate(to.getDate()+4);form.elements.from.value=from.toISOString().slice(0,10);form.elements.to.value=to.toISOString().slice(0,10);modalBg.classList.add('open')}
document.getElementById('closeModal').onclick=()=>modalBg.classList.remove('open');modalBg.onclick=e=>{if(e.target===modalBg)modalBg.classList.remove('open')};form.onsubmit=e=>{e.preventDefault();if(!bookingVehicle)return;const d=new FormData(form);state.bookings.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),vehicleId:bookingVehicle.id,from:d.get('from'),to:d.get('to'),name:d.get('name'),contact:d.get('contact'),place:d.get('place'),note:d.get('note'),status:'new',createdAt:new Date().toISOString()});save();modalBg.classList.remove('open');state.route='bookings';render();flash('Заявка создана')};
render();
</script></body></html>
