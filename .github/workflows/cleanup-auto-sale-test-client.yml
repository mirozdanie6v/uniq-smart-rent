name: Cleanup AUTO SALE test client data

on:
  push:
    branches:
      - prototype/auto-sale-usa
    paths:
      - .github/workflows/cleanup-auto-sale-test-client.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove test client-created demo records
        run: |
          set -euo pipefail
          URL="https://bba01u6g86lg2q49p34d.containers.yandexcloud.net/api/auto-sale/state"
          curl -fsS "$URL" -o /tmp/state.json

          IDS=$(jq -c '[.leads[] | select(.clientCreated == true) | .id]' /tmp/state.json)
          echo "Removing client-created test leads: $IDS"

          jq --argjson ids "$IDS" '
            {
              baseRevision: .revision,
              leads: [.leads[] | select((.id as $id | ($ids | index($id))) | not)],
              quotes: [.quotes[] | select((.leadId as $id | ($ids | index($id))) | not)],
              orders: [.orders[] | select((.leadId as $id | ($ids | index($id))) | not)],
              notes: (.notes | with_entries(select((.key as $id | ($ids | index($id))) | not))),
              team: .team
            }
          ' /tmp/state.json > /tmp/clean.json

          curl -fsS -X PUT "$URL"             -H 'content-type: application/json'             --data-binary @/tmp/clean.json             -o /tmp/result.json

          cat /tmp/result.json
          jq -e '.ok == true' /tmp/result.json >/dev/null

          curl -fsS "$URL" -o /tmp/after.json
          jq -e '[.leads[] | select(.clientCreated == true)] | length == 0' /tmp/after.json >/dev/null
          jq -e --argjson ids "$IDS" '[.orders[] | select(.leadId as $id | $ids | index($id))] | length == 0' /tmp/after.json >/dev/null
          jq -e --argjson ids "$IDS" '[.quotes[] | select(.leadId as $id | $ids | index($id))] | length == 0' /tmp/after.json >/dev/null
          echo "AUTO_SALE_TEST_CLIENT_CLEANUP_OK"
