name: Deploy AutoWorld alias actual account

on:
  push:
    branches:
      - prototype/auto-sale-usa
    paths:
      - .deploy-autoworld-alias-actual-once

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3972de85ae8b3d2ee3e0d35ecf7ca358
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Deploy alias Worker and custom domain
        run: npx --yes wrangler@4 deploy --config tmp-autoworld-alias/wrangler.jsonc
      - name: Verify alias
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            if curl -L -fsS --connect-timeout 8 --max-time 20 https://autoworld.viiversion.com/api/health -o /tmp/health.json; then
              jq -e '.ok == true and .service == "auto-sale-yandex"' /tmp/health.json >/dev/null
              echo "Alias verified: https://autoworld.viiversion.com/"
              exit 0
            fi
            echo "Waiting for custom domain ($i/24)..."
            sleep 10
          done
          exit 1
