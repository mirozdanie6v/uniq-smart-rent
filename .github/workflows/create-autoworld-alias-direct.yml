name: Create AutoWorld DNS alias direct

on:
  push:
    branches:
      - prototype/auto-sale-usa
    paths:
      - .create-autoworld-alias-direct-once

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update CNAME using saved Cloudflare zone id
        env:
          CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_ALT: ${{ secrets.CF_API_TOKEN }}
          ZONE_ID_SECRET: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          ZONE_ID_VAR: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CF_ZONE_ID_SECRET: ${{ secrets.CF_ZONE_ID }}
          CF_ZONE_ID_VAR: ${{ vars.CF_ZONE_ID }}
          RECORD_NAME: autoworld.viiversion.com
          TARGET_NAME: auto-sale-demo.viiversion.com
        run: |
          set -euo pipefail
          TOKEN="${CF_TOKEN_PRIMARY:-}"; [ -n "$TOKEN" ] || TOKEN="${CF_TOKEN_ALT:-}"
          ZONE_ID="${ZONE_ID_SECRET:-}"; [ -n "$ZONE_ID" ] || ZONE_ID="${ZONE_ID_VAR:-}"; [ -n "$ZONE_ID" ] || ZONE_ID="${CF_ZONE_ID_SECRET:-}"; [ -n "$ZONE_ID" ] || ZONE_ID="${CF_ZONE_ID_VAR:-}"
          [ -n "$TOKEN" ] || { echo "missing_cloudflare_token"; exit 2; }
          [ -n "$ZONE_ID" ] || { echo "missing_cloudflare_zone_id"; exit 3; }
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ZONE_ID"
          API="https://api.cloudflare.com/client/v4"
          AUTH=(-H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json")
          EXISTING="$(curl -fsS "${AUTH[@]}" "$API/zones/$ZONE_ID/dns_records?type=CNAME&name=$RECORD_NAME")"
          RECORD_ID="$(printf '%s' "$EXISTING" | jq -r '.result[0].id // empty')"
          BODY="$(jq -nc --arg name "$RECORD_NAME" --arg content "$TARGET_NAME" '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:true}')"
          if [ -n "$RECORD_ID" ]; then
            RESULT="$(curl -fsS -X PUT "${AUTH[@]}" --data "$BODY" "$API/zones/$ZONE_ID/dns_records/$RECORD_ID")"
            ACTION=updated
          else
            RESULT="$(curl -fsS -X POST "${AUTH[@]}" --data "$BODY" "$API/zones/$ZONE_ID/dns_records")"
            ACTION=created
          fi
          printf '%s' "$RESULT" | jq -e '.success == true' >/dev/null
          echo "Cloudflare DNS record $ACTION: $RECORD_NAME -> $TARGET_NAME"
