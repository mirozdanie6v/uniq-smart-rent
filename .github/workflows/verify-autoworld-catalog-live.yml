name: Verify AutoWorld catalog live

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - '.verify-autoworld-catalog-live'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DEMO_URL: https://auto-sale-demo.viiversion.com
    steps:
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Verify imported catalog in client and manager UI
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          base=os.environ['DEMO_URL']
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              page=browser.new_page(viewport={'width':1440,'height':1100},locale='ru-RU')
              page.goto(base,wait_until='networkidle',timeout=60000)
              page.wait_for_timeout(1800)

              state=page.evaluate("""async()=>await (await fetch('/api/auto-sale/state',{cache:'no-store'})).json()""")
              imported=[x for x in state.get('catalog',[]) if x.get('source')=='AutoWorld_Georgia']
              assert len(imported)==23,len(imported)
              assert len(state.get('catalog',[]))==39,len(state.get('catalog',[]))
              bmw=next(x for x in imported if x.get('id')=='AWG-3713')
              assert bmw['brand']=='BMW' and bmw['model']=='228'
              assert bmw['priceRub']==4300000
              assert bmw['estimatedBidUsd']==15000
              assert len(bmw.get('otherPhotos',[]))==6
              print('AUTO_SALE_AUTOWORLD_YDB_OK',len(imported),len(state.get('catalog',[])))

              page.locator('[data-role="client"]').click()
              page.locator('.auto-bottom [data-go="catalog"]').click()
              card=page.locator('[data-detail="AWG-3713"]').locator('xpath=ancestor::article[contains(@class,"auto-car")]')
              assert card.count()==1
              text=card.inner_text()
              assert 'BMW 228' in text,text
              assert '4 300 000' in text.replace('\u00a0',' '),text
              print('AUTO_SALE_AUTOWORLD_CLIENT_CARD_OK')

              page.locator('[data-detail="AWG-3713"]').click()
              page.locator('[data-car-slider]').wait_for(state='visible',timeout=5000)
              assert page.locator('[data-car-slide]').count()==7
              modal=page.locator('.auto-car-detail-modal')
              assert 'BMW 228' in modal.inner_text()
              assert '4 300 000' in modal.inner_text().replace('\u00a0',' ')
              print('AUTO_SALE_AUTOWORLD_CLIENT_DETAIL_OK',page.locator('[data-car-slide]').count())

              page.locator('[data-car-detail-close]').first.click()
              page.locator('[data-role="manager"]').click()
              page.locator('[data-go="catalogAdmin"]').click()
              row=page.locator('[data-catalog-edit="AWG-3713"]')
              assert row.count()==1
              row.click()
              form=page.locator('#catalogCarForm')
              form.wait_for(state='visible',timeout=5000)
              assert form.locator('[name="brand"]').input_value()=='BMW'
              assert form.locator('[name="model"]').input_value()=='228'
              assert form.locator('[name="priceRub"]').input_value()=='4300000'
              assert form.locator('[data-photo-preview="main"] img').count()==1
              assert form.locator('[data-photo-preview="other"] img').count()==6
              print('AUTO_SALE_AUTOWORLD_MANAGER_EDIT_OK')
              browser.close()
          PY
