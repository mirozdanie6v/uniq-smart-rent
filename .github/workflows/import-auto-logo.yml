name: Import AUTO SALE logo asset

on:
  workflow_dispatch:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .import-auto-logo

permissions:
  contents: write
  actions: write

jobs:
  import-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prototype/auto-sale-usa

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download transparent WebP asset
        run: |
          set -euo pipefail
          npm exec --yes --package=playwright@1.55.0 playwright install chromium
          npm exec --yes --package=playwright@1.55.0 -- node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ acceptDownloads: true });
            await page.goto('https://firestorage.ai/ja/f/S7Sc-neRKSKC', { waitUntil: 'networkidle', timeout: 120000 });

            const filename = 'auto-sale-logo-automir-v5.webp';
            let saved = false;

            const hrefs = await page.locator('a').evaluateAll(as => as.map(a => ({
              text: (a.textContent || '').trim(),
              href: a.href || ''
            })));
            const direct = hrefs.find(x => x.href && (x.href.includes(filename) || /download/i.test(x.href)));
            if (direct) {
              const resp = await page.request.get(direct.href);
              if (resp.ok()) {
                const body = await resp.body();
                fs.writeFileSync('public/' + filename, body);
                saved = body.length > 1000;
              }
            }

            if (!saved) {
              const target = page.getByText(filename, { exact: false }).first();
              if (await target.count()) {
                try {
                  const dlPromise = page.waitForEvent('download', { timeout: 30000 });
                  await target.click();
                  const dl = await dlPromise;
                  await dl.saveAs('public/' + filename);
                  saved = true;
                } catch {}
              }
            }

            if (!saved) {
              const buttons = page.locator('a,button');
              const count = await buttons.count();
              for (let i = 0; i < count && !saved; i++) {
                const el = buttons.nth(i);
                const txt = ((await el.textContent().catch(() => '')) || '').trim();
                if (!/download|ダウンロード|保存/i.test(txt)) continue;
                try {
                  const dlPromise = page.waitForEvent('download', { timeout: 15000 });
                  await el.click();
                  const dl = await dlPromise;
                  await dl.saveAs('public/' + filename);
                  saved = true;
                } catch {}
              }
            }

            await browser.close();
            if (!saved || !fs.existsSync('public/' + filename) || fs.statSync('public/' + filename).size < 1000) {
              throw new Error('Could not download AUTO SALE WebP asset from transfer page');
            }
            console.log('Saved', filename, fs.statSync('public/' + filename).size, 'bytes');
          })();
          NODE

      - name: Wire new logo into AUTO SALE
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          app = Path('public/auto-sale-app-v3.mjs')
          s = app.read_text()
          s = s.replace('auto-sale-logo-automir.png?v=20260926-brand-v4', 'auto-sale-logo-automir-v5.webp?v=20260926-brand-v5')
          app.write_text(s)

          test = Path('tests/auto-sale-ui-smoke.test.mjs')
          t = test.read_text()
          t = t.replace(r'auto-sale-logo-automir\\.png', r'auto-sale-logo-automir-v5\\.webp')
          test.write_text(t)
          PY
          printf '%s\n' 'deploy transparent layered WebP logo v5 2026-09-26' > .deploy-auto-sale

      - name: Validate
        run: |
          npm install
          npm run check

      - name: Commit asset and wiring
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/auto-sale-logo-automir-v5.webp public/auto-sale-app-v3.mjs tests/auto-sale-ui-smoke.test.mjs .deploy-auto-sale
          git commit -m "Install transparent layered AUTO SALE WebP logo v5"
          git push origin HEAD:prototype/auto-sale-usa

      - name: Dispatch Yandex deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-yandex-staging.yml --ref prototype/auto-sale-usa
