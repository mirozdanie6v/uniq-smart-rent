name: Refresh AUTO SALE vehicle descriptions

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths: ['.refresh-auto-sale-descriptions']

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prototype/auto-sale-usa

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate description generator
        run: node --check scripts/import-autoworld-catalog.mjs

      - name: Generate current descriptions without importing
        env:
          SOURCE_PATH: data/autoworld-georgia/cars.json
          OUTPUT_PATH: /tmp/catalog-descriptions.json
          AUDIT_PATH: /tmp/catalog-descriptions-audit.json
          DRY_RUN: 'true'
        run: node scripts/import-autoworld-catalog.mjs

      - name: Patch only AutoWorld descriptions in live state
        env:
          STATE_URL: https://auto-sale-demo.viiversion.com/api/auto-sale/state
        run: |
          set -euo pipefail
          node <<'NODE'
          (async()=>{
          const fs=require('fs');
          const generated=JSON.parse(fs.readFileSync('/tmp/catalog-descriptions.json','utf8'));
          const byId=new Map(generated.map(x=>[String(x.id||''),String(x.bestFor||'')]));
          const arr=x=>Array.isArray(x)?x:[];
          const old='Данные автомобиля импортированы из публичного канала AutoWorld Georgia. Перед заказом параметры и актуальность предложения подтверждаются менеджером.';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          function clean(v){return String(v??'').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').trim()}
          function fallback(car){
            const brand=clean(car.brand),model=clean(car.model),name=(brand+' '+model).trim(),key=name.toLowerCase();
            const facts=[
              Number(car.year)>0?car.year+' год':'',
              clean(car.drive)&&!/^[—-]+$/.test(clean(car.drive))?'привод '+clean(car.drive):'',
              clean(car.engine)&&!/уточняется|^[-—]$/i.test(clean(car.engine))?'двигатель '+clean(car.engine):'',
              clean(car.trim)?'комплектация '+clean(car.trim):'',
              clean(car.mileage)&&!/уточняется|н\/д|^[-—]$/i.test(clean(car.mileage))?'пробег '+clean(car.mileage):''
            ].filter(Boolean);
            let use='Сбалансированный вариант для повседневных поездок и загородных маршрутов.';
            if(/(?:f-?150|f350|super duty|ram 1500|ram 2500|sierra|tundra|tacoma|canyon|santa cruz)/i.test(key)){
              use='Практичный вариант для тех, кому нужны возможности пикапа, уверенная тяга и универсальность для работы и поездок за город.';
            }else if(/(?:gle|glb|gla|x1|x2|x3|x6|x7|q5|q7|macan|cayenne|atlas|tiguan|evoque|trailblazer|envista|rogue|qashqai|hr-v|h-rv|trax|crosstrek|seltos|venue|kona|cr-v|kicks|eclipse|encore|ecosport)/i.test(key)){
              use=/(?:porsche|bmw|mercedes|audi|land rover)/i.test(key)
                ?'Подойдёт тем, кому нужен комфортный премиальный кроссовер или SUV для города, трассы и дальних поездок.'
                :'Подойдёт для ежедневной городской эксплуатации, семейных поездок и выездов за город.';
            }else if(/prius/i.test(key)){
              use='Рациональный вариант для ежедневной эксплуатации, города и тех, кому важны экономичность и практичность.';
            }else if(/(?:amg|228|330|530|tlx|a6|a3|k4|forte|elantra|sentra|corolla|jetta|impreza)/i.test(key)){
              use=/(?:amg|bmw|audi|acura)/i.test(key)
                ?'Подойдёт тем, кто ищет комфортный автомобиль для города и трассы с акцентом на динамику и оснащение.'
                :'Практичный вариант для ежедневных поездок, города и трассы с понятными эксплуатационными расходами.';
            }else if(/soul/i.test(key)){
              use='Компактный и практичный вариант для города, ежедневных поездок и тех, кому важен удобный салон при небольших габаритах.';
            }
            return facts.length?(name+': '+facts.join(', ')+'. '+use):(name+'. '+use);
          }

          async function getState(){
            const r=await fetch(process.env.STATE_URL,{headers:{accept:'application/json','cache-control':'no-cache'}});
            if(!r.ok)throw new Error('state_read_failed_'+r.status);
            return r.json();
          }

          let wrote=null;
          for(let attempt=1;attempt<=12;attempt++){
            const s=await getState();
            const before=arr(s.catalog).filter(x=>x.source==='AutoWorld_Georgia');
            const catalog=arr(s.catalog).map(car=>{
              if(car.source!=='AutoWorld_Georgia')return car;
              const next=byId.get(String(car.id||''))||fallback(car);
              return {...car,bestFor:next};
            });
            const payload={
              baseRevision:Number(s.revision)||0,
              leads:arr(s.leads),quotes:arr(s.quotes),orders:arr(s.orders),
              notes:s.notes&&typeof s.notes==='object'?s.notes:{},
              team:arr(s.team),catalog
            };
            const r=await fetch(process.env.STATE_URL,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
            if(r.status===409){
              console.log('AUTO_SALE_DESCRIPTION_RETRY '+JSON.stringify({attempt,baseRevision:s.revision}));
              await sleep(300);
              continue;
            }
            const body=await r.text();
            if(!r.ok)throw new Error('state_write_failed_'+r.status+'_'+body.slice(0,500));
            wrote={beforeCount:before.length,revision:JSON.parse(body).revision};
            break;
          }
          if(!wrote)throw new Error('state_write_conflict_exhausted');

          const after=await getState();
          const awg=arr(after.catalog).filter(x=>x.source==='AutoWorld_Georgia');
          const generic=awg.filter(x=>!x.bestFor||x.bestFor===old);
          if(generic.length)throw new Error('generic_descriptions_remain_'+generic.map(x=>x.id).join(','));
          console.log('AUTO_SALE_DESCRIPTIONS_OK '+JSON.stringify({
            revision:after.revision,
            autoWorld:awg.length,
            updated:awg.length,
            generatedMatches:awg.filter(x=>byId.has(String(x.id||''))).length,
            fallback:awg.filter(x=>!byId.has(String(x.id||''))).length,
            sample:awg.slice(0,3).map(x=>({id:x.id,bestFor:x.bestFor}))
          }));
          })().catch(error=>{console.error(error);process.exit(1)})
          NODE
