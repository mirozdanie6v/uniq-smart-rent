name: Deploy UNIQ demo
on:
  workflow_dispatch:
  push:
    branches:
      - refactor/react-typescript-vite-demo
permissions:
  contents: read
concurrency:
  group: uniq-smart-rent-demo
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate application
        run: npm run check
      - name: Validate demo Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.demo.jsonc --outdir .wrangler-demo-dry-run
      - name: Deploy demo Worker and custom domain
        run: npx wrangler deploy --config wrangler.demo.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
