name: Validate UNIQ demo package
on:
  workflow_dispatch:
  push:
    branches:
      - refactor/react-typescript-vite-demo
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate application
        run: npm run check
      - name: Validate demo Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.demo.jsonc --outdir .wrangler-demo-dry-run
      - name: Deployment routing note
        run: |
          echo 'Demo package validated.'
          echo 'uniq-smart-rent-demo.viiversion.com is deployed by the authorized VIIVERSION runner in mirozdanie6v/rusinfocenter.'
