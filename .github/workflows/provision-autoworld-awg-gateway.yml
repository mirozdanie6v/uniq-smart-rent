name: Provision AutoWorld AWG gateway

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .deploy-autoworld-awg-gateway
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
  YC_RUNTIME_SA_ID: ${{ vars.YC_RUNTIME_SA_ID }}
  AWG_CONTAINER_ID: bbamitq3qlhgqm671ppu
  AWG_GATEWAY_NAME: autoworld-awg-gw

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Exchange OIDC token for Yandex IAM token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          test "$HTTP_CODE" = "200" || { echo "$BODY" | jq -c . || true; exit 1; }
          IAM_TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token')
          test -n "$IAM_TOKEN" && test "$IAM_TOKEN" != "null"
          echo "::add-mask::$IAM_TOKEN"
          echo "YC_IAM_TOKEN=$IAM_TOKEN" >> "$GITHUB_ENV"

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Build API Gateway spec
        run: |
          cat > /tmp/awg-gateway.yaml <<EOF
          openapi: 3.0.0
          info:
            title: AutoWorld AWG
            version: 1.0.0
          paths:
            /:
              x-yc-apigateway-any-method:
                x-yc-apigateway-integration:
                  type: serverless_containers
                  container_id: ${AWG_CONTAINER_ID}
                  service_account_id: ${YC_DEPLOY_SA_ID}
            /{proxy+}:
              x-yc-apigateway-any-method:
                x-yc-apigateway-integration:
                  type: serverless_containers
                  container_id: ${AWG_CONTAINER_ID}
                  service_account_id: ${YC_DEPLOY_SA_ID}
                parameters:
                  - explode: false
                    in: path
                    name: proxy
                    required: false
                    schema:
                      default: '-'
                      type: string
                    style: simple
          EOF
          cat /tmp/awg-gateway.yaml

      - name: Create or update AWG API Gateway
        run: |
          set -euo pipefail
          if yc serverless api-gateway get --name "$AWG_GATEWAY_NAME" --folder-id "$YC_FOLDER_ID" >/dev/null 2>&1; then
            yc serverless api-gateway update --name "$AWG_GATEWAY_NAME" --folder-id "$YC_FOLDER_ID" --spec=/tmp/awg-gateway.yaml
          else
            yc serverless api-gateway create --name "$AWG_GATEWAY_NAME" --folder-id "$YC_FOLDER_ID" --spec=/tmp/awg-gateway.yaml
          fi
          yc serverless api-gateway get --name "$AWG_GATEWAY_NAME" --folder-id "$YC_FOLDER_ID" --format json > /tmp/awg-gateway.json
          cat /tmp/awg-gateway.json | jq '{id,name,domain,status}'

      - name: Verify gateway to private container
        run: |
          set -euo pipefail
          DOMAIN=$(jq -r '.domain' /tmp/awg-gateway.json)
          test -n "$DOMAIN" && test "$DOMAIN" != "null"
          BASE="https://${DOMAIN}"
          echo "AWG_GATEWAY_ORIGIN=${BASE}"
          ok=0
          for attempt in $(seq 1 24); do
            code=$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/awg-gateway-health.json -w '%{http_code}' "${BASE}/api/health" || true)
            if [ "$code" = "200" ] && jq -e '.ok == true and .persistence == "ydb-serverless"' /tmp/awg-gateway-health.json >/dev/null 2>&1; then
              cat /tmp/awg-gateway-health.json | jq .
              ok=1
              break
            fi
            echo "Gateway attempt $attempt HTTP $code"
            [ -s /tmp/awg-gateway-health.json ] && head -c 1000 /tmp/awg-gateway-health.json || true
            sleep 5
          done
          test "$ok" -eq 1
