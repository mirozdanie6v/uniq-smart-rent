name: Audit LoveTravel mobile preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-lovetravel-mobile-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install browser
        shell: bash
        run: |
          npm init -y >/dev/null
          npm install --no-fund --no-audit playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Inspect mobile UI
        shell: bash
        run: |
          cat > audit.mjs <<'NODE'
          import { chromium } from 'playwright';

          const base='https://love-travel-client-preview.mirozdanie6v.workers.dev';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({
            viewport:{width:390,height:844},
            deviceScaleFactor:2,
            isMobile:true,
            hasTouch:true,
          });
          const consoleErrors=[];
          const pageErrors=[];
          page.on('console',msg=>{ if(msg.type()==='error') consoleErrors.push(msg.text()); });
          page.on('pageerror',err=>pageErrors.push(String(err)));

          await page.goto(base,{waitUntil:'domcontentloaded',timeout:45000});
          await page.waitForTimeout(7000);

          const snapshot=async(label)=> {
            const info=await page.evaluate(()=>{
              const visible=el=>{
                const s=getComputedStyle(el),r=el.getBoundingClientRect();
                return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>0&&r.height>0;
              };
              const els=[...document.querySelectorAll('button,a,[role="button"],input,textarea,select')]
                .filter(visible)
                .slice(0,120)
                .map(el=>({
                  tag:el.tagName,
                  text:(el.innerText||el.getAttribute('aria-label')||el.getAttribute('placeholder')||'').trim().replace(/\s+/g,' ').slice(0,160),
                  cls:String(el.className||'').slice(0,160),
                  id:el.id||'',
                  data:Object.fromEntries(Object.entries(el.dataset||{}).slice(0,12)),
                }));
              const candidates=[...document.querySelectorAll('[class*="tour"],[class*="catalog"],[data-tour],[data-id]')]
                .filter(visible)
                .slice(0,100)
                .map(el=>({
                  tag:el.tagName,
                  cls:String(el.className||'').slice(0,180),
                  text:(el.innerText||'').trim().replace(/\s+/g,' ').slice(0,220),
                  data:Object.fromEntries(Object.entries(el.dataset||{}).slice(0,12)),
                }));
              return {
                title:document.title,
                lang:localStorage.getItem('max-tour-locale-v1'),
                bodyText:document.body.innerText.replace(/\s+/g,' ').slice(0,2500),
                scrollWidth:document.documentElement.scrollWidth,
                clientWidth:document.documentElement.clientWidth,
                activeScreen:[...document.querySelectorAll('.screen.active')].map(x=>x.id),
                interactive:els,
                candidates,
              };
            });
            console.log('=== '+label+' ===');
            console.log(JSON.stringify(info,null,2));
          };

          await snapshot('RU/initial');

          const zh=page.locator('.mt-language-switcher button[data-locale="zh"]');
          if(await zh.count()) {
            await zh.click();
            await page.waitForTimeout(2500);
            await snapshot('ZH');
          } else {
            console.log('ZH switch missing');
          }

          console.log('=== CONSOLE_ERRORS ===');
          console.log(JSON.stringify(consoleErrors,null,2));
          console.log('=== PAGE_ERRORS ===');
          console.log(JSON.stringify(pageErrors,null,2));
          await page.screenshot({path:'/tmp/lovetravel-mobile.png',fullPage:true});
          await browser.close();
          NODE
          node audit.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: lovetravel-mobile-preview
          path: /tmp/lovetravel-mobile.png
          if-no-files-found: error
