name: Import AutoWorld Georgia recent batch

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - '.import-autoworld-georgia-recent'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prototype/auto-sale-usa
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape recent public Telegram archive and upload photos
        env:
          AUTO_SALE_MEDIA_API: https://auto-sale-demo.viiversion.com/api/auto-sale/media
          MAX_PAGES: '20'
          MAX_PHOTOS_PER_CAR: '8'
          REQUEST_DELAY: '0.15'
          OUT_DIR: data/autoworld-georgia-recent
        run: python scripts/scrape-autoworld-georgia.py

      - name: Show import report
        run: cat data/autoworld-georgia-recent/report.json

      - name: Commit recent dataset
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin prototype/auto-sale-usa
          git add data/autoworld-georgia-recent
          if git diff --cached --quiet; then
            echo "No import changes"
            exit 0
          fi
          git commit -m "Import recent AutoWorld Georgia catalog dataset"
          git push origin HEAD:prototype/auto-sale-usa
