name: Backfill origin and deploy AUTO SALE

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .deploy-origin-logistics

permissions:
  contents: read
  id-token: write

env:
  SOURCE_SHA: 631cf4984b0726c3ba12aedccebc7c69918428f9
  YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
  YC_RUNTIME_SA_ID: ${{ vars.YC_RUNTIME_SA_ID }}
  YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
  YC_CONTAINER_NAME: ${{ vars.YC_CONTAINER_NAME }}
  YDB_CONNECTION_STRING: ${{ vars.YDB_CONNECTION_STRING }}
  AUTO_SALE_MEDIA_BUCKET: viiversion-auto-sale-media

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Revalidate pinned source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npm install
          npm run check
          SOURCE_PATH=data/autoworld-georgia/cars.json \
          OUTPUT_PATH=/tmp/origin-catalog.json \
          AUDIT_PATH=/tmp/origin-audit.json \
          DRY_RUN=true \
          node scripts/import-autoworld-catalog.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows=JSON.parse(fs.readFileSync('/tmp/origin-catalog.json','utf8'));
          if(rows.length!==133)throw new Error('catalog_count_'+rows.length);
          const counts={};for(const x of rows)counts[x.origin]=(counts[x.origin]||0)+1;
          const expected={'США':80,'Грузия':49,'Корея':1,'Европа':1,'США / Грузия':2};
          if(JSON.stringify(counts)!==JSON.stringify(expected))throw new Error('origin_distribution_'+JSON.stringify(counts));
          console.log('ORIGIN_SOURCE_OK',JSON.stringify(counts));
          NODE

      - name: Backfill only vehicle origin in live state
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const url='https://auto-sale-demo.viiversion.com/api/auto-sale/state';
          const normalized=JSON.parse(fs.readFileSync('/tmp/origin-catalog.json','utf8'));
          const originById=new Map(normalized.map(x=>[String(x.id),x.origin]));
          const originByPost=new Map(normalized.map(x=>[String(x.sourcePostId||''),x.origin]));
          const canonical=value=>{
            if(Array.isArray(value))return '['+value.map(canonical).join(',')+']';
            if(value&&typeof value==='object')return '{'+Object.keys(value).sort().map(k=>JSON.stringify(k)+':'+canonical(value[k])).join(',')+'}';
            return JSON.stringify(value);
          };
          const hash=value=>crypto.createHash('sha256').update(canonical(value)).digest('hex');
          const stripOrigin=rows=>rows.map(row=>{const x={...row};delete x.origin;return x});
          let finalBaseline=null;

          for(let attempt=1;attempt<=4;attempt++){
            const get=await fetch(url,{headers:{accept:'application/json'},cache:'no-store'});
            if(!get.ok)throw new Error('state_read_'+get.status);
            const s=await get.json();
            const catalog=Array.isArray(s.catalog)?s.catalog:[];
            if(catalog.length!==133)throw new Error('live_catalog_count_'+catalog.length);

            const missing=[];
            const merged=catalog.map(car=>{
              const origin=originById.get(String(car.id))||originByPost.get(String(car.sourcePostId||''))||String(car.origin||'').trim();
              if(!origin)missing.push(car.id);
              return {...car,origin:origin||'Уточняется'};
            });
            if(missing.length)throw new Error('origin_mapping_missing_'+missing.join('_'));

            const baseline={
              revision:Number(s.revision)||0,
              catalogWithoutOrigin:hash(stripOrigin(catalog)),
              leads:hash(s.leads||[]),quotes:hash(s.quotes||[]),orders:hash(s.orders||[]),
              notes:hash(s.notes||{}),team:hash(s.team||[])
            };
            const put=await fetch(url,{
              method:'PUT',headers:{'content-type':'application/json'},
              body:JSON.stringify({
                baseRevision:baseline.revision,
                leads:s.leads||[],quotes:s.quotes||[],orders:s.orders||[],
                notes:s.notes||{},team:s.team||[],catalog:merged
              })
            });
            const body=await put.json().catch(()=>({}));
            if(put.status===409){console.log('ORIGIN_BACKFILL_RETRY',attempt);continue}
            if(!put.ok)throw new Error('state_write_'+put.status+'_'+JSON.stringify(body));
            finalBaseline=baseline;
            break;
          }
          if(!finalBaseline)throw new Error('origin_backfill_conflict_exhausted');

          const checkR=await fetch(url,{headers:{accept:'application/json'},cache:'no-store'});
          if(!checkR.ok)throw new Error('state_verify_'+checkR.status);
          const check=await checkR.json();
          if((check.catalog||[]).length!==133)throw new Error('verify_catalog_count');

          const hashes={
            catalogWithoutOrigin:hash(stripOrigin(check.catalog||[])),
            leads:hash(check.leads||[]),quotes:hash(check.quotes||[]),orders:hash(check.orders||[]),
            notes:hash(check.notes||{}),team:hash(check.team||[])
          };
          for(const key of Object.keys(hashes)){
            if(hashes[key]!==finalBaseline[key])throw new Error('unexpected_state_change_'+key);
          }
          const counts={};
          for(const car of check.catalog||[])counts[car.origin]=(counts[car.origin]||0)+1;
          const expected={'США':80,'Грузия':49,'Корея':1,'Европа':1,'США / Грузия':2};
          if(JSON.stringify(counts)!==JSON.stringify(expected))throw new Error('live_origin_distribution_'+JSON.stringify(counts));
          console.log('ORIGIN_LIVE_BACKFILL_OK',JSON.stringify({revision:check.revision,catalog:check.catalog.length,origins:counts}));
          NODE

      - name: Validate Yandex configuration
        run: |
          set -euo pipefail
          for name in YC_FOLDER_ID YC_DEPLOY_SA_ID YC_RUNTIME_SA_ID YC_REGISTRY_ID YC_CONTAINER_NAME YDB_CONNECTION_STRING AUTO_SALE_MEDIA_BUCKET; do
            test -n "${!name:-}" || { echo "Missing GitHub repository variable: $name"; exit 1; }
          done

      - name: Request GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Exchange OIDC token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          test "$HTTP_CODE" = "200" || { echo "$BODY"; exit 1; }
          IAM_TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token')
          test -n "$IAM_TOKEN" && test "$IAM_TOKEN" != "null"
          echo "::add-mask::$IAM_TOKEN"
          echo "YC_IAM_TOKEN=$IAM_TOKEN" >> "$GITHUB_ENV"

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Build and push pinned image
        run: |
          set -euo pipefail
          IMAGE="cr.yandex/${YC_REGISTRY_ID}/auto-sale:origin-logistics-${SOURCE_SHA}"
          echo "$YC_IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
          docker build -f Dockerfile.yandex -t "$IMAGE" .
          docker push "$IMAGE"
          echo "AUTO_SALE_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Generate API credential
        run: |
          AUTO_SALE_API_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$AUTO_SALE_API_KEY"
          echo "AUTO_SALE_API_KEY=$AUTO_SALE_API_KEY" >> "$GITHUB_ENV"

      - name: Deploy pinned Yandex revision
        run: |
          set -euo pipefail
          yc serverless container revision deploy \
            --container-name "$YC_CONTAINER_NAME" \
            --folder-id "$YC_FOLDER_ID" \
            --image "$AUTO_SALE_IMAGE" \
            --cores 1 \
            --memory 512MB \
            --execution-timeout 30s \
            --service-account-id "$YC_RUNTIME_SA_ID" \
            --environment "YDB_CONNECTION_STRING=$YDB_CONNECTION_STRING" \
            --environment "AUTO_SALE_API_KEY=$AUTO_SALE_API_KEY" \
            --environment "AUTO_SALE_PUBLIC_DEMO_WRITE=true" \
            --environment "AUTO_SALE_MEDIA_BUCKET=$AUTO_SALE_MEDIA_BUCKET"

      - name: Verify raw and custom domain read-only
        run: |
          set -euo pipefail
          URL=$(yc serverless container get --name "$YC_CONTAINER_NAME" --folder-id "$YC_FOLDER_ID" --format json | jq -r '.url')
          RAW_URL="$URL" node --input-type=module <<'NODE'
          const bases=[process.env.RAW_URL.replace(/\/$/,''),'https://auto-sale-demo.viiversion.com'];
          for(const base of bases){
            let ok=false;
            for(let attempt=0;attempt<20;attempt++){
              const q='?v='+Date.now();
              const [appR,coreR,stateR,indexR]=await Promise.all([
                fetch(base+'/auto-sale-app-v3.mjs'+q,{cache:'no-store'}),
                fetch(base+'/auto-sale-core.mjs'+q,{cache:'no-store'}),
                fetch(base+'/api/auto-sale/state',{cache:'no-store'}),
                fetch(base+'/'+q,{cache:'no-store'})
              ]);
              if(appR.ok&&coreR.ok&&stateR.ok&&indexR.ok){
                const app=await appR.text(),core=await coreR.text(),state=await stateR.json(),index=await indexR.text();
                const counts={};for(const car of state.catalog||[])counts[car.origin]=(counts[car.origin]||0)+1;
                const expected={'США':80,'Грузия':49,'Корея':1,'Европа':1,'США / Грузия':2};
                const good=
                  (state.catalog||[]).length===133 &&
                  JSON.stringify(counts)===JSON.stringify(expected) &&
                  app.includes('id="originFilter"') &&
                  app.includes("['inland','Доставка']") &&
                  app.includes('Международная перевозка') &&
                  !app.includes('Доставка по США') &&
                  !app.includes('Доставка США') &&
                  core.includes('Подготовка к отправке') &&
                  core.includes('В пути') &&
                  index.includes('Автомобили из США и Грузии');
                if(good){
                  console.log('ORIGIN_LOGISTICS_DEPLOY_OK',JSON.stringify({base,revision:state.revision,catalog:state.catalog.length,origins:counts}));
                  ok=true;break;
                }
              }
              await new Promise(r=>setTimeout(r,5000));
            }
            if(!ok)throw new Error('origin_logistics_not_visible_'+base);
          }
          NODE
