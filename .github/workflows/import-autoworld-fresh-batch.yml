name: Import fresh AutoWorld batch 2026-09-25

on:
  push:
    branches:
      - prototype/auto-sale-usa
    paths:
      - .import-autoworld-fresh-batch

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prototype/auto-sale-usa
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install source parser dependencies
        run: pip install requests beautifulsoup4

      - name: Capture confirmed fresh posts and upload media
        env:
          AUTO_SALE_MEDIA_API: https://auto-sale-demo.viiversion.com/api/auto-sale/media
        run: |
          python - <<'PY'
          import importlib.util, json, os, re
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          target={'3980','3990','4000'}
          spec=importlib.util.spec_from_file_location('awg','scripts/scrape-autoworld-georgia.py')
          awg=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(awg)

          r=requests.get(
              'https://t.me/s/AutoWorld_Georgia',
              headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache','Pragma':'no-cache'},
              timeout=40
          )
          r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          cars=[]
          for msg in soup.select('.tgme_widget_message'):
              data=msg.get('data-post','')
              if '/' not in data:
                  continue
              pid=data.rsplit('/',1)[-1]
              if pid not in target:
                  continue
              node=msg.select_one('.tgme_widget_message_text')
              text=awg.clean_text(node)
              if not text:
                  raise RuntimeError(f'missing_text_{pid}')
              dt=msg.select_one('time[datetime]')
              published=dt.get('datetime','') if dt else ''
              urls=awg.photo_urls(msg)
              car=awg.parse_car(pid,f'https://t.me/AutoWorld_Georgia/{pid}',text,urls,published)
              uploaded=[]
              for i,url in enumerate(urls[:10]):
                  uploaded_url=awg.upload_photo(pid,i,url)
                  if uploaded_url:
                      uploaded.append(uploaded_url)
              if not uploaded:
                  raise RuntimeError(f'no_uploaded_photos_{pid}')
              car['photos']=uploaded
              cars.append(car)

          found={x['sourcePostId'] for x in cars}
          missing=sorted(target-found,key=int)
          if missing:
              raise RuntimeError('missing_target_posts_'+','.join(missing))
          cars.sort(key=lambda x:int(x['sourcePostId']))

          out=Path('data/autoworld-georgia-fresh-2026-09-25')
          out.mkdir(parents=True,exist_ok=True)
          (out/'cars.json').write_text(json.dumps(cars,ensure_ascii=False,indent=2)+'\n','utf-8')
          (out/'posts.txt').write_text('\n\n'.join(
              f"===== {x['sourcePostId']} | {x['sourceUrl']} =====\n{x['rawText']}" for x in cars
          )+'\n','utf-8')
          report={
              'batch':'2026-09-25',
              'source':'AutoWorld_Georgia',
              'count':len(cars),
              'postIds':[x['sourcePostId'] for x in cars],
              'photos':{x['sourcePostId']:len(x['photos']) for x in cars}
          }
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n','utf-8')
          print('FRESH_SOURCE_OK '+json.dumps(report,ensure_ascii=False))
          PY

      - name: Normalize fresh batch dry-run
        env:
          SOURCE_PATH: data/autoworld-georgia-fresh-2026-09-25/cars.json
          OUTPUT_PATH: data/autoworld-georgia-fresh-2026-09-25/catalog-import.json
          AUDIT_PATH: data/autoworld-georgia-fresh-2026-09-25/catalog-import-audit.json
          ONLY_POST_IDS: '3980,3990,4000'
          DRY_RUN: 'true'
        run: |
          node scripts/import-autoworld-catalog.mjs
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('data/autoworld-georgia-fresh-2026-09-25/catalog-import-audit.json','utf8'));
          if(a.normalizedCount!==3 || a.skippedInvalidCount!==0 || a.withPhotos!==3){
            throw new Error('fresh_batch_audit_failed '+JSON.stringify(a));
          }
          console.log('FRESH_DRY_RUN_OK',JSON.stringify(a));
          NODE

      - name: Import fresh batch into live catalog
        env:
          SOURCE_PATH: data/autoworld-georgia-fresh-2026-09-25/cars.json
          OUTPUT_PATH: data/autoworld-georgia-fresh-2026-09-25/catalog-import.json
          AUDIT_PATH: data/autoworld-georgia-fresh-2026-09-25/catalog-import-audit.json
          AUTO_SALE_STATE_URL: https://auto-sale-demo.viiversion.com/api/auto-sale/state
          ONLY_POST_IDS: '3980,3990,4000'
          REPLACE_SOURCE_ALL: 'false'
        run: node scripts/import-autoworld-catalog.mjs

      - name: Record latest imported batch
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const cars=JSON.parse(fs.readFileSync('data/autoworld-georgia-fresh-2026-09-25/cars.json','utf8'));
          const payload={
            generatedAt:new Date().toISOString(),
            batch:'2026-09-25',
            count:cars.length,
            posts:cars.map(x=>({
              sourcePostId:x.sourcePostId,
              sourceUrl:x.sourceUrl,
              publishedAt:x.publishedAt,
              title:x.title,
              vin:x.vin,
              auctionDate:x.auctionDate||'',
              photos:(x.photos||[]).length,
              rawText:x.rawText
            }))
          };
          fs.writeFileSync('data/autoworld-georgia/latest-import.json',JSON.stringify(payload,null,2)+'\n');
          NODE

      - name: Commit fresh import audit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin prototype/auto-sale-usa
          git add data/autoworld-georgia-fresh-2026-09-25 data/autoworld-georgia/latest-import.json
          if git diff --cached --quiet; then
            echo "No fresh import file changes"
            exit 0
          fi
          git commit -m "Import fresh AutoWorld Georgia cars 3980 3990 4000"
          git push origin HEAD:prototype/auto-sale-usa
