name: Verify showreel Workers AI binding
on:
  push:
    branches: [codex/showreel-deploy]
    paths: [.github/scripts/showreel-ai-pilot.py]
permissions: {contents: read}
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: python -m pip install --quiet cryptography==46.0.5
      - name: Deploy private AI relay and test real image
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python .github/scripts/showreel-ai-pilot.py
