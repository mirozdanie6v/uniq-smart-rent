name: Discover usable VIIVERSION Cloudflare credential

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-viiversion-cloudflare-credential.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      T1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      T2: ${{ secrets.VIIVERSION_CLOUDFLARE_API_TOKEN }}
      A2: ${{ secrets.VIIVERSION_CLOUDFLARE_ACCOUNT_ID }}
      T3: ${{ secrets.CF_API_TOKEN }}
      A3: ${{ secrets.CF_ACCOUNT_ID }}
      T4: ${{ secrets.CLOUDFLARE_TOKEN }}
      A4: ${{ secrets.VIIVERSION_ACCOUNT_ID }}
    steps:
      - name: Probe secret candidates without exposing values
        shell: bash
        run: |
          set -euo pipefail
          target='f4935962036fd500d34335e0b174b227'
          for i in 1 2 3 4; do
            tvar="T$i"; avar="A$i"
            token="${!tvar:-}"; configured_account="${!avar:-}"
            if [ -z "$token" ]; then
              echo "candidate $i: absent"
              continue
            fi
            echo "::add-mask::$token"
            echo "candidate $i: present"
            verify="$(curl -sS -o /tmp/verify-$i.json -w '%{http_code}'               'https://api.cloudflare.com/client/v4/user/tokens/verify'               -H "Authorization: Bearer $token" -H 'Content-Type: application/json')"
            echo "candidate $i verify HTTP=$verify status=$(jq -r '.result.status // "unknown"' /tmp/verify-$i.json 2>/dev/null || echo unknown)"
            service="$(curl -sS -o /tmp/service-$i.json -w '%{http_code}'               "https://api.cloudflare.com/client/v4/accounts/$target/workers/services/viiversion-integration"               -H "Authorization: Bearer $token" -H 'Content-Type: application/json')"
            echo "candidate $i production-worker-read HTTP=$service"
            if [ "$service" = "200" ]; then
              echo "candidate $i CAN ACCESS PRODUCTION WORKER"
            fi
            if [ -n "$configured_account" ]; then echo "candidate $i has configured account id: yes"; else echo "candidate $i has configured account id: no"; fi
          done

