name: Deploy AUTO SALE no-demo cleanup

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .deploy-auto-sale-no-demo

permissions:
  contents: read
  id-token: write

env:
  DEPLOY_SHA: bd856392b8f684b5724823399e8977daec483921
  YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
  YC_RUNTIME_SA_ID: ${{ vars.YC_RUNTIME_SA_ID }}
  YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
  YC_CONTAINER_NAME: ${{ vars.YC_CONTAINER_NAME }}
  YDB_CONNECTION_STRING: ${{ vars.YDB_CONNECTION_STRING }}
  AUTO_SALE_MEDIA_BUCKET: viiversion-auto-sale-media

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate pinned source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          npm install
          npm run check

      - name: Validate Yandex configuration
        run: |
          set -euo pipefail
          for name in YC_FOLDER_ID YC_DEPLOY_SA_ID YC_RUNTIME_SA_ID YC_REGISTRY_ID YC_CONTAINER_NAME YDB_CONNECTION_STRING AUTO_SALE_MEDIA_BUCKET; do
            test -n "${!name:-}" || { echo "Missing GitHub repository variable: $name"; exit 1; }
          done

      - name: Request GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Exchange OIDC token for Yandex IAM token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Yandex token exchange failed with HTTP $HTTP_CODE"
            echo "$BODY" | jq -c . || echo "$BODY"
            exit 1
          fi
          IAM_TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token')
          test -n "$IAM_TOKEN" && test "$IAM_TOKEN" != "null"
          echo "::add-mask::$IAM_TOKEN"
          echo "YC_IAM_TOKEN=$IAM_TOKEN" >> "$GITHUB_ENV"

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Build and push pinned image
        run: |
          set -euo pipefail
          IMAGE="cr.yandex/${YC_REGISTRY_ID}/auto-sale:no-demo-${DEPLOY_SHA}"
          echo "$YC_IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
          docker build -f Dockerfile.yandex -t "$IMAGE" .
          docker push "$IMAGE"
          echo "AUTO_SALE_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Generate staging API credential
        run: |
          set -euo pipefail
          AUTO_SALE_API_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$AUTO_SALE_API_KEY"
          echo "AUTO_SALE_API_KEY=$AUTO_SALE_API_KEY" >> "$GITHUB_ENV"

      - name: Deploy pinned Yandex revision
        run: |
          set -euo pipefail
          yc serverless container get --name "$YC_CONTAINER_NAME" --folder-id "$YC_FOLDER_ID" >/dev/null 2>&1 || \
            yc serverless container create --name "$YC_CONTAINER_NAME" --folder-id "$YC_FOLDER_ID"
          yc serverless container revision deploy \
            --container-name "$YC_CONTAINER_NAME" \
            --folder-id "$YC_FOLDER_ID" \
            --image "$AUTO_SALE_IMAGE" \
            --cores 1 \
            --memory 512MB \
            --execution-timeout 30s \
            --service-account-id "$YC_RUNTIME_SA_ID" \
            --environment "YDB_CONNECTION_STRING=$YDB_CONNECTION_STRING" \
            --environment "AUTO_SALE_API_KEY=$AUTO_SALE_API_KEY" \
            --environment "AUTO_SALE_PUBLIC_DEMO_WRITE=true" \
            --environment "AUTO_SALE_MEDIA_BUCKET=$AUTO_SALE_MEDIA_BUCKET"

      - name: Verify raw Yandex read-only
        run: |
          set -euo pipefail
          URL=$(yc serverless container get --name "$YC_CONTAINER_NAME" --folder-id "$YC_FOLDER_ID" --format json | jq -r '.url')
          test -n "$URL" && test "$URL" != "null"
          echo "STAGING_URL=$URL" >> "$GITHUB_ENV"
          for attempt in $(seq 1 20); do
            if curl -fsS "${URL%/}/api/health" >/dev/null; then break; fi
            test "$attempt" -lt 20 || exit 1
            sleep 5
          done
          node --input-type=module <<'NODE'
          const base=process.env.STAGING_URL.replace(/\/$/,'');
          const [index,app,stateR]=await Promise.all([
            fetch(base+'/').then(r=>r.text()),
            fetch(base+'/auto-sale-app-v3.mjs').then(r=>r.text()),
            fetch(base+'/api/auto-sale/state')
          ]);
          if(!index.includes('АвтоМир Грузия'))throw new Error('brand_missing_raw');
          for(const bad of ['Демо-данные','пример автомобиля','bmw-x5-22','tesla-y-23','images.unsplash.com']){
            if(app.includes(bad))throw new Error('demo_residue_raw_'+bad);
          }
          if(!app.includes('const defaultCars=[]'))throw new Error('empty_fallback_not_deployed');
          if(!stateR.ok)throw new Error('state_read_failed_'+stateR.status);
          const s=await stateR.json();
          console.log('AUTO_SALE_NO_DEMO_RAW_OK',JSON.stringify({revision:s.revision,catalog:(s.catalog||[]).length,leads:(s.leads||[]).length,quotes:(s.quotes||[]).length,orders:(s.orders||[]).length,team:(s.team||[]).length}));
          NODE

      - name: Verify custom domain read-only
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base='https://auto-sale-demo.viiversion.com';
          let index='',app='',state;
          for(let attempt=0;attempt<20;attempt++){
            index=await fetch(base+'/?v=no-demo-'+Date.now(),{cache:'no-store'}).then(r=>r.text());
            app=await fetch(base+'/auto-sale-app-v3.mjs?v=no-demo-'+Date.now(),{cache:'no-store'}).then(r=>r.text());
            const r=await fetch(base+'/api/auto-sale/state',{cache:'no-store'});
            if(r.ok)state=await r.json();
            if(index.includes('АвтоМир Грузия')&&app.includes('const defaultCars=[]')&&state)break;
            await new Promise(r=>setTimeout(r,5000));
          }
          if(!index.includes('АвтоМир Грузия'))throw new Error('brand_missing_custom');
          for(const bad of ['Демо-данные','пример автомобиля','bmw-x5-22','tesla-y-23','images.unsplash.com']){
            if(app.includes(bad))throw new Error('demo_residue_custom_'+bad);
          }
          if(!app.includes('const defaultCars=[]'))throw new Error('empty_fallback_missing_custom');
          if(!state)throw new Error('state_missing_custom');
          console.log('AUTO_SALE_NO_DEMO_CUSTOM_OK',JSON.stringify({revision:state.revision,catalog:(state.catalog||[]).length,leads:(state.leads||[]).length,quotes:(state.quotes||[]).length,orders:(state.orders||[]).length,team:(state.team||[]).length}));
          NODE
