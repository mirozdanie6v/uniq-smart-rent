name: Verify AUTO SALE manager catalog live

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - '.verify-manager-catalog-live'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DEMO_URL: https://auto-sale-demo.viiversion.com
    steps:
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Verify add edit hide and YDB persistence
        run: |
          python - <<'PY'
          import os,time
          from playwright.sync_api import sync_playwright

          base=os.environ['DEMO_URL']
          unique='QA Catalog '+str(int(time.time()))
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              page=browser.new_page(viewport={'width':1440,'height':1000},locale='ru-RU')
              page.goto(base,wait_until='networkidle',timeout=60000)
              cleanup=page.evaluate("""async()=>{
                for(let i=0;i<8;i++){
                  const state=await (await fetch('/api/auto-sale/state',{cache:'no-store'})).json();
                  const catalog=(state.catalog||[]).filter(x=>!String(x.model||'').startsWith('QA Catalog '));
                  if(catalog.length===(state.catalog||[]).length)return true;
                  const payload={baseRevision:Number(state.revision)||0,leads:state.leads||[],quotes:state.quotes||[],orders:state.orders||[],notes:state.notes||{},team:state.team||[],catalog};
                  const response=await fetch('/api/auto-sale/state',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
                  if(response.ok)return true;
                  if(response.status!==409)return false;
                  await new Promise(r=>setTimeout(r,200));
                }
                return false;
              }""")
              assert cleanup
              page.reload(wait_until='networkidle')
              page.locator('[data-role="manager"]').click()
              page.locator('[data-go="catalogAdmin"]').click()
              page.locator('[data-catalog-add]').click()
              form=page.locator('#catalogCarForm')
              form.wait_for(state='visible',timeout=10000)
              form.locator('[name="brand"]').fill('Kia')
              form.locator('[name="model"]').fill(unique)
              form.locator('[name="year"]').fill('2024')
              form.locator('[name="mileage"]').fill('12 000 км')
              form.locator('[name="engine"]').fill('3.8 бензин')
              form.locator('[name="drive"]').select_option('AWD')
              form.locator('[name="auction"]').fill('Manheim')
              form.locator('[name="price"]').fill('42000')
              form.locator('[name="delivery"]').fill('8–11 недель')
              form.locator('[name="tag"]').fill('QA SUV')
              form.locator('[name="image"]').fill('https://images.unsplash.com/photo-1494976388531-d1058494cdd8?auto=format&fit=crop&w=1400&q=82')
              form.locator('button[type="submit"]').click()
              page.wait_for_timeout(1500)

              car=page.evaluate("""(name)=>JSON.parse(localStorage.getItem('auto-sale-catalog-v1')).find(x=>x.model===name)""",unique)
              assert car and car['id'],car
              car_id=car['id']
              server=page.evaluate("""async(name)=>await (await fetch('/api/auto-sale/state',{cache:'no-store'})).json()""",unique)
              saved=[x for x in server.get('catalog',[]) if x.get('id')==car_id]
              assert saved and saved[0]['price']==42000 and saved[0].get('active') is True,saved
              print('AUTO_SALE_MANAGER_CATALOG_ADD_OK',car_id)

              page.locator(f'[data-catalog-edit="{car_id}"]').click()
              form=page.locator('#catalogCarForm')
              form.locator('[name="price"]').fill('43000')
              form.locator('[name="active"]').uncheck()
              form.locator('button[type="submit"]').click()
              page.wait_for_timeout(1500)

              server=page.evaluate("""async()=>await (await fetch('/api/auto-sale/state',{cache:'no-store'})).json()""")
              edited=[x for x in server.get('catalog',[]) if x.get('id')==car_id]
              assert edited and edited[0]['price']==43000 and edited[0].get('active') is False,edited
              print('AUTO_SALE_MANAGER_CATALOG_EDIT_OK',car_id)

              page.locator('[data-role="client"]').click()
              page.locator('.auto-bottom [data-go="catalog"]').click()
              page.wait_for_timeout(300)
              assert page.get_by_text('Kia '+unique,exact=False).count()==0
              print('AUTO_SALE_MANAGER_CATALOG_HIDE_OK',car_id)

              result=page.evaluate("""async(id)=>{
                for(let i=0;i<8;i++){
                  const state=await (await fetch('/api/auto-sale/state',{cache:'no-store'})).json();
                  const payload={baseRevision:Number(state.revision)||0,leads:state.leads||[],quotes:state.quotes||[],orders:state.orders||[],notes:state.notes||{},team:state.team||[],catalog:(state.catalog||[]).filter(x=>x.id!==id)};
                  const response=await fetch('/api/auto-sale/state',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
                  if(response.ok)return true;
                  if(response.status!==409)return false;
                  await new Promise(r=>setTimeout(r,200));
                }
                return false;
              }""",car_id)
              assert result
              page.wait_for_timeout(300)
              server=page.evaluate("""async()=>await (await fetch('/api/auto-sale/state',{cache:'no-store'})).json()""")
              assert not any(x.get('id')==car_id for x in server.get('catalog',[]))
              print('AUTO_SALE_MANAGER_CATALOG_CLEANUP_OK',car_id)
              browser.close()
          PY
