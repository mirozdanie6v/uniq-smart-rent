name: Deploy isolated AWG production

concurrency:
  group: awg-yandex-production-writer
  cancel-in-progress: false

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .deploy-awg-production-v2
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
  YC_RUNTIME_SA_ID: ${{ vars.YC_RUNTIME_SA_ID }}
  YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
  AWG_CONTAINER_NAME: autoworld-awg-prod
  AWG_CONTAINER_ID: bba691o7au7epjqvs77b
  AWG_YDB_CONNECTION_STRING: grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1ggsmuiq7tb2d27f89q/etn00ojk5iv1u7dgpdar
  AWG_MEDIA_BUCKET: viiversion-autoworld-awg-media
  AWG_GATEWAY_NAME: autoworld-awg-prod
  AUTO_SALE_TELEGRAM_APP_URL: https://awgcars.ru/
  AUTO_SALE_TELEGRAM_RELAY_URL: https://integration-telegram.viiversion.com/telegram/send
  AUTO_SALE_ADMIN_TELEGRAM_USERNAMES: Flyer_Flyer,smit44744,Ivan_AWG
  AUTO_SALE_YDB_DUAL_WRITE: "false"
  AUTO_SALE_LEGACY_STATE_WRITE: "false"
  AUTO_SALE_YDB_READ_MODE: normalized

jobs:
  deploy:
    if: github.ref == 'refs/heads/prototype/auto-sale-usa'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical AutoWorld main
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/autoworld
          ref: main
          path: autoworld

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate application
        working-directory: autoworld
        run: |
          npm ci
          npm run check

      - name: Request GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Exchange OIDC token for Yandex IAM token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Yandex token exchange failed with HTTP $HTTP_CODE"
            echo "$BODY" | jq -c . || echo "$BODY"
            exit 1
          fi
          IAM_TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token')
          test -n "$IAM_TOKEN" && test "$IAM_TOKEN" != "null"
          echo "::add-mask::$IAM_TOKEN"
          echo "YC_IAM_TOKEN=$IAM_TOKEN" >> "$GITHUB_ENV"

      - name: Install Yandex Cloud CLI
        run: |
          set -euo pipefail
          ok=false
          for attempt in 1 2 3 4; do
            rm -rf "$HOME/yandex-cloud" || true
            if curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -n; then
              ok=true
              break
            fi
            echo "Yandex CLI install attempt $attempt failed"
            sleep $((attempt * 3))
          done
          test "$ok" = true
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure Yandex Cloud CLI from OIDC token
        run: |
          set -euo pipefail
          yc config set endpoint api.cloud.yandex.net:443
          yc config set token "$YC_IAM_TOKEN"
          yc config set folder-id "$YC_FOLDER_ID"
          yc config get endpoint | grep -Fx 'api.cloud.yandex.net:443'
          yc config get folder-id | grep -Fx "$YC_FOLDER_ID"

      - name: Prepare isolated AWG YDB schema
        working-directory: autoworld
        run: |
          set -euo pipefail
          export YDB_ACCESS_TOKEN_CREDENTIALS="$YC_IAM_TOKEN"
          export YDB_CONNECTION_STRING="$AWG_YDB_CONNECTION_STRING"
          npm run prepare:ydb-runtime
          npm run initialize:ydb-domain

      - name: Build and push AWG image
        working-directory: autoworld
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          IMAGE="cr.yandex/${YC_REGISTRY_ID}/autoworld-awg:${SOURCE_SHA}"
          echo "$YC_IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
          docker build -f Dockerfile.yandex -t "$IMAGE" .
          docker push "$IMAGE"
          echo "AWG_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "AWG_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Generate AWG API credential
        run: |
          set -euo pipefail
          AUTO_SALE_API_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$AUTO_SALE_API_KEY"
          echo "AUTO_SALE_API_KEY=$AUTO_SALE_API_KEY" >> "$GITHUB_ENV"
          printf '%s' "$AUTO_SALE_API_KEY" > "$RUNNER_TEMP/awg-api-key"

      - name: Deploy AWG revision
        env:
          AUTO_SALE_TELEGRAM_BOT_TOKEN: ${{ secrets.AUTO_SALE_TELEGRAM_BOT_TOKEN }}
          AUTOWORLD_RELAY_SECRET: ${{ secrets.AUTOWORLD_RELAY_SECRET }}
          AUTO_SALE_CATALOG_IMPORT_KEY: ${{ secrets.AUTOWORLD_RELAY_SECRET }}
          AUTO_SALE_MANAGER_CHAT_IDS: ${{ vars.AUTO_SALE_MANAGER_CHAT_IDS }}
        run: |
          set -euo pipefail
          EXTRA_ENV=()
          if [ -n "${AUTO_SALE_TELEGRAM_BOT_TOKEN:-}" ]; then
            EXTRA_ENV+=(--environment "AUTO_SALE_TELEGRAM_BOT_TOKEN=$AUTO_SALE_TELEGRAM_BOT_TOKEN")
            EXTRA_ENV+=(--environment "AUTO_SALE_TELEGRAM_APP_URL=$AUTO_SALE_TELEGRAM_APP_URL")
            EXTRA_ENV+=(--environment "AUTO_SALE_TELEGRAM_RELAY_URL=$AUTO_SALE_TELEGRAM_RELAY_URL")
          fi
          if [ -n "${AUTOWORLD_RELAY_SECRET:-}" ]; then
            EXTRA_ENV+=(--environment "AUTOWORLD_RELAY_SECRET=$AUTOWORLD_RELAY_SECRET")
          fi
          if [ -n "${AUTO_SALE_CATALOG_IMPORT_KEY:-}" ]; then
            echo "::add-mask::$AUTO_SALE_CATALOG_IMPORT_KEY"
            EXTRA_ENV+=(--environment "AUTO_SALE_CATALOG_IMPORT_KEY=$AUTO_SALE_CATALOG_IMPORT_KEY")
          fi
          if [ -n "${AUTO_SALE_MANAGER_CHAT_IDS:-}" ]; then
            EXTRA_ENV+=(--environment "AUTO_SALE_MANAGER_CHAT_IDS=$AUTO_SALE_MANAGER_CHAT_IDS")
          fi

          yc serverless container revision deploy \
            --container-name "$AWG_CONTAINER_NAME" \
            --folder-id "$YC_FOLDER_ID" \
            --image "$AWG_IMAGE" \
            --cores 1 \
            --memory 512MB \
            --execution-timeout 60s \
            --service-account-id "$YC_RUNTIME_SA_ID" \
            --environment "YDB_CONNECTION_STRING=$AWG_YDB_CONNECTION_STRING" \
            --environment "AUTO_SALE_API_KEY=$AUTO_SALE_API_KEY" \
            --environment "AUTO_SALE_PUBLIC_DEMO_WRITE=false" \
            --environment "AUTO_SALE_LEGACY_STATE_WRITE=$AUTO_SALE_LEGACY_STATE_WRITE" \
            --environment "AUTO_SALE_YDB_DUAL_WRITE=$AUTO_SALE_YDB_DUAL_WRITE" \
            --environment "AUTO_SALE_YDB_READ_MODE=$AUTO_SALE_YDB_READ_MODE" \
            --environment "AUTO_SALE_ADMIN_TELEGRAM_USERNAMES=$AUTO_SALE_ADMIN_TELEGRAM_USERNAMES" \
            --environment "AUTO_SALE_MEDIA_BUCKET=$AWG_MEDIA_BUCKET" \
            "${EXTRA_ENV[@]}"

      - name: Resolve deployed AWG origin
        run: |
          set -euo pipefail
          AWG_ORIGIN=$(yc serverless container get --name "$AWG_CONTAINER_NAME" --folder-id "$YC_FOLDER_ID" --format json | jq -r '.url')
          test -n "$AWG_ORIGIN" && test "$AWG_ORIGIN" != "null"
          echo "AWG_ORIGIN=$AWG_ORIGIN" >> "$GITHUB_ENV"

      - name: Create or update AWG API Gateway
        working-directory: autoworld
        run: |
          set -euo pipefail
          SPEC=infra/yandex/awg-production-gateway.yaml
          if yc serverless api-gateway get --name "$AWG_GATEWAY_NAME" --folder-id "$YC_FOLDER_ID" >/dev/null 2>&1; then
            yc serverless api-gateway update --name "$AWG_GATEWAY_NAME" --folder-id "$YC_FOLDER_ID" --spec "$SPEC"
          else
            yc serverless api-gateway create --name "$AWG_GATEWAY_NAME" --folder-id "$YC_FOLDER_ID" --spec "$SPEC"
          fi
          GW_JSON=$(yc serverless api-gateway get --name "$AWG_GATEWAY_NAME" --folder-id "$YC_FOLDER_ID" --format json)
          GW_ID=$(printf '%s' "$GW_JSON" | jq -r '.id')
          GW_DOMAIN=$(printf '%s' "$GW_JSON" | jq -r '.domain')
          test -n "$GW_ID" && test "$GW_ID" != "null"
          test -n "$GW_DOMAIN" && test "$GW_DOMAIN" != "null"
          echo "AWG_GATEWAY_ID=$GW_ID" >> "$GITHUB_ENV"
          echo "AWG_GATEWAY_URL=https://$GW_DOMAIN/" >> "$GITHUB_ENV"
          echo "AUTO_SALE_TELEGRAM_WEBHOOK_BASE_URL=https://$GW_DOMAIN/" >> "$GITHUB_ENV"

      - name: Verify AWG gateway health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS "${AWG_GATEWAY_URL%/}/api/health" | jq -e '.ok == true and .persistence == "ydb-serverless" and .normalizedAuthoritative == true and .legacyStateWrite == "retired" and .ydbStateReadMode == "normalized" and .mediaBucket == env.AWG_MEDIA_BUCKET and .telegramNotifications == "enabled"' >/dev/null; then
              break
            fi
            test "$attempt" -lt 30 || exit 1
            sleep 5
          done
          curl -fsS "${AWG_GATEWAY_URL%/}/api/health" | jq .

      - name: Deploy canonical Telegram relay and synchronize secrets
        working-directory: autoworld/cloudflare/telegram-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.AUTO_SALE_TELEGRAM_BOT_TOKEN }}
          RELAY_SECRET: ${{ secrets.AUTOWORLD_RELAY_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$RELAY_SECRET"
          npm install
          npm test
          npx wrangler deploy --config wrangler.toml
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --config wrangler.toml
          printf '%s' "$RELAY_SECRET" | npx wrangler secret put AUTOWORLD_RELAY_SECRET --config wrangler.toml
          WEBHOOK_KEY=$(node -e "const {createHmac}=require('crypto');process.stdout.write(createHmac('sha256',process.env.TELEGRAM_BOT_TOKEN).update('auto-sale-telegram-webhook-v2').digest('hex').slice(0,32))")
          printf '%s' "${AWG_GATEWAY_URL%/}/api/auto-sale/telegram/webhook/$WEBHOOK_KEY" | npx wrangler secret put AUTOWORLD_YANDEX_WEBHOOK_URL --config wrangler.toml

      - name: Configure AutoWorld Telegram Mini App and webhook
        working-directory: autoworld
        env:
          AUTO_SALE_TELEGRAM_BOT_TOKEN: ${{ secrets.AUTO_SALE_TELEGRAM_BOT_TOKEN }}
        run: node scripts/configure-autoworld-telegram-bot.mjs

      - name: Verify Telegram relay health
        run: curl --fail --silent --show-error https://integration-telegram.viiversion.com/telegram/health | jq -e '.ok == true'

      - name: Verify canonical RU domain
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS https://awgcars.ru/api/health | jq -e '.ok == true and .persistence == "ydb-serverless" and .normalizedAuthoritative == true and .telegramNotifications == "enabled"' >/dev/null; then
              break
            fi
            test "$attempt" -lt 30 || exit 1
            sleep 5
          done
          curl -fsS https://awgcars.ru/api/health | jq '{ok,persistence,telegramNotifications,telegramRoutingReady,telegramRoutableManagers}'


      - name: Verify two-client production smoke
        run: |
          set -euo pipefail
          SMOKE=$(curl -fsS -X POST \
            -H "x-auto-sale-key: $AUTO_SALE_API_KEY" \
            https://awgcars.ru/api/auto-sale/smoke/two-client)
          printf '%s' "$SMOKE" | jq -e '
            .ok == true
            and .checks.distinctLeadIds == true
            and .checks.firstClientOwnsOnlyFirst == true
            and .checks.secondClientOwnsOnlySecond == true
            and .checks.managerNotificationPlannedForBoth == true
            and .checks.clientConfirmationPlannedForBoth == true
            and .cleanup.ok == true
          ' >/dev/null
          printf '%s' "$SMOKE" | jq '{ok,checks,planned,cleanup}'

      - name: Verify Telegram Mini App points to RU domain
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.AUTO_SALE_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          MENU=$(curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getChatMenuButton")
          printf '%s' "$MENU" | jq -e '.ok == true and .result.type == "web_app" and .result.web_app.url == "https://awgcars.ru/"' >/dev/null

      - name: Publish AWG deployment result
        run: |
          {
            echo "## AWG production origin ready"
            echo
            echo "- Source: `mirozdanie6v/autoworld@$AWG_SOURCE_SHA`"
            echo "- Container: `$AWG_CONTAINER_ID`"
            echo "- Gateway: `$AWG_GATEWAY_ID`"
            echo "- Gateway URL: `$AWG_GATEWAY_URL`"
            echo "- YDB: `etn00ojk5iv1u7dgpdar`"
            echo "- Media: `$AWG_MEDIA_BUCKET`"
            echo
            echo "Legacy demo resources were not modified."
          } | tee -a "$GITHUB_STEP_SUMMARY"
