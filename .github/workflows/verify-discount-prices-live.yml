name: Verify AUTO SALE discount prices live

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - '.verify-discount-prices-live'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Verify Nissan Kicks old and discounted prices
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          base='https://auto-sale-demo.viiversion.com'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              page=browser.new_page(viewport={'width':390,'height':844},locale='ru-RU')
              page.goto(base,wait_until='networkidle',timeout=60000)
              page.wait_for_timeout(1200)
              page.locator('[data-role="client"]').click()
              page.locator('.auto-bottom [data-go="catalog"]').click()
              page.wait_for_timeout(400)
              detail=page.locator('[data-detail="AWG-3990"]')
              assert detail.count()==1
              card=detail.locator('xpath=ancestor::article[contains(@class,"auto-car")]')
              old=card.locator('s.auto-price-old')
              current=card.locator('.auto-price b')
              assert old.count()==1
              assert '1 870 000' in old.inner_text().replace('\u00a0',' ')
              assert '1 720 000' in current.inner_text().replace('\u00a0',' ')
              assert 'цена со скидкой' in card.locator('.auto-price span').inner_text().lower()
              detail.click()
              page.wait_for_timeout(250)
              assert page.locator('.auto-detail-price-old').count()==1
              assert '1 870 000' in page.locator('.auto-detail-price-old').inner_text().replace('\u00a0',' ')
              assert '1 720 000' in page.locator('.auto-detail-price-current').inner_text().replace('\u00a0',' ')
              print('AUTO_SALE_DISCOUNT_UI_OK 1870000 1720000')
              browser.close()
          PY
