name: Validate AUTO SALE Yandex migration

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - package.json
      - index.html
      - public/**
      - tests/**
      - Dockerfile.yandex
      - .dockerignore
      - server/**
      - scripts/migrate-auto-sale-to-ydb.mjs
      - scripts/e2e-yandex-workflow.mjs
      - tests/yandex-state-sync.test.mjs
      - .github/workflows/deploy-yandex-staging.yml
      - .github/workflows/validate-yandex-migration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install and test
        run: |
          npm install
          npm run check
          node --check server/auto-sale-rules.mjs
          node --check server/ydb-state.mjs
          node --check server/ydb-sync.mjs
          node --check server/yandex-server.mjs
          node --check scripts/migrate-auto-sale-to-ydb.mjs
          node --check scripts/e2e-yandex-workflow.mjs
      - name: Build Yandex image
        run: docker build -f Dockerfile.yandex -t auto-sale-yandex:check .
