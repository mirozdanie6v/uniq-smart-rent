name: Candidate functional audit

on:
  workflow_dispatch:
  push:
    branches:
      - prototype/local-assets-role-refresh
    paths:
      - index.html
      - styles.css
      - public/**
      - assets/**
      - scripts/build.mjs
      - scripts/audit-candidate.mjs
      - tests/candidate_dist_e2e.py
      - src/**
      - tests/domain.test.mjs
      - tests/e2e.py
      - package.json
      - tsconfig.json
      - .github/workflows/candidate-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/local-assets-role-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Existing project checks and build
        run: npm run check
      - name: Candidate local asset and role audit
        run: node scripts/audit-candidate.mjs
      - name: Install browser test driver
        run: |
          python -m pip install --quiet playwright
          BROWSER=$(which google-chrome || which chromium || which chromium-browser || true)
          test -n "$BROWSER"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$BROWSER" >> "$GITHUB_ENV"
      - name: Existing app browser e2e
        run: npm run test:e2e
      - name: Deployable candidate browser e2e
        run: python tests/candidate_dist_e2e.py
