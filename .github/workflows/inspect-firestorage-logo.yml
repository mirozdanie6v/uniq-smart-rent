name: Inspect firestorage logo share

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .inspect-firestorage-logo

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Find firestorage API base
        run: |
          python - <<'PY'
          import requests,re
          urls=[
            'https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js',
            'https://firestorage.ai/_next/static/chunks/5841-1160578ba9bb4f3e.js',
            'https://firestorage.ai/_next/static/chunks/8437-d65cc193dc908afa.js'
          ]
          for u in urls:
              t=requests.get(u,timeout=30).text
              print('FILE',u,'LEN',len(t))
              for pat in [r'https?://[^"\']+',r'"/[^"]*api[^"]*"',r"'[^']*api[^']*'"]:
                  for m in re.findall(pat,t,re.I):
                      print('CAND',m[:1000])
              i=t.find('9280:')
              if i>=0:
                  print('MODULE9280',t[i:i+5000])
          PY
