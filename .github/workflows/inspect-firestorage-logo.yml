name: Inspect firestorage logo share

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .inspect-firestorage-logo

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect firestorage download API
        run: |
          python - <<'PY'
          import requests
          u='https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js'
          t=requests.get(u,timeout=30).text
          needles=['/files/','publicId','shareId','subdir','api/']
          for n in needles:
              i=t.find(n)
              if i>=0:
                  print('\nNEEDLE',n,'AT',i)
                  print(t[max(0,i-1800):i+2600])
          PY
