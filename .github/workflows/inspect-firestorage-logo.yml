name: Inspect firestorage logo share

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .inspect-firestorage-logo

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect firestorage download client
        run: |
          set -e
          curl -sSL 'https://firestorage.ai/ja/f/HHHASdPMz_Ov' -o page.html
          grep -o 'src="[^"]*\.js"' page.html | sed 's/^src="//;s/"$//' > js.txt
          cat js.txt
          while IFS= read -r p; do
            case "$p" in
              /*) ;;
              *) continue ;;
            esac
            echo "CHUNK $p"
            curl -sSL "https://firestorage.ai$p" | tr ';' '\n' | grep -E -i 'download|/api/' | head -80 || true
          done < js.txt
