name: Quick refresh AutoWorld discount prices

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - '.quick-refresh-autoworld-discounts'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prototype/auto-sale-usa
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install scraper dependencies
        run: pip install --quiet requests beautifulsoup4

      - name: Scrape only fresh source posts and merge with saved history
        env:
          AUTO_SALE_MEDIA_API: https://auto-sale-demo.viiversion.com/api/auto-sale/media
          OUT_DIR: data/autoworld-georgia
          MAX_PAGES: '12'
          MAX_PHOTOS_PER_CAR: '10'
          REQUEST_DELAY: '0.12'
          MERGE_EXISTING: 'true'
          UPLOAD_MISSING_PHOTOS: 'true'
        run: |
          LAST_ID=$(python - <<'PY'
          import json
          data=json.load(open('data/autoworld-georgia/cars.json',encoding='utf-8'))
          print(max(int(str(x.get('sourcePostId') or '0')) for x in data))
          PY
          )
          echo "LAST_ID=$LAST_ID"
          START_AFTER="$LAST_ID" python scripts/scrape-autoworld-georgia.py

      - name: Import entire saved source catalog with discount prices
        env:
          SOURCE_PATH: data/autoworld-georgia/cars.json
          OUTPUT_PATH: data/autoworld-georgia/catalog-import.json
          AUDIT_PATH: data/autoworld-georgia/catalog-import-audit.json
          AUTO_SALE_STATE_URL: https://auto-sale-demo.viiversion.com/api/auto-sale/state
          REPLACE_SOURCE_ALL: 'true'
        run: node scripts/import-autoworld-catalog.mjs

      - name: Verify Nissan Kicks discount and fresh catalog
        env:
          STATE_URL: https://auto-sale-demo.viiversion.com/api/auto-sale/state
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const source=JSON.parse(fs.readFileSync('data/autoworld-georgia/cars.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('data/autoworld-georgia/catalog-import-audit.json','utf8'));
          const state=await (await fetch(process.env.STATE_URL,{cache:'no-store'})).json();
          const kicks=(state.catalog||[]).find(x=>x.id==='AWG-3990');
          if(!kicks)throw new Error('AWG-3990 missing');
          if(Number(kicks.priceBeforeDiscountRub)!==1870000)throw new Error('old price '+kicks.priceBeforeDiscountRub);
          if(Number(kicks.priceRub)!==1720000)throw new Error('discount price '+kicks.priceRub);
          const latestSource=Math.max(...source.map(x=>Number(x.sourcePostId)||0));
          const imported=(state.catalog||[]).filter(x=>x.source==='AutoWorld_Georgia');
          console.log('AUTOWORLD_DISCOUNT_LIVE_OK',JSON.stringify({
            old:kicks.priceBeforeDiscountRub,
            current:kicks.priceRub,
            discounted:audit.discountedRub,
            sourceRows:source.length,
            imported:imported.length,
            latestSource
          }));
          NODE

      - name: Commit refreshed source data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/autoworld-georgia
          if git diff --cached --quiet; then
            echo "No dataset changes"
            exit 0
          fi
          git commit -m "Refresh AutoWorld source and discount prices"
          git pull --rebase origin prototype/auto-sale-usa
          git push origin HEAD:prototype/auto-sale-usa
