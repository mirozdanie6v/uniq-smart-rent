name: Validate UNIQ release package
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.deploy-production'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Production routing note
        run: |
          echo 'Validation complete.'
          echo 'Production uniq-smart-rent.viiversion.com is deployed by the authorized VIIVERSION runner in mirozdanie6v/rusinfocenter (.github/workflows/deploy-uniq-smart-rent-shared.yml).'
