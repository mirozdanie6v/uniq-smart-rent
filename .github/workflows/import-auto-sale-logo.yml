name: Import approved AUTO SALE logo

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .import-auto-sale-logo

permissions:
  contents: write

jobs:
  import-logo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prototype/auto-sale-usa
      - name: Decode approved logo
        run: |
          cat .tmp/auto-sale-logo-b64-{0,1,2,3,4}.txt | tr -d '\n\r' | base64 -d > public/auto-sale-logo.jpg
          echo "ac7412d8280adf96fed0addf65402badda25c9a02fce4f9937bc2c30492fe9d6  public/auto-sale-logo.jpg" | sha256sum -c -
          file public/auto-sale-logo.jpg
      - name: Commit approved logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/auto-sale-logo.jpg
          git commit -m "Add approved АвтоМир Грузия logo" || exit 0
          git push origin HEAD:prototype/auto-sale-usa
