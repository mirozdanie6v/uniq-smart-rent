name: Verify and record fresh AutoWorld import

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - '.verify-autoworld-fresh-import'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prototype/auto-sale-usa
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Verify live catalog and record source texts
        run: |
          python - <<'PY'
          import json, requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          ids=['3980','3990','4000']
          base='https://auto-sale-demo.viiversion.com'
          state=requests.get(base+'/api/auto-sale/state',timeout=30).json()
          by_id={str(x.get('id')):x for x in state.get('catalog',[])}
          expected={
            '3980':('Buick','Encore',1550000),
            '3990':('Nissan','Kicks',1870000),
            '4000':('Chevrolet','Trax',1970000)
          }
          rows=[]
          for pid in ids:
              car=by_id.get('AWG-'+pid)
              assert car,('missing live car',pid)
              brand,model,price=expected[pid]
              assert car.get('brand')==brand,(pid,car.get('brand'))
              assert car.get('model')==model,(pid,car.get('model'))
              assert int(car.get('priceRub') or 0)==price,(pid,car.get('priceRub'))
              assert str(car.get('image','')).startswith('https://storage.yandexcloud.net/'),pid
              assert len(car.get('otherPhotos',[]))==6,(pid,len(car.get('otherPhotos',[])))
              assert car.get('source')=='AutoWorld_Georgia',pid
              rows.append(car)
          print('AUTOWORLD_FRESH_STATE_OK',json.dumps({
            'revision':state.get('revision'),
            'catalogCount':len(state.get('catalog',[])),
            'ids':ids
          },ensure_ascii=False))

          headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache','Pragma':'no-cache'}
          sources=[]
          for pid in ids:
              r=requests.get(f'https://t.me/s/AutoWorld_Georgia?before={int(pid)+1}',headers=headers,timeout=40)
              r.raise_for_status()
              soup=BeautifulSoup(r.text,'html.parser')
              found=None
              for msg in soup.select('.tgme_widget_message'):
                  data=msg.get('data-post','')
                  if data.rsplit('/',1)[-1]!=pid: continue
                  node=msg.select_one('.tgme_widget_message_text')
                  text=node.get_text('\n',strip=True) if node else ''
                  dt=msg.select_one('time[datetime]')
                  found={'sourcePostId':pid,'sourceUrl':f'https://t.me/AutoWorld_Georgia/{pid}','publishedAt':dt.get('datetime','') if dt else '','rawText':text}
                  break
              assert found,('source post not found',pid)
              sources.append(found)

          out=Path('data/autoworld-georgia-fresh-2026-09-25')
          out.mkdir(parents=True,exist_ok=True)
          (out/'live-catalog.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n','utf-8')
          (out/'posts.txt').write_text('\n\n'.join(
              f"===== {x['sourcePostId']} | {x['sourceUrl']} =====\n{x['rawText']}" for x in sources
          )+'\n','utf-8')
          latest={
            'generatedAt':'2026-09-25',
            'batch':'2026-09-25',
            'count':len(rows),
            'posts':[
              {
                'sourcePostId':x['sourcePostId'],
                'sourceUrl':x['sourceUrl'],
                'publishedAt':next(s['publishedAt'] for s in sources if s['sourcePostId']==x['sourcePostId']),
                'brand':x['brand'],'model':x['model'],'year':x['year'],'vin':x.get('vin',''),
                'priceRub':x.get('priceRub',0),'photos':1+len(x.get('interiorPhotos',[]))+len(x.get('otherPhotos',[]))
              } for x in rows
            ]
          }
          Path('data/autoworld-georgia/latest-import.json').write_text(json.dumps(latest,ensure_ascii=False,indent=2)+'\n','utf-8')

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              page=browser.new_page(viewport={'width':390,'height':844},locale='ru-RU')
              page.goto(base,wait_until='networkidle',timeout=60000)
              page.wait_for_timeout(1000)
              page.locator('[data-role="client"]').click()
              page.locator('.auto-bottom [data-go="catalog"]').click()
              for pid in ids:
                  button=page.locator(f'[data-detail="AWG-{pid}"]')
                  assert button.count()==1,('card missing',pid)
              page.locator('[data-detail="AWG-3980"]').click()
              page.locator('[data-car-slider]').wait_for(state='visible',timeout=5000)
              assert page.locator('[data-car-slide]').count()==7
              print('AUTOWORLD_FRESH_UI_OK')
              browser.close()
          PY

      - name: Commit import record
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/autoworld-georgia-fresh-2026-09-25 data/autoworld-georgia/latest-import.json
          if git diff --cached --quiet; then
            echo "No import record changes"
            exit 0
          fi
          git commit -m "Record fresh AutoWorld cars 3980 3990 4000"
          git pull --rebase origin prototype/auto-sale-usa
          git push origin HEAD:prototype/auto-sale-usa
