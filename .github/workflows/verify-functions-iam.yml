name: Verify Yandex Functions IAM
on:
  push:
    branches: [prototype/auto-sale-usa]
    paths: [.verify-functions-iam]
permissions:
  contents: read
  id-token: write
env:
  YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: OIDC
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)
      - name: IAM
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          R=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          CODE=$(printf '%s' "$R" | tail -n1)
          BODY=$(printf '%s' "$R" | sed '$d')
          test "$CODE" = "200"
          TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token')
          echo "::add-mask::$TOKEN"
          echo "YC_IAM_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Install yc
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
      - name: Verify functions.editor
        run: |
          set -euo pipefail
          NAME="iam-functions-check-${GITHUB_RUN_ID}"
          YC_TOKEN="$YC_IAM_TOKEN" yc serverless function create --name "$NAME" --folder-id "$YC_FOLDER_ID"
          YC_TOKEN="$YC_IAM_TOKEN" yc serverless function get --name "$NAME" --folder-id "$YC_FOLDER_ID" --format json | jq '{id,name}'
          YC_TOKEN="$YC_IAM_TOKEN" yc serverless function delete "$NAME" --folder-id "$YC_FOLDER_ID"
          echo "FUNCTIONS_EDITOR_OK=true"
