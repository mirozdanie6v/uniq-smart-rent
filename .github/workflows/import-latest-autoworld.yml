name: Import latest AutoWorld posts

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .import-latest-autoworld

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prototype/auto-sale-usa
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape latest channel pages and upload only missing photos
        env:
          AUTO_SALE_MEDIA_API: https://auto-sale-demo.viiversion.com/api/auto-sale/media
          OUT_DIR: /tmp/autoworld-latest
          MAX_PAGES: '6'
          MAX_PHOTOS_PER_CAR: '10'
          REQUEST_DELAY: '0.20'
        run: |
          set -euo pipefail
          mkdir -p /tmp/autoworld-latest
          cp data/autoworld-georgia/cars.json /tmp/autoworld-latest/cars.json
          python scripts/scrape-autoworld-georgia.py

      - name: Merge only posts newer than current archive
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const fullPath='data/autoworld-georgia/cars.json';
          const recentPath='/tmp/autoworld-latest/cars.json';
          const full=JSON.parse(fs.readFileSync(fullPath,'utf8'));
          const recent=JSON.parse(fs.readFileSync(recentPath,'utf8'));
          const maxOld=Math.max(...full.map(x=>Number(x.sourcePostId)||0));
          const existing=new Set(full.map(x=>String(x.sourcePostId)));
          const fresh=recent
            .filter(x=>(Number(x.sourcePostId)||0)>maxOld&&!existing.has(String(x.sourcePostId)))
            .sort((a,b)=>Number(a.sourcePostId)-Number(b.sourcePostId));
          if(!fresh.length)throw new Error('no_new_posts_after_'+maxOld);
          const merged=[...full,...fresh].sort((a,b)=>Number(a.sourcePostId)-Number(b.sourcePostId));
          fs.writeFileSync(fullPath,JSON.stringify(merged,null,2)+'\n');
          fs.writeFileSync('/tmp/new-post-ids.txt',fresh.map(x=>x.sourcePostId).join(','));
          fs.writeFileSync('data/autoworld-georgia/latest-import.json',JSON.stringify({
            generatedAt:new Date().toISOString(),
            previousMaxPostId:String(maxOld),
            newCount:fresh.length,
            posts:fresh.map(x=>({
              sourcePostId:String(x.sourcePostId),
              sourceUrl:x.sourceUrl,
              publishedAt:x.publishedAt,
              title:x.title,
              vin:x.vin||'',
              photos:(x.photos||[]).length,
              rawText:x.rawText
            }))
          },null,2)+'\n');
          console.log('AUTOWORLD_FRESH_POSTS',JSON.stringify(fresh.map(x=>({
            post:x.sourcePostId,publishedAt:x.publishedAt,title:x.title,vin:x.vin,photos:(x.photos||[]).length
          }))));
          NODE

      - name: Normalize full catalog snapshot
        env:
          SOURCE_PATH: data/autoworld-georgia/cars.json
          OUTPUT_PATH: data/autoworld-georgia/catalog-import.json
          AUDIT_PATH: data/autoworld-georgia/catalog-import-audit.json
          DRY_RUN: 'true'
        run: node scripts/import-autoworld-catalog.mjs

      - name: Validate all new posts normalized
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=fs.readFileSync('/tmp/new-post-ids.txt','utf8').trim().split(',').filter(Boolean);
          const catalog=JSON.parse(fs.readFileSync('data/autoworld-georgia/catalog-import.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('data/autoworld-georgia/catalog-import-audit.json','utf8'));
          const normalized=new Map(catalog.map(x=>[String(x.sourcePostId),x]));
          const skipped=new Map((audit.skipped||[]).map(x=>[String(x.sourcePostId),x]));
          const missing=ids.filter(id=>!normalized.has(id));
          console.log('AUTOWORLD_NEW_NORMALIZATION',JSON.stringify(ids.map(id=>({
            post:id,
            normalized:normalized.has(id),
            name:normalized.has(id)?normalized.get(id).brand+' '+normalized.get(id).model:'',
            year:normalized.get(id)?.year||0,
            vin:normalized.get(id)?.vin||'',
            photos:normalized.has(id)?1+(normalized.get(id).otherPhotos||[]).length:0,
            reason:skipped.get(id)?.reason||''
          }))));
          if(missing.length)throw new Error('new_posts_not_normalized_'+missing.join('_'));
          fs.writeFileSync('/tmp/new-post-ids.txt',ids.join(','));
          NODE

      - name: Commit source and normalized snapshot safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/autoworld-georgia/cars.json data/autoworld-georgia/catalog-import.json data/autoworld-georgia/catalog-import-audit.json data/autoworld-georgia/latest-import.json
          git commit -m "Import latest AutoWorld Georgia vehicles"
          git fetch origin prototype/auto-sale-usa
          git rebase origin/prototype/auto-sale-usa
          git push origin HEAD:prototype/auto-sale-usa

      - name: Import only new posts into live YDB
        env:
          SOURCE_PATH: data/autoworld-georgia/cars.json
          OUTPUT_PATH: /tmp/autoworld-new-catalog.json
          AUDIT_PATH: /tmp/autoworld-new-audit.json
          AUTO_SALE_STATE_URL: https://auto-sale-demo.viiversion.com/api/auto-sale/state
        run: |
          set -euo pipefail
          IDS=$(cat /tmp/new-post-ids.txt)
          ONLY_POST_IDS="$IDS" node scripts/import-autoworld-catalog.mjs

      - name: Verify new cars live
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=fs.readFileSync('/tmp/new-post-ids.txt','utf8').trim().split(',').filter(Boolean);
          const r=await fetch('https://auto-sale-demo.viiversion.com/api/auto-sale/state',{cache:'no-store'});
          if(!r.ok)throw new Error('state_read_failed_'+r.status);
          const s=await r.json();
          const byPost=new Map((s.catalog||[]).map(x=>[String(x.sourcePostId),x]));
          const rows=ids.map(id=>byPost.get(id));
          if(rows.some(x=>!x))throw new Error('live_new_car_missing');
          if(rows.some(x=>!x.image||!String(x.image).startsWith('https://storage.yandexcloud.net/')))throw new Error('live_new_car_photo_missing');
          console.log('AUTOWORLD_NEW_LIVE_OK',JSON.stringify({
            revision:s.revision,
            catalog:(s.catalog||[]).length,
            cars:rows.map(x=>({post:x.sourcePostId,name:x.brand+' '+x.model,year:x.year,vin:x.vin||'',photos:1+(x.otherPhotos||[]).length}))
          }));
          NODE
