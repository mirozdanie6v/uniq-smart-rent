name: Verify existing AUTO SALE catalog edit live

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - '.verify-existing-catalog-edit'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DEMO_URL: https://auto-sale-demo.viiversion.com
    steps:
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Verify existing BMW edit and restore
        run: |
          python - <<'PY'
          import os,time
          from playwright.sync_api import sync_playwright

          base=os.environ['DEMO_URL']
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              page=browser.new_page(viewport={'width':1440,'height':1000},locale='ru-RU')
              page.goto(base,wait_until='networkidle',timeout=60000)
              page.wait_for_timeout(1800)

              page.locator('[data-role="manager"]').click()
              page.locator('[data-go="catalogAdmin"]').click()
              rows=page.locator('[data-catalog-edit]')
              assert rows.count()>=16, f"expected at least 16 existing cars, got {rows.count()}"

              bmw=page.locator('[data-catalog-edit="bmw-x5-22"]')
              assert bmw.count()==1
              bmw.click()
              form=page.locator('#catalogCarForm')
              form.wait_for(state='visible',timeout=5000)
              assert form.locator('[name="brand"]').input_value()=='BMW'
              assert form.locator('[name="model"]').input_value()=='X5 xDrive40i'
              original=int(form.locator('[name="price"]').input_value())
              temporary=original+100

              form.locator('[name="price"]').fill(str(temporary))
              form.locator('button[type="submit"]').click()

              persisted=None
              for _ in range(20):
                  page.wait_for_timeout(300)
                  state=page.evaluate("""async()=>await (await fetch('/api/auto-sale/state',{cache:'no-store'})).json()""")
                  persisted=next((x for x in state.get('catalog',[]) if x.get('id')=='bmw-x5-22'),None)
                  if persisted and int(persisted.get('price',0))==temporary:
                      break
              assert persisted and int(persisted['price'])==temporary, persisted
              print('AUTO_SALE_EXISTING_CATALOG_EDIT_YDB_OK',temporary)

              page.locator('[data-role="client"]').click()
              page.locator('.auto-bottom [data-go="catalog"]').click()
              card=page.locator('[data-detail="bmw-x5-22"]').locator('xpath=ancestor::article[contains(@class,"auto-car")]')
              assert card.count()==1
              assert '$'+format(temporary,',') in card.inner_text(), card.inner_text()
              print('AUTO_SALE_EXISTING_CATALOG_EDIT_CLIENT_OK',temporary)

              page.locator('[data-role="manager"]').click()
              page.locator('[data-go="catalogAdmin"]').click()
              page.locator('[data-catalog-edit="bmw-x5-22"]').click()
              form=page.locator('#catalogCarForm')
              form.locator('[name="price"]').fill(str(original))
              form.locator('button[type="submit"]').click()

              restored=None
              final_state=None
              for _ in range(20):
                  page.wait_for_timeout(300)
                  final_state=page.evaluate("""async()=>await (await fetch('/api/auto-sale/state',{cache:'no-store'})).json()""")
                  restored=next((x for x in final_state.get('catalog',[]) if x.get('id')=='bmw-x5-22'),None)
                  if restored and int(restored.get('price',0))==original:
                      break
              assert restored and int(restored['price'])==original, restored
              assert len(final_state.get('catalog',[]))>=16
              print('AUTO_SALE_EXISTING_CATALOG_RESTORE_OK',original,len(final_state.get('catalog',[])))
              browser.close()
          PY
