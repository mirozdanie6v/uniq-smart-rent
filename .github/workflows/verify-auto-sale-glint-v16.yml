name: Verify AUTO SALE luxury glint v17

on:
  push:
    branches:
      - prototype/auto-sale-usa
    paths:
      - .github/workflows/verify-auto-sale-glint-v16.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for v17 and verify live glint
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 36); do
            if curl -fsSL --max-time 15 "https://autoworld.viiversion.com/?_glint_check=$RANDOM" | grep -q "auto-sale-calc-cta-v17.css"; then
              echo "v17 is live"
              break
            fi
            if [ "$i" -eq 36 ]; then
              echo "v17 did not become live in time"
              exit 8
            fi
            sleep 5
          done

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"

          mkdir -p /tmp/glint-check && cd /tmp/glint-check
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 >/dev/null 2>&1

          cat > verify.cjs <<'NODE'
          const puppeteer = require('puppeteer-core');

          (async()=>{
            const browser=await puppeteer.launch({
              executablePath:process.env.CHROME,
              headless:'new',
              args:['--no-sandbox','--disable-dev-shm-usage']
            });

            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,deviceScaleFactor:1});
            await page.goto('https://autoworld.viiversion.com/?_v=16',{waitUntil:'networkidle2',timeout:60000});
            await page.waitForSelector('.auto-calc-btn:not([disabled])',{timeout:30000});

            await page.evaluate(()=>{
              document.querySelector('.auto-calc-btn:not([disabled])')?.scrollIntoView({block:'center'});
            });

            const base=await page.evaluate(()=>{
              const btn=document.querySelector('.auto-calc-btn:not([disabled])');
              const g=btn?.querySelector('.auto-calc-glint');
              if(!btn||!g)return null;
              const br=btn.getBoundingClientRect(), cs=getComputedStyle(g);
              return {
                buttonWidth:br.width,
                animationName:cs.animationName,
                animationDuration:cs.animationDuration,
                filter:cs.filter,
                boxShadow:cs.boxShadow,
                width:cs.width
              };
            });
            console.log('BASE='+JSON.stringify(base));
            if(!base) process.exit(3);

            const samples=[];
            const t0=Date.now();
            for(let i=0;i<90;i++){
              const s=await page.evaluate(()=>{
                const g=document.querySelector('.auto-calc-btn:not([disabled]) .auto-calc-glint');
                const r=g.getBoundingClientRect(), cs=getComputedStyle(g);
                return {
                  x:+r.x.toFixed(2),
                  opacity:+parseFloat(cs.opacity).toFixed(3),
                  animationName:cs.animationName,
                  animationDuration:cs.animationDuration,
                  play:cs.animationPlayState
                };
              });
              samples.push({t:Date.now()-t0,...s});
              await new Promise(r=>setTimeout(r,100));
            }

            const xs=samples.map(s=>s.x);
            const ops=samples.map(s=>s.opacity);
            const summary={
              travel:+(Math.max(...xs)-Math.min(...xs)).toFixed(2),
              maxOpacity:Math.max(...ops),
              visibleSamples:samples.filter(s=>s.opacity>=.5).length,
              name:samples[0].animationName,
              duration:samples[0].animationDuration,
              running:samples.some(s=>s.play==='running')
            };

            console.log('SUMMARY='+JSON.stringify(summary));

            const ok=
              summary.travel>300 &&
              summary.maxOpacity>=.68 &&
              summary.maxOpacity<=.82 &&
              summary.visibleSamples>=3 &&
              summary.name==='autoCalcGlintV16' &&
              summary.duration==='5.6s' &&
              summary.running;

            console.log('RESULT='+(ok?'PASS:luxury-live-glint-confirmed':'FAIL:luxury-live-glint-not-confirmed'));

            await browser.close();
            process.exit(ok?0:4);
          })().catch(e=>{console.error(e);process.exit(10)});
          NODE

          CHROME="$CHROME" node verify.cjs

# direct-selector rerun for v17
