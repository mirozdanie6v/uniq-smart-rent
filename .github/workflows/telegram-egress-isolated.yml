name: Isolated Yandex to Telegram egress diagnostic

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .telegram-egress-isolated

permissions:
  contents: read
  id-token: write

env:
  YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
  YC_RUNTIME_SA_ID: ${{ vars.YC_RUNTIME_SA_ID }}
  YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
  AUTO_SALE_TELEGRAM_BOT_TOKEN: ${{ secrets.AUTO_SALE_TELEGRAM_BOT_TOKEN }}
  AUTOWORLD_URL: https://bba01u6g86lg2q49p34d.containers.yandexcloud.net

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate isolated diagnostic inputs
        run: |
          set -euo pipefail
          for name in YC_FOLDER_ID YC_DEPLOY_SA_ID YC_RUNTIME_SA_ID YC_REGISTRY_ID AUTO_SALE_TELEGRAM_BOT_TOKEN; do
            test -n "${!name:-}" || { echo "Missing required value: $name"; exit 1; }
          done

      - name: Resolve linked test chat without modifying AutoWorld
        run: |
          set -euo pipefail
          TEST_CHAT_ID=$(curl -fsS "${AUTOWORLD_URL%/}/api/auto-sale/state" | jq -r '
            [.team[]? |
              select(.active != false) |
              select((((.telegramUsername // .telegram // "") | ascii_downcase | ltrimstr("@")) == "flyer_flyer")) |
              (.telegramUserId // "")
            ] | map(select(test("^-?[0-9]+$"))) | first // empty')
          test -n "$TEST_CHAT_ID" || { echo "Linked Flyer_Flyer Telegram chat not found"; exit 1; }
          echo "::add-mask::$TEST_CHAT_ID"
          echo "TEST_CHAT_ID=$TEST_CHAT_ID" >> "$GITHUB_ENV"

      - name: Request GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Exchange OIDC token for Yandex IAM token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          test "$HTTP_CODE" = "200" || { echo "Yandex token exchange failed: HTTP $HTTP_CODE"; echo "$BODY"; exit 1; }
          YC_IAM_TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token')
          test -n "$YC_IAM_TOKEN" && test "$YC_IAM_TOKEN" != "null"
          echo "::add-mask::$YC_IAM_TOKEN"
          echo "YC_IAM_TOKEN=$YC_IAM_TOKEN" >> "$GITHUB_ENV"

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Build minimal diagnostic image
        run: |
          set -euo pipefail
          mkdir -p /tmp/tg-egress-diag
          cat > /tmp/tg-egress-diag/server.mjs <<'NODE'
          import http from 'node:http';
          import net from 'node:net';
          import tls from 'node:tls';
          import {resolve4} from 'node:dns/promises';

          const token=String(process.env.AUTO_SALE_TELEGRAM_BOT_TOKEN||'').trim();
          const chatId=String(process.env.TEST_CHAT_ID||'').trim();
          const port=Number(process.env.PORT||8080);
          const timeoutMs=8000;
          const started=()=>performance.now();
          const elapsed=t=>Math.round((performance.now()-t)*10)/10;

          function tcpProbe(address){
            return new Promise(resolve=>{
              const t=started();
              const socket=net.connect({host:address,port:443});
              let done=false;
              const finish=result=>{if(done)return;done=true;socket.destroy();resolve({...result,ms:elapsed(t)})};
              socket.setTimeout(timeoutMs);
              socket.once('connect',()=>finish({ok:true,remoteAddress:socket.remoteAddress,remotePort:socket.remotePort}));
              socket.once('timeout',()=>finish({ok:false,error:'timeout'}));
              socket.once('error',error=>finish({ok:false,error:error.code||error.message}));
            });
          }

          function tlsProbe(address){
            return new Promise(resolve=>{
              const t=started();
              const socket=tls.connect({host:address,port:443,servername:'api.telegram.org',rejectUnauthorized:true});
              let done=false;
              const finish=result=>{if(done)return;done=true;socket.destroy();resolve({...result,ms:elapsed(t)})};
              socket.setTimeout(timeoutMs);
              socket.once('secureConnect',()=>finish({
                ok:true,
                remoteAddress:socket.remoteAddress,
                authorized:socket.authorized,
                protocol:socket.getProtocol(),
                cipher:socket.getCipher()?.name||''
              }));
              socket.once('timeout',()=>finish({ok:false,error:'timeout'}));
              socket.once('error',error=>finish({ok:false,error:error.code||error.message}));
            });
          }

          async function telegramCall(method,payload=null){
            const t=started();
            try{
              const response=await fetch('https://api.telegram.org/bot'+token+'/'+method,{
                method:payload?'POST':'GET',
                headers:payload?{'content-type':'application/json'}:undefined,
                body:payload?JSON.stringify(payload):undefined,
                signal:AbortSignal.timeout(timeoutMs)
              });
              let body={};
              try{body=await response.json()}catch{}
              return{
                ok:response.ok&&body?.ok!==false,
                httpStatus:response.status,
                telegramOk:body?.ok??null,
                error:body?.description||null,
                messageId:body?.result?.message_id||null,
                botUsername:method==='getMe'?(body?.result?.username||null):undefined,
                ms:elapsed(t)
              };
            }catch(error){
              return{ok:false,error:error?.cause?.code||error?.name||error?.message||'fetch_failed',detail:error?.cause?.message||'',ms:elapsed(t)};
            }
          }

          async function round(index){
            const dnsStart=started();
            let dns;
            try{
              const rows=await resolve4('api.telegram.org',{ttl:true});
              dns={ok:true,addresses:rows,ms:elapsed(dnsStart)};
            }catch(error){
              dns={ok:false,error:error.code||error.message,addresses:[],ms:elapsed(dnsStart)};
            }
            const connectivity=[];
            for(const row of dns.addresses||[]){
              connectivity.push({address:row.address,tcp:await tcpProbe(row.address),tls:await tlsProbe(row.address)});
            }
            const getMe=await telegramCall('getMe');
            const sendMessage=await telegramCall('sendMessage',{
              chat_id:chatId,
              text:'AUTO МИР · изолированный сетевой тест Yandex → Telegram · попытка '+index+' из 3\n'+new Date().toISOString(),
              disable_notification:true,
              disable_web_page_preview:true
            });
            return{index,at:new Date().toISOString(),dns,connectivity,getMe,sendMessage};
          }

          async function run(){
            const rounds=[];
            for(let i=1;i<=3;i++){
              rounds.push(await round(i));
              if(i<3)await new Promise(resolve=>setTimeout(resolve,1500));
            }
            return{
              ok:true,
              environment:{
                platform:'Yandex Serverless Containers',
                relayConfigured:Boolean(process.env.AUTO_SALE_TELEGRAM_RELAY_URL),
                node:process.version
              },
              rounds
            };
          }

          const server=http.createServer(async(req,res)=>{
            if(req.url!=='/run'){res.writeHead(404);res.end('not found');return}
            try{
              const result=await run();
              const body=JSON.stringify(result);
              res.writeHead(200,{'content-type':'application/json','content-length':Buffer.byteLength(body)});
              res.end(body);
            }catch(error){
              const body=JSON.stringify({ok:false,error:error.message});
              res.writeHead(500,{'content-type':'application/json','content-length':Buffer.byteLength(body)});
              res.end(body);
            }
          });
          server.listen(port,'0.0.0.0');
          NODE
          cat > /tmp/tg-egress-diag/Dockerfile <<'DOCKER'
          FROM node:22-alpine
          WORKDIR /app
          COPY server.mjs /app/server.mjs
          EXPOSE 8080
          CMD ["node","/app/server.mjs"]
          DOCKER

          DIAG_CONTAINER="tg-egress-diag-${GITHUB_RUN_ID}"
          IMAGE="cr.yandex/${YC_REGISTRY_ID}/tg-egress-diag:${GITHUB_RUN_ID}"
          echo "DIAG_CONTAINER=$DIAG_CONTAINER" >> "$GITHUB_ENV"
          echo "DIAG_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "$YC_IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
          docker build -t "$IMAGE" /tmp/tg-egress-diag
          docker push "$IMAGE"

      - name: Deploy isolated Yandex container without relay
        run: |
          set -euo pipefail
          yc serverless container create --name "$DIAG_CONTAINER" --folder-id "$YC_FOLDER_ID"
          yc serverless container revision deploy \
            --container-name "$DIAG_CONTAINER" \
            --folder-id "$YC_FOLDER_ID" \
            --image "$DIAG_IMAGE" \
            --cores 1 \
            --memory 256MB \
            --execution-timeout 180s \
            --service-account-id "$YC_RUNTIME_SA_ID" \
            --environment "AUTO_SALE_TELEGRAM_BOT_TOKEN=$AUTO_SALE_TELEGRAM_BOT_TOKEN" \
            --environment "TEST_CHAT_ID=$TEST_CHAT_ID"
          yc serverless container allow-unauthenticated-invoke "$DIAG_CONTAINER" --folder-id "$YC_FOLDER_ID"
          DIAG_URL=$(yc serverless container get --name "$DIAG_CONTAINER" --folder-id "$YC_FOLDER_ID" --format json | jq -r '.url')
          test -n "$DIAG_URL" && test "$DIAG_URL" != "null"
          echo "DIAG_URL=$DIAG_URL" >> "$GITHUB_ENV"
          echo "Diagnostic container deployed."

      - name: Run three direct Telegram egress rounds
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            code=$(curl -sS --connect-timeout 5 --max-time 190 -o /tmp/diag-report -w '%{http_code}' "${DIAG_URL%/}/run" || true)
            if [ "$code" = "200" ]; then break; fi
            test "$attempt" -lt 20 || { echo "Diagnostic endpoint did not become ready (HTTP $code)"; cat /tmp/diag-report || true; exit 1; }
            sleep 3
          done
          jq . /tmp/diag-report | tee telegram-egress-isolated-report.json
          jq -e '.environment.relayConfigured == false and (.rounds|length)==3' telegram-egress-isolated-report.json >/dev/null

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-egress-isolated-report
          path: telegram-egress-isolated-report.json
          if-no-files-found: warn

      - name: Delete temporary Yandex container
        if: always()
        run: |
          set +e
          if [ -n "${DIAG_CONTAINER:-}" ]; then
            yc serverless container delete --name "$DIAG_CONTAINER" --folder-id "$YC_FOLDER_ID"
          fi
