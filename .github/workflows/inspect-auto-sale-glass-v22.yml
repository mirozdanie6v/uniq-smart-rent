name: Inspect AUTO SALE living glass v22

on:
  push:
    branches:
      - prototype/auto-sale-usa
    paths:
      - .github/workflows/inspect-auto-sale-glass-v22.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for v22 live
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            if curl -fsSL --max-time 15 "https://autoworld.viiversion.com/?_glass_v22=$RANDOM" | grep -q "auto-sale-calc-cta-v22.css"; then
              echo "v22 is live"
              exit 0
            fi
            sleep 5
          done
          echo "v22 did not become live"
          exit 8

      - name: Capture living glass phases in Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p /tmp/glass-inspect && cd /tmp/glass-inspect
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 >/dev/null 2>&1

          cat > inspect.cjs <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');

          (async()=>{
            const browser=await puppeteer.launch({
              executablePath:process.env.CHROME,
              headless:'new',
              args:['--no-sandbox','--disable-dev-shm-usage']
            });
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,deviceScaleFactor:2});

            for(let a=0;a<12;a++){
              await page.goto('https://autoworld.viiversion.com/?_inspect_v22='+Date.now()+'_'+a,{waitUntil:'networkidle2',timeout:60000});
              const href=await page.evaluate(()=>document.querySelector('link[href*="auto-sale-calc-cta"]')?.getAttribute('href')||'');
              console.log('CSS_HREF='+href);
              if(href.includes('auto-sale-calc-cta-v22.css')) break;
              if(a===11) throw new Error('browser never loaded v22 stylesheet');
              await new Promise(r=>setTimeout(r,1200));
            }

            const btnSel='.auto-calc-btn:not([disabled])';
            const gSel=btnSel+' .auto-calc-glint';
            await page.waitForSelector(btnSel,{timeout:30000});
            await page.evaluate(sel=>document.querySelector(sel)?.scrollIntoView({block:'center'}),btnSel);
            await new Promise(r=>setTimeout(r,500));

            const meta=await page.evaluate((bsel,gsel)=>{
              const b=document.querySelector(bsel),g=document.querySelector(gsel);
              const gs=getComputedStyle(g), bef=getComputedStyle(g,'::before'), aft=getComputedStyle(g,'::after');
              return {
                buttonWidth:b.getBoundingClientRect().width,
                animationName:gs.animationName,
                animationDuration:gs.animationDuration,
                baseOpacity:gs.opacity,
                beforeOpacity:bef.opacity,
                afterOpacity:aft.opacity,
                glintWidth:gs.width,
                blend:gs.mixBlendMode
              };
            },btnSel,gSel);
            console.log('META='+JSON.stringify(meta));

            fs.mkdirSync('/tmp/glass-shots',{recursive:true});
            const phases=[
              {name:'01_start',ms:0},
              {name:'02_rising',ms:1600},
              {name:'03_peak',ms:3000},
              {name:'04_late',ms:4600}
            ];

            for(const p of phases){
              await page.evaluate((sel,ms)=>{
                const g=document.querySelector(sel);
                g.getAnimations().forEach(a=>{a.pause();a.currentTime=ms;});
                const bef=getComputedStyle(g,'::before');
              },gSel,p.ms);
              await new Promise(r=>setTimeout(r,120));
              const btn=await page.$(btnSel);
              await btn.screenshot({path:'/tmp/glass-shots/'+p.name+'.png'});
              const state=await page.evaluate(sel=>{
                const g=document.querySelector(sel);
                const gs=getComputedStyle(g), bs=getComputedStyle(g,'::before'), as=getComputedStyle(g,'::after');
                return {o:gs.opacity,before:bs.opacity,after:as.opacity,bg:gs.backgroundPosition};
              },gSel);
              console.log(p.name.toUpperCase()+'='+JSON.stringify(state));
            }

            await browser.close();
          })().catch(e=>{console.error(e);process.exit(10)});
          NODE

          CHROME="$CHROME" node inspect.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: living-glass-v22-screens
          path: /tmp/glass-shots/*.png
          if-no-files-found: error
