name: Inspect AUTO SALE premium pearlescent glass v25

on:
  push:
    branches:
      - prototype/auto-sale-usa
    paths:
      - .github/workflows/inspect-auto-sale-glass-v22.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for v25 live
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            if curl -fsSL --max-time 15 "https://autoworld.viiversion.com/?_glass_v25=$RANDOM" | grep -q "auto-sale-calc-cta-v25.css"; then
              echo "v25 is live"
              exit 0
            fi
            sleep 5
          done
          exit 8

      - name: Capture consecutive live glass frames in Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p /tmp/glass-inspect && cd /tmp/glass-inspect
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 >/dev/null 2>&1

          cat > inspect.cjs <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          (async()=>{
            const browser=await puppeteer.launch({
              executablePath:process.env.CHROME,
              headless:'new',
              args:['--no-sandbox','--disable-dev-shm-usage']
            });
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,deviceScaleFactor:2});

            for(let a=0;a<12;a++){
              await page.goto('https://autoworld.viiversion.com/?_inspect_v25='+Date.now()+'_'+a,{waitUntil:'networkidle2',timeout:60000});
              const href=await page.evaluate(()=>document.querySelector('link[href*="auto-sale-calc-cta"]')?.getAttribute('href')||'');
              console.log('CSS_HREF='+href);
              if(href.includes('auto-sale-calc-cta-v25.css')) break;
              if(a===11) throw new Error('browser never loaded v25 stylesheet');
              await sleep(1200);
            }

            const btnSel='.auto-calc-btn:not([disabled])';
            const gSel=btnSel+' .auto-calc-glint';
            await page.waitForSelector(btnSel,{timeout:30000});
            await page.evaluate(sel=>document.querySelector(sel)?.scrollIntoView({block:'center'}),btnSel);
            await sleep(800);

            fs.mkdirSync('/tmp/glass-shots',{recursive:true});

            for(let i=0;i<4;i++){
              const state=await page.evaluate(sel=>{
                const g=document.querySelector(sel);
                const gs=getComputedStyle(g);
                const bs=getComputedStyle(g,'::before');
                const as=getComputedStyle(g,'::after');
                return {
                  baseOpacity:gs.opacity,
                  beforeOpacity:bs.opacity,
                  beforeTransform:bs.transform,
                  afterOpacity:as.opacity,
                  afterTransform:as.transform,
                  beforeAnimation:bs.animationName,
                  afterAnimation:as.animationName
                };
              },gSel);
              console.log('FRAME_'+(i+1)+'='+JSON.stringify(state));
              const btn=await page.$(btnSel);
              await btn.screenshot({path:'/tmp/glass-shots/0'+(i+1)+'.png'});
              if(i<3) await sleep(1100);
            }

            await browser.close();
          })().catch(e=>{console.error(e);process.exit(10)});
          NODE

          CHROME="$CHROME" node inspect.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: refractive-glass-v25-screens
          path: /tmp/glass-shots/*.png
          if-no-files-found: error

# v25 visual inspection
