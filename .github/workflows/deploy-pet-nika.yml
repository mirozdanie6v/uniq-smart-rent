name: Deploy PET NIKA via UNIQ Cloudflare credentials

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.deploy-pet-nika'

permissions:
  contents: read

concurrency:
  group: pet-nika-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SOURCE_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require UNIQ Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$SOURCE_CLOUDFLARE_ACCOUNT_ID"

      - name: Resolve viiversion.com zone and account
        shell: bash
        run: |
          response="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=viiversion.com")"
          RESPONSE="$response" node <<'NODE'
          const data = JSON.parse(process.env.RESPONSE || '{}');
          if (!data.success) {
            const errors = (data.errors || []).map(e => `${e.code ?? 'unknown'}: ${e.message ?? 'Cloudflare API error'}`).join('; ');
            console.error(`Cloudflare zone lookup failed: ${errors || 'unknown error'}`);
            process.exit(1);
          }
          const zone = Array.isArray(data.result) ? data.result.find(z => z.name === 'viiversion.com') : null;
          if (!zone?.id || !zone?.account?.id) {
            console.error('The UNIQ Cloudflare token cannot see zone viiversion.com in any accessible account.');
            process.exit(2);
          }
          const fs = require('fs');
          fs.appendFileSync(process.env.GITHUB_ENV, `PET_NIKA_ZONE_ID=${zone.id}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `PET_NIKA_ACCOUNT_ID=${zone.account.id}\n`);
          console.log('Resolved viiversion.com zone and its owning Cloudflare account.');
          NODE

      - name: Checkout PET NIKA
        uses: actions/checkout@v4
        with:
          repository: mirozdanie6v/pet-nika
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin PET NIKA route to resolved zone
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.jsonc';
          const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
          cfg.routes = [{ pattern: 'pet-nika.viiversion.com', zone_id: process.env.PET_NIKA_ZONE_ID, custom_domain: true }];
          fs.writeFileSync(path, JSON.stringify(cfg, null, 2) + '\n');
          NODE

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify approved PET NIKA v28 UX/UI
        run: cmp --silent uxui-source/pet-nika-uxui-source.html public/index.html

      - name: Build Cloudflare production bundle
        run: npm run build:vinext

      - name: Deploy PET NIKA to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.PET_NIKA_ACCOUNT_ID }}
