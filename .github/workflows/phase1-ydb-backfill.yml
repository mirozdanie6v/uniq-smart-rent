name: Phase 1 YDB backfill parity

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .phase1-ydb-backfill

permissions:
  contents: read
  id-token: write

env:
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
  YDB_CONNECTION_STRING: ${{ vars.YDB_CONNECTION_STRING }}

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Full application check
        run: npm run check

      - name: Request GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Exchange OIDC for Yandex IAM token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          test "$CODE" = "200"
          TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token')
          test -n "$TOKEN" && test "$TOKEN" != "null"
          echo "::add-mask::$TOKEN"
          echo "YDB_ACCESS_TOKEN_CREDENTIALS=$TOKEN" >> "$GITHUB_ENV"

      - name: Backfill normalized YDB tables and verify parity
        run: npm run backfill:ydb-domain

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ydb-domain-backfill-report
          path: ydb-domain-backfill-report.json
          if-no-files-found: warn
