name: Isolated Yandex Function Telegram egress test

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .telegram-function-egress-test

permissions:
  contents: read
  id-token: write

env:
  YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
  YC_RUNTIME_SA_ID: ${{ vars.YC_RUNTIME_SA_ID }}
  AUTO_SALE_TELEGRAM_BOT_TOKEN: ${{ secrets.AUTO_SALE_TELEGRAM_BOT_TOKEN }}
  AUTOWORLD_URL: https://bba01u6g86lg2q49p34d.containers.yandexcloud.net

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve test chat
        run: |
          set -euo pipefail
          TEST_CHAT_ID=$(curl -fsS "${AUTOWORLD_URL%/}/api/auto-sale/state" | jq -r '
            [.team[]? |
              select(.active != false) |
              select((((.telegramUsername // .telegram // "") | ascii_downcase | ltrimstr("@")) == "flyer_flyer")) |
              (.telegramUserId // "")
            ] | map(select(test("^-?[0-9]+$"))) | first // empty')
          test -n "$TEST_CHAT_ID"
          echo "::add-mask::$TEST_CHAT_ID"
          echo "TEST_CHAT_ID=$TEST_CHAT_ID" >> "$GITHUB_ENV"

      - name: Request OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Exchange for Yandex IAM token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          test "$CODE" = "200"
          TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token')
          test -n "$TOKEN" && test "$TOKEN" != "null"
          echo "::add-mask::$TOKEN"
          echo "YC_IAM_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Try runtime service-account token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_RUNTIME_SA_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          if [ "$CODE" = "200" ]; then
            TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token')
            echo "::add-mask::$TOKEN"
            echo "YC_RUNTIME_IAM_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            echo "Runtime service-account token exchange succeeded"
          else
            echo "Runtime service-account token exchange unavailable: HTTP $CODE"
          fi

      - name: Install yc
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Prepare function source
        run: |
          set -euo pipefail
          mkdir -p /tmp/tg-fn
          cat > /tmp/tg-fn/index.py <<'PY'
          import os, socket, ssl, json, time, urllib.request

          TOKEN=os.environ.get("AUTO_SALE_TELEGRAM_BOT_TOKEN","")
          CHAT_ID=os.environ.get("TEST_CHAT_ID","")
          TIMEOUT=8

          def ms(t): return round((time.perf_counter()-t)*1000,1)

          def tcp(ip):
              t=time.perf_counter()
              try:
                  s=socket.create_connection((ip,443),timeout=TIMEOUT)
                  peer=s.getpeername()[0]; s.close()
                  return {"ok":True,"remoteAddress":peer,"ms":ms(t)}
              except Exception as e:
                  return {"ok":False,"error":type(e).__name__,"detail":str(e),"ms":ms(t)}

          def tls_probe(ip):
              t=time.perf_counter()
              try:
                  raw=socket.create_connection((ip,443),timeout=TIMEOUT)
                  s=ssl.create_default_context().wrap_socket(raw,server_hostname="api.telegram.org")
                  out={"ok":True,"remoteAddress":s.getpeername()[0],"protocol":s.version(),"ms":ms(t)}
                  s.close(); return out
              except Exception as e:
                  return {"ok":False,"error":type(e).__name__,"detail":str(e),"ms":ms(t)}

          def tg(method,payload=None):
              t=time.perf_counter()
              try:
                  data=json.dumps(payload).encode() if payload else None
                  headers={"content-type":"application/json"} if payload else {}
                  req=urllib.request.Request(
                      "https://api.telegram.org/bot"+TOKEN+"/"+method,
                      data=data,headers=headers,method="POST" if payload else "GET")
                  with urllib.request.urlopen(req,timeout=TIMEOUT) as r:
                      body=json.loads(r.read().decode())
                      return {
                        "ok":r.status==200 and body.get("ok") is not False,
                        "httpStatus":r.status,
                        "telegramOk":body.get("ok"),
                        "messageId":(body.get("result") or {}).get("message_id"),
                        "botUsername":(body.get("result") or {}).get("username") if method=="getMe" else None,
                        "ms":ms(t)
                      }
              except Exception as e:
                  return {"ok":False,"error":type(e).__name__,"detail":str(e),"ms":ms(t)}

          def handler(event,context):
              rounds=[]
              for i in range(1,4):
                  t=time.perf_counter()
                  try:
                      infos=socket.getaddrinfo("api.telegram.org",443,socket.AF_INET,socket.SOCK_STREAM)
                      ips=sorted(set(x[4][0] for x in infos))
                      dns={"ok":True,"addresses":ips,"ms":ms(t)}
                  except Exception as e:
                      ips=[]; dns={"ok":False,"error":type(e).__name__,"detail":str(e),"addresses":[],"ms":ms(t)}
                  conn=[{"address":ip,"tcp":tcp(ip),"tls":tls_probe(ip)} for ip in ips]
                  rounds.append({
                    "index":i,
                    "dns":dns,
                    "connectivity":conn,
                    "getMe":tg("getMe"),
                    "sendMessage":tg("sendMessage",{
                      "chat_id":CHAT_ID,
                      "text":f"AUTO МИР · Yandex Cloud Function → Telegram test · {i}/3 · {time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}",
                      "disable_notification":True
                    })
                  })
                  if i<3: time.sleep(1.5)
              return {"environment":{"platform":"Yandex Cloud Functions","relayConfigured":False},"rounds":rounds}
          PY
          cd /tmp/tg-fn && zip -q function.zip index.py
          echo "FUNC_NAME=tg-fn-egress-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Create, invoke, delete function
        run: |
          set -euo pipefail
          create_with_token() {
            local token="$1"
            YC_TOKEN="$token" yc serverless function create --name "$FUNC_NAME" --folder-id "$YC_FOLDER_ID"
          }
          if create_with_token "$YC_IAM_TOKEN"; then
            ACTIVE_TOKEN="$YC_IAM_TOKEN"
            echo "Function create authorized by deploy service account"
          elif [ -n "${YC_RUNTIME_IAM_TOKEN:-}" ] && create_with_token "$YC_RUNTIME_IAM_TOKEN"; then
            ACTIVE_TOKEN="$YC_RUNTIME_IAM_TOKEN"
            echo "Function create authorized by runtime service account"
          else
            echo "Neither available service account can create Cloud Functions"
            exit 1
          fi
          trap 'YC_TOKEN="$ACTIVE_TOKEN" yc serverless function delete "$FUNC_NAME" --folder-id "$YC_FOLDER_ID" || true' EXIT
          YC_TOKEN="$ACTIVE_TOKEN" yc serverless function version create \
            --function-name "$FUNC_NAME" \
            --folder-id "$YC_FOLDER_ID" \
            --runtime python312 \
            --entrypoint index.handler \
            --memory 256m \
            --execution-timeout 180s \
            --service-account-id "$YC_RUNTIME_SA_ID" \
            --environment "AUTO_SALE_TELEGRAM_BOT_TOKEN=$AUTO_SALE_TELEGRAM_BOT_TOKEN" \
            --environment "TEST_CHAT_ID=$TEST_CHAT_ID" \
            --source-path /tmp/tg-fn/function.zip
          YC_TOKEN="$ACTIVE_TOKEN" yc serverless function invoke "$FUNC_NAME" -d '{}' --folder-id "$YC_FOLDER_ID" --format json | tee telegram-function-egress-report.json
          jq -e '.environment.platform=="Yandex Cloud Functions" and (.rounds|length)==3' telegram-function-egress-report.json >/dev/null

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-function-egress-report
          path: telegram-function-egress-report.json
          if-no-files-found: warn
