name: Import selected AutoWorld offers

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .import-selected-autoworld-offers

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      BRANCH: prototype/auto-sale-usa
      SELECTED_IDS: 3723,3290,3310,3262,3282,3357,3373
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Regenerate full AutoWorld catalog snapshot
        run: |
          set -euo pipefail
          SOURCE_PATH=data/autoworld-georgia/cars.json \
          OUTPUT_PATH=data/autoworld-georgia/catalog-import.json \
          AUDIT_PATH=data/autoworld-georgia/catalog-import-audit.json \
          DRY_RUN=true \
          node scripts/import-autoworld-catalog.mjs

      - name: Verify regenerated catalog
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=['3723','3290','3310','3262','3282','3357','3373'];
          const catalog=JSON.parse(fs.readFileSync('data/autoworld-georgia/catalog-import.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('data/autoworld-georgia/catalog-import-audit.json','utf8'));
          const selected=ids.map(id=>catalog.find(x=>String(x.sourcePostId)===id));
          if(catalog.length!==124)throw new Error('expected_124_catalog_rows_'+catalog.length);
          if(selected.some(x=>!x))throw new Error('selected_offer_missing');
          if(selected.some(x=>x.vin))throw new Error('selected_offer_unexpected_vin');
          if(selected.some(x=>!x.image||!String(x.image).startsWith('https://storage.yandexcloud.net/')))throw new Error('selected_offer_photo_missing');
          const expectedBodies={
            '3723':'Кроссовер / SUV',
            '3290':'Кроссовер / SUV',
            '3310':'Кроссовер / SUV',
            '3262':'Кроссовер / SUV',
            '3282':'Кроссовер / SUV',
            '3357':'Компактный автомобиль',
            '3373':'Кроссовер / SUV'
          };
          for(const x of selected){
            if(x.body!==expectedBodies[String(x.sourcePostId)])throw new Error('unexpected_body_'+x.sourcePostId+'_'+x.body);
            if(!x.brand||!x.model||!x.year)throw new Error('identity_missing_'+x.sourcePostId);
          }
          if(audit.normalizedCount!==124)throw new Error('audit_normalized_count_'+audit.normalizedCount);
          console.log('SELECTED_NORMALIZATION_OK',JSON.stringify(selected.map(x=>({
            id:x.id,post:x.sourcePostId,name:x.brand+' '+x.model,year:x.year,photos:1+(x.otherPhotos||[]).length,body:x.body
          }))));
          NODE

      - name: Commit regenerated catalog snapshot safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/autoworld-georgia/catalog-import.json data/autoworld-georgia/catalog-import-audit.json
          if git diff --cached --quiet; then
            echo "Catalog snapshot already current"
          else
            git commit -m "Include selected non-VIN AutoWorld offers"
            git fetch origin "$BRANCH"
            REMOTE_SHA=$(git rev-parse "origin/$BRANCH")
            if [ "$REMOTE_SHA" != "${{ github.sha }}" ]; then
              echo "Branch moved during snapshot generation: $REMOTE_SHA != ${{ github.sha }}" >&2
              exit 1
            fi
            git push origin "HEAD:$BRANCH"
          fi

      - name: Import only selected offers into live YDB
        run: |
          set -euo pipefail
          SOURCE_PATH=data/autoworld-georgia/cars.json \
          OUTPUT_PATH=/tmp/autoworld-selected.json \
          AUDIT_PATH=/tmp/autoworld-selected-audit.json \
          ONLY_POST_IDS="$SELECTED_IDS" \
          node scripts/import-autoworld-catalog.mjs

      - name: Verify selected offers live
        run: |
          node --input-type=module <<'NODE'
          const ids=['3723','3290','3310','3262','3282','3357','3373'];
          const r=await fetch('https://auto-sale-demo.viiversion.com/api/auto-sale/state',{headers:{accept:'application/json'}});
          if(!r.ok)throw new Error('state_read_failed_'+r.status);
          const state=await r.json();
          const catalog=Array.isArray(state.catalog)?state.catalog:[];
          const selected=ids.map(id=>catalog.find(x=>String(x.sourcePostId)===id));
          if(selected.some(x=>!x))throw new Error('live_selected_offer_missing');
          if(selected.some(x=>String(x.source)!=='AutoWorld_Georgia'||x.active===false))throw new Error('live_selected_offer_invalid');
          console.log('SELECTED_AUTOWORLD_LIVE_OK',JSON.stringify({
            revision:state.revision,
            catalog:catalog.length,
            selected:selected.map(x=>({id:x.id,name:x.brand+' '+x.model,year:x.year,photos:1+(x.otherPhotos||[]).length}))
          }));
          NODE
