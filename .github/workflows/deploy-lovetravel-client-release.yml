name: Deploy LoveTravel client release via UNIQ

on:
  push:
    branches: [main]
    paths:
      - '.deploy-lovetravel-client-release'
      - '.github/workflows/deploy-lovetravel-client-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout integration service
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/viiversion
          ref: main
          path: viiversion

      - name: Checkout LoveTravel
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/LoveTravel-
          ref: main
          path: lovetravel

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify Cloudflare access
        run: npx --yes wrangler@latest whoami

      - name: Verify integration service
        working-directory: viiversion/integration-service
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-fund --no-audit
          npm run typecheck
          npm test
          npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Deploy integration service
        working-directory: viiversion/integration-service
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          delete cfg.routes;
          fs.writeFileSync('wrangler.release.jsonc', JSON.stringify(cfg,null,2)+'\n');
          NODE
          npx wrangler deploy --config wrangler.release.jsonc


      - name: Verify integration service
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 24); do
            if curl -fsS 'https://integration.viiversion.com/api/bokun/status?vendorId=137689' > /tmp/status.json; then
              if jq -e '.ok == true and .oauthConnected == true and .restCredentialsReady == true and .vendorId == "137689"' /tmp/status.json >/dev/null; then
                code="$(curl -sS -o /tmp/no-token.json -w '%{http_code}' -X POST                   'https://integration.viiversion.com/internal/lovetravel/bokun/demo-submit?vendorId=137689&currency=USD'                   -H 'content-type: application/json' --data '{}')"
                if [ "$code" = 401 ]; then ok=1; break; fi
              fi
            fi
            sleep 5
          done
          test "$ok" -eq 1
          jq '{ok,vendorId,oauthConnected,restCredentialsReady,realBookingWriteEnabled,oneTimeBookingTestArmed}' /tmp/status.json

      - name: Verify LoveTravel
        working-directory: lovetravel
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-fund --no-audit
          npm run check
          npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Deploy LoveTravel
        working-directory: lovetravel
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          delete cfg.routes;
          fs.writeFileSync('wrangler.release.jsonc', JSON.stringify(cfg,null,2)+'\n');
          NODE
          npx wrangler deploy --config wrangler.release.jsonc


      - name: Verify live release
        shell: bash
        run: |
          set -euo pipefail

          code="$(curl -sS -o /tmp/app-no-token.json -w '%{http_code}' -X POST             'https://lovetravel.viiversion.com/api/bokun/client-demo/submit'             -H 'content-type: application/json' --data '{}')"
          test "$code" = 403

          for locale in ru en vi zh ko; do
            curl -fsS "https://lovetravel.viiversion.com/api/bokun/tours?locale=$locale" > "/tmp/tours-$locale.json"
            jq -e '.ok == true and .source == "bokun" and .vendorId == "137689" and ([.tours[].id]|sort) == ["1287578","1287580"]' "/tmp/tours-$locale.json" >/dev/null
          done

          for locale in ru en vi zh ko; do
            payload="$(jq -nc --arg locale "$locale" --arg message "Tell me about the available tours" '{locale:$locale,message:$message}')"
            curl -fsS -X POST 'https://lovetravel.viiversion.com/api/ai/chat'               -H 'content-type: application/json'               -H "x-max-tour-locale: $locale"               --data "$payload" > "/tmp/ai-$locale.json"
            jq -e '.ok == true and (.reply|type=="string") and (.reply|length>0) and (.tourId == "" or .tourId == "1287578" or .tourId == "1287580") and ((.source // "") | contains("bokun"))' "/tmp/ai-$locale.json" >/dev/null
          done

          jq '{zh_titles:[.tours[].title]}' /tmp/tours-zh.json
          jq '{ok,source,tourId,reply}' /tmp/ai-zh.json
          echo 'LoveTravel client release verified.'
