name: Deploy TRUE SURF Mini App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.deploy-true-surf-app'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TRUE SURF Mini App source
        uses: actions/checkout@v4
        with:
          repository: mirozdanie6v/true-surf
          ref: 5a3cc0c6bd727c049c5edb7b99da766cc34e4d63
          path: true-surf-app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure separate Cloudflare Worker and domain
        working-directory: true-surf-app
        run: |
          cat > wrangler.jsonc <<'EOF'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "main": ".open-next/worker.js",
            "name": "true-surf-app",
            "compatibility_date": "2026-08-21",
            "compatibility_flags": ["nodejs_compat"],
            "routes": [
              {
                "pattern": "truesurf-app.viiversion.com",
                "custom_domain": true
              }
            ],
            "assets": {
              "directory": ".open-next/assets",
              "binding": "ASSETS"
            },
            "observability": {
              "enabled": true
            }
          }
          EOF

      - name: Install dependencies
        working-directory: true-surf-app
        run: npm install

      - name: Typecheck
        working-directory: true-surf-app
        run: npm run typecheck

      - name: Deploy TRUE SURF Mini App
        working-directory: true-surf-app
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
