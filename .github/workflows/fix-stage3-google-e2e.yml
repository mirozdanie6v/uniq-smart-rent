name: Fix Stage 3 Google Maps E2E noise
on:
  push:
    branches:
      - refactor/react-typescript-vite-demo
    paths:
      - '.stage3-google-e2e-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/react-typescript-vite-demo
      - name: Patch Google Maps console filter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/e2e.py')
          s=p.read_text()
          old="        'maps.googleapis.com' in text or\n"
          new="        'maps.googleapis.com' in text or 'maps.googleapis.com' in location_url or\n"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e.py
          git commit -m 'Ignore Google Maps iframe noise in E2E'
          git push origin HEAD:refactor/react-typescript-vite-demo
