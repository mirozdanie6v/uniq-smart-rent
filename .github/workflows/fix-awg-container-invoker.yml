name: Fix AWG container invoker

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .fix-awg-container-invoker
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
  AWG_CONTAINER_ID: bba691o7au7epjqvs77b
  AWG_RUNTIME_SA_ID: aje8o9ric0d20k11521r
  AWG_GATEWAY_URL: https://d5dbgio6limv03usvipl.s183zexc.apigw.yandexcloud.net

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Request GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Exchange OIDC token for Yandex IAM token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          test "$HTTP_CODE" = "200" || { echo "$BODY"; exit 1; }
          IAM_TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token')
          echo "::add-mask::$IAM_TOKEN"
          echo "YC_IAM_TOKEN=$IAM_TOKEN" >> "$GITHUB_ENV"

      - name: Inspect AWG container access bindings
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $YC_IAM_TOKEN" \
            "https://serverless-containers.api.cloud.yandex.net/containers/v1/containers/$AWG_CONTAINER_ID:listAccessBindings" \
            | tee /tmp/bindings-before.json | jq .

      - name: Grant runtime SA container invoker
        run: |
          set -euo pipefail
          BODY=$(jq -n \
            --arg sa "$AWG_RUNTIME_SA_ID" \
            '{accessBindingDeltas:[{action:"ADD",accessBinding:{roleId:"serverless-containers.containerInvoker",subject:{id:$sa,type:"serviceAccount"}}}]}')
          CODE=$(curl -sS -o /tmp/grant-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $YC_IAM_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$BODY" \
            "https://serverless-containers.api.cloud.yandex.net/containers/v1/containers/$AWG_CONTAINER_ID:updateAccessBindings")
          cat /tmp/grant-response.json | jq . || cat /tmp/grant-response.json
          test "$CODE" = "200"

      - name: Verify binding and gateway
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            BINDINGS=$(curl -fsS \
              -H "Authorization: Bearer $YC_IAM_TOKEN" \
              "https://serverless-containers.api.cloud.yandex.net/containers/v1/containers/$AWG_CONTAINER_ID:listAccessBindings")
            if printf '%s' "$BINDINGS" | jq -e --arg sa "$AWG_RUNTIME_SA_ID" '.accessBindings[]? | select(.roleId=="serverless-containers.containerInvoker" and .subject.id==$sa)' >/dev/null; then
              break
            fi
            test "$attempt" -lt 20 || exit 1
            sleep 3
          done
          for attempt in $(seq 1 25); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$AWG_GATEWAY_URL/api/health" || true)
            if [ "$code" = "200" ] && jq -e '.ok == true and .persistence == "ydb-serverless" and .normalizedAuthoritative == true and .legacyStateWrite == "retired" and .ydbStateReadMode == "normalized" and .mediaBucket == "viiversion-autoworld-awg-media"' /tmp/health.json >/dev/null; then
              cat /tmp/health.json | jq .
              exit 0
            fi
            echo "Gateway health attempt $attempt HTTP $code"
            cat /tmp/health.json || true
            sleep 4
          done
          exit 1
