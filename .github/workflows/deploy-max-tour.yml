name: Deploy MAX TOUR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.deploy-max-tour'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_URL: https://max-tour.viiversion.com

    steps:
      - name: Checkout MAX TOUR
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/MAX-TOUR
          ref: main
          path: max-tour

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: max-tour/package-lock.json

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          echo 'Cloudflare deployment credentials are available.'

      - name: Install, typecheck, test and build
        working-directory: max-tour
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Apply D1 migrations
        working-directory: max-tour
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Seed verified MAX TOUR baseline
        working-directory: max-tour
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --file=seed/verified-max-tour-data.sql --yes

      - name: Deploy Worker, assets and custom domain
        working-directory: max-tour
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc

      - name: Production smoke
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 24); do
            code=$(curl -L -sS --connect-timeout 5 --max-time 15 -o /tmp/health.json -w '%{http_code}' "${TARGET_URL}/api/health" || true)
            if [ "$code" = "200" ] && jq -e '.ok == true and .service == "max-tour-demo" and .database == "D1"' /tmp/health.json >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1
          curl -L -fsS --connect-timeout 5 --max-time 20 "${TARGET_URL}/" -o /tmp/home.html
          grep -q 'MAX TOUR' /tmp/home.html
          echo 'MAX TOUR production deployment verified.'
