name: Audit latest AutoWorld raw posts

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .audit-latest-autoworld-posts

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install requests beautifulsoup4
      - name: List every raw post newer than 3828
        run: |
          python - <<'PY'
          import requests, json, re, html, time
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          url='https://t.me/s/AutoWorld_Georgia'
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 Chrome/126 Safari/537.36','Accept-Language':'ru,en;q=0.8'})
          seen_pages=set()
          rows={}
          for page in range(10):
              if not url or url in seen_pages: break
              seen_pages.add(url)
              r=session.get(url,timeout=40); r.raise_for_status()
              soup=BeautifulSoup(r.text,'html.parser')
              for msg in soup.select('.tgme_widget_message'):
                  dp=msg.get('data-post','')
                  if '/' not in dp: continue
                  pid=int(dp.rsplit('/',1)[-1])
                  if pid<=3828: continue
                  node=msg.select_one('.tgme_widget_message_text')
                  text=node.get_text('\n',strip=True) if node else ''
                  text=re.sub(r'\n{3,}','\n\n',text).strip()
                  dt=msg.select_one('time[datetime]')
                  published=dt.get('datetime','') if dt else ''
                  urls=[]
                  for el in msg.select('.tgme_widget_message_photo_wrap, .tgme_widget_message_photo, .grouped_media_wrap'):
                      style=el.get('style','')
                      for u in re.findall(r'background-image:\s*url\(["\']?([^"\')]+)',style):
                          u=html.unescape(u)
                          if u.startswith('//'):u='https:'+u
                          if u.startswith('http') and u not in urls:urls.append(u)
                  for img in msg.select('img[src]'):
                      u=img.get('src','')
                      if 'telesco.pe/file/' in u and u not in urls:urls.append(u)
                  rows[pid]={'post':pid,'publishedAt':published,'photos':len(urls),'text':text}
              prev=soup.select_one('link[rel="prev"]') or soup.select_one(".tme_messages_more[href*='before=']")
              href=prev.get('href','') if prev else ''
              if not href: break
              url=urljoin('https://t.me',href)
              time.sleep(.2)
          out=[rows[k] for k in sorted(rows)]
          print('AUTOWORLD_RAW_NEW_POSTS '+json.dumps(out,ensure_ascii=False))
          print('AUTOWORLD_RAW_NEW_POST_COUNT',len(out))
          PY
