name: Deploy Telegram relay to Cloudflare
on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - 'cloudflare/telegram-relay/**'
      - '.github/workflows/deploy-telegram-relay.yml'
      - '.deploy-telegram-relay'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install and test
        working-directory: cloudflare/telegram-relay
        run: npm install && npm test
      - name: Deploy Worker
        working-directory: cloudflare/telegram-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml
      - name: Configure Telegram secret
        working-directory: cloudflare/telegram-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.AUTO_SALE_TELEGRAM_BOT_TOKEN }}
        run: printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --config wrangler.toml
      - name: Verify relay
        run: curl --fail --silent --show-error https://integrationrevision.com/telegram/health
