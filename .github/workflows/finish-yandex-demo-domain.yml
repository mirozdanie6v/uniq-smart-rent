name: Finish AUTO SALE Yandex demo domain

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - '.finish-yandex-demo-domain'

permissions:
  contents: read
  id-token: write

env:
  YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
  GATEWAY_ID: d5d7e3tivcgnbe167btb
  CERT_ID: fpqca11j683rem8j8jfn
  DEMO_DOMAIN: auto-sale-demo.viiversion.com

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Request GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Exchange OIDC token for Yandex IAM token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          test "$HTTP_CODE" = "200" || { echo "$BODY"; exit 1; }
          IAM_TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token')
          test -n "$IAM_TOKEN" && test "$IAM_TOKEN" != "null"
          echo "::add-mask::$IAM_TOKEN"
          echo "YC_IAM_TOKEN=$IAM_TOKEN" >> "$GITHUB_ENV"

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Wait for certificate issuance
        run: |
          set -euo pipefail
          API="https://certificate-manager.api.cloud.yandex.net/certificate-manager/v1/certificates/$CERT_ID?view=FULL"
          for attempt in $(seq 1 60); do
            curl -fsS -H "Authorization: Bearer $YC_IAM_TOKEN" "$API" > /tmp/cert.json
            STATUS=$(jq -r '.status' /tmp/cert.json)
            CHALLENGE=$(jq -r '.challenges[0].status // empty' /tmp/cert.json)
            MESSAGE=$(jq -r '.challenges[0].message // empty' /tmp/cert.json)
            echo "certificate=$STATUS challenge=$CHALLENGE $MESSAGE"
            if [ "$STATUS" = "ISSUED" ]; then
              exit 0
            fi
            if [ "$STATUS" = "INVALID" ] || [ "$STATUS" = "REVOKED" ]; then
              cat /tmp/cert.json
              exit 1
            fi
            test "$attempt" -lt 60 || { cat /tmp/cert.json; exit 1; }
            sleep 10
          done

      - name: Attach custom domain to API Gateway
        run: |
          set -euo pipefail
          if yc serverless api-gateway get --id "$GATEWAY_ID" --folder-id "$YC_FOLDER_ID" --format json | jq -e --arg d "$DEMO_DOMAIN" '.attached_domains[]? | select(.domain_id? == $d or .domain? == $d or .domain_name? == $d)' >/dev/null 2>&1; then
            echo "Domain already attached"
          else
            yc serverless api-gateway add-domain \
              --id "$GATEWAY_ID" \
              --domain "$DEMO_DOMAIN" \
              --certificate-id "$CERT_ID" \
              --folder-id "$YC_FOLDER_ID"
          fi

      - name: Verify custom domain
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            ROOT_CODE=$(curl -sS -o /tmp/root.html -w '%{http_code}' "https://$DEMO_DOMAIN/")
            HEALTH_CODE=$(curl -sS -o /tmp/health.json -w '%{http_code}' "https://$DEMO_DOMAIN/api/health")
            echo "attempt=$attempt root=$ROOT_CODE health=$HEALTH_CODE"
            if [ "$ROOT_CODE" = "200" ] && [ "$HEALTH_CODE" = "200" ] && jq -e '.ok == true and .persistence == "ydb-serverless"' /tmp/health.json >/dev/null; then
              echo "AUTO_SALE_CUSTOM_DOMAIN_OK https://$DEMO_DOMAIN/"
              cat /tmp/health.json
              exit 0
            fi
            sleep 10
          done
          exit 1
