name: Verify AUTO SALE live glint v14

on:
  push:
    branches:
      - prototype/auto-sale-usa
    paths:
      - .github/workflows/verify-auto-sale-glint-v14.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live glint in Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p /tmp/glint-check && cd /tmp/glint-check
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 >/dev/null 2>&1
          cat > verify.cjs <<'NODE'
          const puppeteer = require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:'new',args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,deviceScaleFactor:1});
            await page.goto('https://autoworld.viiversion.com/',{waitUntil:'networkidle2',timeout:60000});
            await page.waitForSelector('.auto-calc-btn:not([disabled])',{timeout:30000});
            await page.evaluate(()=>document.querySelector('.auto-calc-btn:not([disabled])')?.scrollIntoView({block:'center'}));
            const samples=[];
            const t0=Date.now();
            for(let i=0;i<75;i++){
              const s=await page.evaluate(()=>{
                const g=document.querySelector('.auto-calc-btn:not([disabled]) .auto-calc-glint');
                if(!g)return null;
                const r=g.getBoundingClientRect(),cs=getComputedStyle(g);
                return {x:+r.x.toFixed(2),opacity:+parseFloat(cs.opacity).toFixed(3),animationName:cs.animationName,animationDuration:cs.animationDuration,animationPlayState:cs.animationPlayState};
              });
              if(!s) throw new Error('glint missing');
              samples.push({t:Date.now()-t0,...s});
              await new Promise(r=>setTimeout(r,100));
            }
            const xs=samples.map(s=>s.x), ops=samples.map(s=>s.opacity);
            const summary={travel:+(Math.max(...xs)-Math.min(...xs)).toFixed(2),maxOpacity:Math.max(...ops),visibleSamples:samples.filter(s=>s.opacity>=.2).length,animationName:samples[0].animationName,animationDuration:samples[0].animationDuration,running:samples.some(s=>s.animationPlayState==='running')};
            console.log('SUMMARY='+JSON.stringify(summary));
            const ok=summary.travel>100 && summary.maxOpacity>=.3 && summary.maxOpacity<=.55 && summary.animationName==='autoCalcGlintV14' && summary.animationDuration==='4.8s' && summary.running;
            console.log('RESULT='+(ok?'PASS:soft-live-glint-confirmed':'FAIL:soft-live-glint-not-confirmed'));
            await browser.close();
            process.exit(ok?0:4);
          })().catch(e=>{console.error(e);process.exit(10)});
          NODE
          CHROME="$CHROME" node verify.cjs
