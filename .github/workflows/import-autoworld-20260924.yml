name: Import AutoWorld 24 Sep vehicle batch

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .import-autoworld-20260924

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prototype/auto-sale-usa
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch exact source posts and upload their photos
        env:
          AUTO_SALE_MEDIA_API: https://auto-sale-demo.viiversion.com/api/auto-sale/media
        run: |
          python - <<'PY'
          import json, re, time, importlib.util
          from pathlib import Path
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup

          spec=importlib.util.spec_from_file_location("awg","scripts/scrape-autoworld-georgia.py")
          awg=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(awg)

          targets={'3902','3912','3922','3931','3941','3950','3960','3969'}
          existing_path=Path('data/autoworld-georgia/cars.json')
          existing=json.loads(existing_path.read_text('utf-8'))
          existing_by={str(x.get('sourcePostId')):x for x in existing}
          found={}
          url=awg.START_URL
          seen=set()

          for page in range(14):
              if not url or url in seen: break
              seen.add(url)
              raw=awg.fetch_page(url)
              soup=BeautifulSoup(raw,'html.parser')
              for msg in soup.select('.tgme_widget_message'):
                  dp=msg.get('data-post','')
                  if '/' not in dp: continue
                  pid=dp.rsplit('/',1)[-1]
                  if pid not in targets or pid in found: continue
                  text=awg.clean_text(msg.select_one('.tgme_widget_message_text'))
                  dt=msg.select_one('time[datetime]')
                  published=dt.get('datetime','') if dt else ''
                  src=f'https://t.me/{awg.CHANNEL}/{pid}'
                  source_photos=awg.photo_urls(msg)
                  car=awg.parse_car(pid,src,text,source_photos,published)

                  old=existing_by.get(pid,{})
                  old_photos=[x for x in old.get('photos',[]) if str(x).startswith('https://storage.yandexcloud.net/')]
                  if old_photos:
                      car['photos']=old_photos[:10]
                  else:
                      uploaded=[]
                      for i,purl in enumerate(source_photos[:10]):
                          u=awg.upload_photo(pid,i,purl)
                          if u: uploaded.append(u)
                      car['photos']=uploaded
                  found[pid]=car
              if targets.issubset(found): break
              prev=soup.select_one('link[rel="prev"]') or soup.select_one(".tme_messages_more[href*='before=']")
              href=prev.get('href','') if prev else ''
              if not href: break
              url=urljoin('https://t.me',href)
              time.sleep(.2)

          missing=sorted(targets-set(found),key=int)
          if missing:
              raise SystemExit('missing_target_posts_'+','.join(missing))

          rows=[found[k] for k in sorted(found,key=int)]
          Path('/tmp/autoworld-20260924.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n','utf-8')
          print('AUTOWORLD_20260924_SOURCE_OK '+json.dumps([{
              'post':x['sourcePostId'],'publishedAt':x['publishedAt'],'title':x['title'],
              'vin':x['vin'],'auctionDate':x['auctionDate'],'photos':len(x['photos'])
          } for x in rows],ensure_ascii=False))
          PY

      - name: Merge source records into full archive
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const full=JSON.parse(fs.readFileSync('data/autoworld-georgia/cars.json','utf8'));
          const batch=JSON.parse(fs.readFileSync('/tmp/autoworld-20260924.json','utf8'));
          const byId=new Map(full.map(x=>[String(x.sourcePostId),x]));
          for(const row of batch)byId.set(String(row.sourcePostId),row);
          const merged=[...byId.values()].sort((a,b)=>Number(a.sourcePostId)-Number(b.sourcePostId));
          fs.writeFileSync('data/autoworld-georgia/cars.json',JSON.stringify(merged,null,2)+'\n');
          fs.writeFileSync('/tmp/batch-ids.txt',batch.map(x=>x.sourcePostId).join(','));
          fs.writeFileSync('data/autoworld-georgia/latest-import.json',JSON.stringify({
            generatedAt:new Date().toISOString(),
            batch:'2026-09-24',
            count:batch.length,
            posts:batch.map(x=>({
              sourcePostId:String(x.sourcePostId),sourceUrl:x.sourceUrl,publishedAt:x.publishedAt,
              title:x.title,vin:x.vin||'',auctionDate:x.auctionDate||'',photos:(x.photos||[]).length,
              rawText:x.rawText
            }))
          },null,2)+'\n');
          console.log('AUTOWORLD_20260924_MERGED',batch.length,'archive',merged.length);
          NODE

      - name: Normalize full snapshot
        env:
          SOURCE_PATH: data/autoworld-georgia/cars.json
          OUTPUT_PATH: data/autoworld-georgia/catalog-import.json
          AUDIT_PATH: data/autoworld-georgia/catalog-import-audit.json
          DRY_RUN: 'true'
        run: node scripts/import-autoworld-catalog.mjs

      - name: Validate exact batch
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=fs.readFileSync('/tmp/batch-ids.txt','utf8').trim().split(',');
          const catalog=JSON.parse(fs.readFileSync('data/autoworld-georgia/catalog-import.json','utf8'));
          const byId=new Map(catalog.map(x=>[String(x.sourcePostId),x]));
          const rows=ids.map(id=>byId.get(id));
          if(rows.some(x=>!x))throw new Error('batch_normalization_missing');
          if(rows.some(x=>!x.image))throw new Error('batch_photo_missing');
          const glc=byId.get('3931');
          if(glc?.body!=='Кроссовер / SUV')throw new Error('glc_body_invalid_'+glc?.body);
          console.log('AUTOWORLD_20260924_NORMALIZED '+JSON.stringify(rows.map(x=>({
            post:x.sourcePostId,name:x.brand+' '+x.model,year:x.year,vin:x.vin,
            auctionDate:x.auctionDate,priceRub:x.priceRub,bid:x.estimatedBidUsd,
            photos:1+(x.otherPhotos||[]).length,body:x.body
          }))));
          NODE

      - name: Commit source and normalized dataset safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/autoworld-georgia/cars.json data/autoworld-georgia/catalog-import.json data/autoworld-georgia/catalog-import-audit.json data/autoworld-georgia/latest-import.json
          if git diff --cached --quiet; then
            echo "No dataset changes"
          else
            git commit -m "Import AutoWorld vehicle batch from 24 Sep"
            git fetch origin prototype/auto-sale-usa
            git rebase origin/prototype/auto-sale-usa
            git push origin HEAD:prototype/auto-sale-usa
          fi

      - name: Import exact batch into live YDB
        env:
          SOURCE_PATH: data/autoworld-georgia/cars.json
          OUTPUT_PATH: /tmp/autoworld-batch-catalog.json
          AUDIT_PATH: /tmp/autoworld-batch-audit.json
          AUTO_SALE_STATE_URL: https://auto-sale-demo.viiversion.com/api/auto-sale/state
        run: |
          IDS=$(cat /tmp/batch-ids.txt)
          ONLY_POST_IDS="$IDS" node scripts/import-autoworld-catalog.mjs

      - name: Verify exact batch live
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=fs.readFileSync('/tmp/batch-ids.txt','utf8').trim().split(',');
          const r=await fetch('https://auto-sale-demo.viiversion.com/api/auto-sale/state',{cache:'no-store'});
          if(!r.ok)throw new Error('state_'+r.status);
          const s=await r.json();
          const byId=new Map((s.catalog||[]).map(x=>[String(x.sourcePostId),x]));
          const rows=ids.map(id=>byId.get(id));
          if(rows.some(x=>!x))throw new Error('live_batch_missing');
          console.log('AUTOWORLD_20260924_LIVE_OK '+JSON.stringify({
            revision:s.revision,catalog:(s.catalog||[]).length,
            rows:rows.map(x=>({post:x.sourcePostId,name:x.brand+' '+x.model,year:x.year,auctionDate:x.auctionDate,photos:1+(x.otherPhotos||[]).length}))
          }));
          NODE
