name: Cleanup AUTO SALE demo data for production

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths: ['.cleanup-auto-sale-production']

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove old demo catalog and transactional data safely
        env:
          STATE_URL: https://auto-sale-demo.viiversion.com/api/auto-sale/state
        run: |
          set -euo pipefail
          node <<'NODE'
          const STATE_URL=process.env.STATE_URL;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const arr=x=>Array.isArray(x)?x:[];
          const oldCatalogIds=new Set([
            'bmw-x5-22','tesla-y-23','rav4-22','mustang-mach-e','gle-21','lexus-rx-22',
            'bmw-x3-23','audi-q5-22','porsche-macan-21','volvo-xc60-22','honda-crv-23',
            'mazda-cx5-23','jeep-grand-cherokee-22','subaru-outback-23','tesla-model3-23','cadillac-xt5-22'
          ]);
          async function getState(){
            const r=await fetch(STATE_URL,{headers:{accept:'application/json','cache-control':'no-cache'}});
            if(!r.ok)throw new Error('state_read_failed_'+r.status);
            return r.json();
          }
          function cleaned(s){
            return {
              baseRevision:Number(s.revision)||0,
              leads:[],
              quotes:[],
              orders:[],
              notes:{},
              team:arr(s.team),
              catalog:arr(s.catalog).filter(x=>!oldCatalogIds.has(String(x.id||'')))
            };
          }
          let beforeSuccessfulWrite=null;
          let result=null;
          for(let attempt=1;attempt<=12;attempt++){
            const s=await getState();
            const payload=cleaned(s);
            const before={
              revision:Number(s.revision)||0,
              catalog:arr(s.catalog).length,
              autoWorld:arr(s.catalog).filter(x=>x.source==='AutoWorld_Georgia').length,
              oldDemoCatalog:arr(s.catalog).filter(x=>oldCatalogIds.has(String(x.id||''))).length,
              leads:arr(s.leads).length,
              quotes:arr(s.quotes).length,
              orders:arr(s.orders).length,
              noteKeys:Object.keys(s.notes&&typeof s.notes==='object'?s.notes:{}).length,
              team:arr(s.team).length
            };
            const r=await fetch(STATE_URL,{
              method:'PUT',
              headers:{'content-type':'application/json'},
              body:JSON.stringify(payload)
            });
            if(r.status===409){
              console.log('AUTO_SALE_CLEANUP_RETRY '+JSON.stringify({attempt,baseRevision:before.revision}));
              await sleep(300);
              continue;
            }
            const body=await r.text();
            if(!r.ok)throw new Error('state_write_failed_'+r.status+'_'+body.slice(0,500));
            beforeSuccessfulWrite=before;
            result=JSON.parse(body);
            break;
          }
          if(!result)throw new Error('state_write_conflict_exhausted');

          const after=await getState();
          const summary={
            before:beforeSuccessfulWrite,
            after:{
              revision:Number(after.revision)||0,
              catalog:arr(after.catalog).length,
              autoWorld:arr(after.catalog).filter(x=>x.source==='AutoWorld_Georgia').length,
              oldDemoCatalog:arr(after.catalog).filter(x=>oldCatalogIds.has(String(x.id||''))).length,
              leads:arr(after.leads).length,
              quotes:arr(after.quotes).length,
              orders:arr(after.orders).length,
              noteKeys:Object.keys(after.notes&&typeof after.notes==='object'?after.notes:{}).length,
              team:arr(after.team).length
            },
            writeRevision:Number(result.revision)||0
          };
          if(summary.after.oldDemoCatalog!==0)throw new Error('old_demo_catalog_remains');
          if(summary.after.leads||summary.after.quotes||summary.after.orders||summary.after.noteKeys)throw new Error('transactional_demo_data_remains');
          if(summary.after.autoWorld<summary.before.autoWorld)throw new Error('autoworld_catalog_regressed');
          if(summary.after.team!==summary.before.team)throw new Error('team_configuration_changed');
          console.log('AUTO_SALE_PRODUCTION_CLEANUP_OK '+JSON.stringify(summary));
          NODE
