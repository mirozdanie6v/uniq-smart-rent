name: Audit AUTO SALE production cleanup

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths: ['.audit-auto-sale-production-cleanup']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read live YDB state and classify demo data
        env:
          STATE_URL: https://auto-sale-demo.viiversion.com/api/auto-sale/state
        run: |
          set -euo pipefail
          curl -fsS "$STATE_URL" -o /tmp/state.json
          node <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/state.json','utf8'));
          const arr=x=>Array.isArray(x)?x:[];
          const catalog=arr(s.catalog),leads=arr(s.leads),quotes=arr(s.quotes),orders=arr(s.orders),team=arr(s.team);
          const notes=s.notes&&typeof s.notes==='object'?s.notes:{};
          const oldCatalogIds=new Set([
            'bmw-x5-22','tesla-y-23','rav4-22','mustang-mach-e','gle-21','lexus-rx-22',
            'bmw-x3-23','audi-q5-22','porsche-macan-21','volvo-xc60-22','honda-crv-23',
            'mazda-cx5-23','jeep-grand-cherokee-22','subaru-outback-23','tesla-model3-23','cadillac-xt5-22'
          ]);
          const demoish=v=>/demo|test|тест/i.test(JSON.stringify(v||{}));
          const seedLead=/^L-(?:10[1-8]|DEMO-)/;
          const seedQuote=/^Q-(?:50[1-5]|DEMO-)/;
          const seedOrder=/^O-(?:230[1-4]|DEMO-)/;
          const summary={
            revision:s.revision,
            totals:{catalog:catalog.length,leads:leads.length,quotes:quotes.length,orders:orders.length,notes:Object.keys(notes).length,team:team.length},
            catalog:{
              autoWorld:catalog.filter(x=>x.source==='AutoWorld_Georgia').length,
              knownOldDemo:catalog.filter(x=>oldCatalogIds.has(String(x.id||''))).map(x=>({id:x.id,brand:x.brand,model:x.model,source:x.source||''})),
              otherNonAutoWorld:catalog.filter(x=>x.source!=='AutoWorld_Georgia'&&!oldCatalogIds.has(String(x.id||''))).map(x=>({id:x.id,brand:x.brand,model:x.model,source:x.source||''}))
            },
            leads:leads.map(x=>({id:x.id,name:x.name,contact:x.contact,status:x.status,source:x.source,manager:x.manager,demoish:demoish(x),seed:seedLead.test(String(x.id||''))})),
            quotes:quotes.map(x=>({id:x.id,leadId:x.leadId,status:x.status,demoish:demoish(x),seed:seedQuote.test(String(x.id||''))})),
            orders:orders.map(x=>({id:x.id,leadId:x.leadId,customer:x.customer,model:x.model,stage:x.stage,demoish:demoish(x),seed:seedOrder.test(String(x.id||''))})),
            noteKeys:Object.keys(notes).map(k=>({leadId:k,count:arr(notes[k]).length,demoish:demoish(notes[k]),seed:seedLead.test(k)})),
            team:team.map(x=>({id:x.id,name:x.name,role:x.role,active:x.active}))
          };
          console.log('AUTO_SALE_PROD_CLEANUP_AUDIT '+JSON.stringify(summary));
          NODE
