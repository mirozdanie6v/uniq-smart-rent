name: Apply Stage 9 Fixed

on:
  push:
    branches:
      - stage9/service-and-payment-fix
    paths:
      - '.github/workflows/apply-stage9-fixed.yml'
      - 'scripts/apply_stage9.py'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage9/service-and-payment-fix
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply Stage 9 wiring
        run: python scripts/apply_stage9.py
      - run: npm install
      - run: npm run check
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Stage 9 browser acceptance
        run: python tests/stage9_e2e.py
      - name: Commit verified Stage 9
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/prototype/PrototypeApp.tsx src/main.tsx src/worker.ts tests/domain.test.mjs DEVELOPMENT_ROADMAP.md
          git commit -m "Stage 9: wire service and payment readiness flow"
          git push origin HEAD:stage9/service-and-payment-fix
