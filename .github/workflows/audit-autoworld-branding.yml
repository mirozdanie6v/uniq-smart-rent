name: Audit АвтоМир Грузия branding

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths: ['.audit-autoworld-branding']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check raw Yandex and custom domain
        run: |
          set -euo pipefail
          for BASE in "https://bba01u6g86lg2q49p34d.containers.yandexcloud.net" "https://auto-sale-demo.viiversion.com"; do
            echo "BASE=$BASE"
            APP=$(curl -fsS "$BASE/auto-sale-app-v3.mjs?audit=$(date +%s)" || true)
            HTML=$(curl -fsS "$BASE/?audit=$(date +%s)" || true)
            printf 'brand_full='; if printf '%s' "$APP" | grep -Fq "АвтоМир Грузия 🇬🇪 🇷🇺"; then echo yes; else echo no; fi
            printf 'brand_hero='; if printf '%s' "$APP" | grep -Fq "АВТОМИР ГРУЗИЯ · США → ПОД ЗАКАЗ"; then echo yes; else echo no; fi
            printf 'title='; if printf '%s' "$HTML" | grep -Fq "<title>АвтоМир Грузия · Автомобили из США под заказ</title>"; then echo yes; else echo no; fi
            printf 'analytics='; if printf '%s' "$HTML" | grep -Fq 'data-project="AUTO SALE"'; then echo yes; else echo no; fi
            printf 'legacy_brand='; if printf '%s' "$APP" | grep -Fq "<b>AUTO SALE</b>"; then echo yes; else echo no; fi
            echo "app_bytes=${#APP} html_bytes=${#HTML}"
            printf '%s\n' "$APP" | grep -F "function brand()" | head -n 1 || true
            printf '%s\n' "$APP" | grep -F "АВТОМИР ГРУЗИЯ" | head -n 2 || true
          done
