name: Verify AUTO SALE live glint v13

on:
  push:
    branches:
      - prototype/auto-sale-usa
    paths:
      - .github/workflows/verify-auto-sale-glint.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live glint in Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome executable not found"
            exit 2
          fi

          mkdir -p /tmp/glint-check
          cd /tmp/glint-check
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 >/dev/null 2>&1

          cat > verify.cjs <<'NODE'
          const puppeteer = require('puppeteer-core');

          (async () => {
            const executablePath = process.env.CHROME;
            const browser = await puppeteer.launch({
              executablePath,
              headless: 'new',
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });

            const page = await browser.newPage();
            await page.setViewport({width: 390, height: 844, deviceScaleFactor: 1});
            await page.goto('https://autoworld.viiversion.com/', {
              waitUntil: 'networkidle2',
              timeout: 60000
            });

            await page.waitForSelector('.auto-calc-btn:not([disabled])', {timeout: 30000});
            await page.evaluate(() => {
              document.querySelector('.auto-calc-btn:not([disabled])')
                ?.scrollIntoView({block:'center', inline:'center'});
            });

            const base = await page.evaluate(() => {
              const btn = document.querySelector('.auto-calc-btn:not([disabled])');
              const glint = btn?.querySelector('.auto-calc-glint');
              if (!btn || !glint) return null;
              const bs = getComputedStyle(btn);
              const gs = getComputedStyle(glint);
              const br = btn.getBoundingClientRect();
              return {
                buttonText: btn.textContent.trim(),
                buttonRect: {x:br.x,y:br.y,width:br.width,height:br.height},
                glintDisplay: gs.display,
                glintPosition: gs.position,
                glintAnimationName: gs.animationName,
                glintAnimationDuration: gs.animationDuration,
                glintOpacity: gs.opacity,
                glintZIndex: gs.zIndex,
                buttonOverflow: bs.overflow
              };
            });

            console.log('BASE=' + JSON.stringify(base));
            if (!base) {
              console.log('RESULT=FAIL:no-live-glint-node');
              await browser.close();
              process.exit(3);
            }

            const samples = [];
            const started = Date.now();
            for (let i = 0; i < 60; i++) {
              const s = await page.evaluate(() => {
                const btn = document.querySelector('.auto-calc-btn:not([disabled])');
                const glint = btn?.querySelector('.auto-calc-glint');
                if (!btn || !glint) return null;
                const r = glint.getBoundingClientRect();
                const cs = getComputedStyle(glint);
                return {
                  x: Number(r.x.toFixed(2)),
                  y: Number(r.y.toFixed(2)),
                  w: Number(r.width.toFixed(2)),
                  h: Number(r.height.toFixed(2)),
                  opacity: Number(parseFloat(cs.opacity).toFixed(3)),
                  transform: cs.transform,
                  animationName: cs.animationName,
                  animationPlayState: cs.animationPlayState
                };
              });
              samples.push({t:Date.now()-started, ...s});
              await new Promise(r => setTimeout(r, 100));
            }

            const xs = samples.map(s => s.x).filter(Number.isFinite);
            const ops = samples.map(s => s.opacity).filter(Number.isFinite);
            const minX = Math.min(...xs), maxX = Math.max(...xs), maxOpacity = Math.max(...ops);
            const distinctX = new Set(xs.map(x => x.toFixed(1))).size;
            const moving = (maxX - minX) > 100 && distinctX >= 5;
            const visible = maxOpacity >= 0.25;
            const running = samples.some(s => s.animationPlayState === 'running');
            const animationNamed = samples.some(s => s.animationName === 'autoCalcGlintV12');

            console.log('SUMMARY=' + JSON.stringify({
              minX,maxX,travel:Number((maxX-minX).toFixed(2)),
              maxOpacity,distinctX,moving,visible,running,animationNamed
            }));
            console.log('VISIBLE_SAMPLES=' + JSON.stringify(samples.filter(s => s.opacity >= 0.25).slice(0,12)));

            const ok = moving && visible && running && animationNamed;
            console.log('RESULT=' + (ok ? 'PASS:live-glint-is-moving-and-visible' : 'FAIL:live-glint-not-confirmed'));

            await browser.close();
            process.exit(ok ? 0 : 4);
          })().catch(err => {
            console.error(err);
            process.exit(10);
          });
          NODE

          CHROME="$CHROME" node verify.cjs

# v13 rerun
