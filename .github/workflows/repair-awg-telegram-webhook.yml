name: Repair AWG Telegram webhook

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .repair-awg-telegram-webhook
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
  AWG_GATEWAY_NAME: autoworld-awg-prod
  AUTO_SALE_TELEGRAM_APP_URL: https://awgcars.ru/
  AUTO_SALE_TELEGRAM_WEBHOOK_URL: https://viiversion-telegram-relay.mirozdanie6v.workers.dev/telegram/webhook

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout canonical AutoWorld
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/autoworld
          ref: main
          path: autoworld

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Request GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Exchange OIDC token for Yandex IAM token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          test "$CODE" = "200" || { echo "$BODY"; exit 1; }
          TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token // empty')
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "YC_IAM_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Install Yandex CLI
        run: |
          set -euo pipefail
          curl --connect-timeout 10 --max-time 120 --retry 5 --retry-all-errors --retry-delay 2 -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Resolve live gateway and webhook upstream
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.AUTO_SALE_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          yc config set endpoint api.cloud.yandex.net:443
          yc config set token "$YC_IAM_TOKEN"
          yc config set folder-id "$YC_FOLDER_ID"
          GW=$(yc serverless api-gateway get --name "$AWG_GATEWAY_NAME" --folder-id "$YC_FOLDER_ID" --format json | jq -r '.domain')
          test -n "$GW" && test "$GW" != "null"
          WEBHOOK_KEY=$(node -e "const {createHmac}=require('crypto');process.stdout.write(createHmac('sha256',process.env.TELEGRAM_BOT_TOKEN).update('auto-sale-telegram-webhook-v2').digest('hex').slice(0,32))")
          UPSTREAM="https://$GW/api/auto-sale/telegram/webhook/$WEBHOOK_KEY"
          echo "AUTOWORLD_YANDEX_WEBHOOK_URL=$UPSTREAM" >> "$GITHUB_ENV"

      - name: Deploy relay Worker and synchronize secrets
        working-directory: autoworld/cloudflare/telegram-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.AUTO_SALE_TELEGRAM_BOT_TOKEN }}
          RELAY_SECRET: ${{ secrets.AUTOWORLD_RELAY_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$RELAY_SECRET"
          npm install
          npm test
          npx wrangler deploy --config wrangler.toml
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --config wrangler.toml
          printf '%s' "$RELAY_SECRET" | npx wrangler secret put AUTOWORLD_RELAY_SECRET --config wrangler.toml
          printf '%s' "$AUTOWORLD_YANDEX_WEBHOOK_URL" | npx wrangler secret put AUTOWORLD_YANDEX_WEBHOOK_URL --config wrangler.toml

      - name: Verify relay webhook ingress
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.AUTO_SALE_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          SECRET=$(node -e "const {createHmac}=require('crypto');process.stdout.write(createHmac('sha256',process.env.TELEGRAM_BOT_TOKEN).update('auto-sale-telegram-webhook-secret-v1').digest('hex'))")
          BODY=$(curl --connect-timeout 10 --max-time 20 -fsS -X POST \
            -H 'content-type: application/json' \
            -H "x-telegram-bot-api-secret-token: $SECRET" \
            --data '{"update_id":-99}' \
            "$AUTO_SALE_TELEGRAM_WEBHOOK_URL")
          printf '%s' "$BODY" | jq -e '.ok == true' >/dev/null

      - name: Configure Telegram webhook on workers.dev relay
        working-directory: autoworld
        env:
          AUTO_SALE_TELEGRAM_BOT_TOKEN: ${{ secrets.AUTO_SALE_TELEGRAM_BOT_TOKEN }}
          AUTO_SALE_TELEGRAM_WEBHOOK_BASE_URL: https://awgcars.ru/
        run: node scripts/configure-autoworld-telegram-bot.mjs

      - name: Verify webhook drained and points to relay
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.AUTO_SALE_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          INFO=$(curl --connect-timeout 10 --max-time 20 -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo")
          printf '%s' "$INFO" | jq .
          printf '%s' "$INFO" | jq -e --arg u "$AUTO_SALE_TELEGRAM_WEBHOOK_URL" '.ok == true and .result.url == $u and (.result.pending_update_count|tonumber) == 0' >/dev/null
