name: Audit AUTO SALE no-demo cleanup

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .audit-no-demo-cleanup

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot live state
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          const url='https://auto-sale-demo.viiversion.com/api/auto-sale/state';
          const r=await fetch(url,{headers:{accept:'application/json'}});
          if(!r.ok)throw new Error('state_read_failed_'+r.status);
          const s=await r.json();
          const hash=x=>crypto.createHash('sha256').update(JSON.stringify(x)).digest('hex');
          const out={
            revision:s.revision,
            initialized:s.initialized,
            counts:{
              catalog:(s.catalog||[]).length,
              leads:(s.leads||[]).length,
              quotes:(s.quotes||[]).length,
              orders:(s.orders||[]).length,
              noteKeys:Object.keys(s.notes||{}).length,
              team:(s.team||[]).length
            },
            hashes:{
              catalog:hash(s.catalog||[]),
              leads:hash(s.leads||[]),
              quotes:hash(s.quotes||[]),
              orders:hash(s.orders||[]),
              notes:hash(s.notes||{}),
              team:hash(s.team||[])
            }
          };
          console.log('AUTO_SALE_LIVE_SNAPSHOT',JSON.stringify(out));
          NODE
