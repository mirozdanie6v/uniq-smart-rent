name: Deploy latest AutoWorld catalog build

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .deploy-latest-autoworld

permissions:
  contents: read
  id-token: write

env:
  DEPLOY_SHA: f7a9783bb1aec8fb7fceb16a2878946282a80ff8
  YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
  YC_RUNTIME_SA_ID: ${{ vars.YC_RUNTIME_SA_ID }}
  YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
  YC_CONTAINER_NAME: ${{ vars.YC_CONTAINER_NAME }}
  YDB_CONNECTION_STRING: ${{ vars.YDB_CONNECTION_STRING }}
  AUTO_SALE_MEDIA_BUCKET: viiversion-auto-sale-media

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate pinned source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          npm install
          npm run check

      - name: Validate Yandex configuration
        run: |
          set -euo pipefail
          for name in YC_FOLDER_ID YC_DEPLOY_SA_ID YC_RUNTIME_SA_ID YC_REGISTRY_ID YC_CONTAINER_NAME YDB_CONNECTION_STRING AUTO_SALE_MEDIA_BUCKET; do
            test -n "${!name:-}" || { echo "Missing GitHub repository variable: $name"; exit 1; }
          done

      - name: Request GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Exchange OIDC token for Yandex IAM token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          test "$HTTP_CODE" = "200" || { echo "$BODY"; exit 1; }
          IAM_TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token')
          test -n "$IAM_TOKEN" && test "$IAM_TOKEN" != "null"
          echo "::add-mask::$IAM_TOKEN"
          echo "YC_IAM_TOKEN=$IAM_TOKEN" >> "$GITHUB_ENV"

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Build and push image
        run: |
          set -euo pipefail
          IMAGE="cr.yandex/${YC_REGISTRY_ID}/auto-sale:autoworld-${DEPLOY_SHA}"
          echo "$YC_IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
          docker build -f Dockerfile.yandex -t "$IMAGE" .
          docker push "$IMAGE"
          echo "AUTO_SALE_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Generate API credential
        run: |
          set -euo pipefail
          AUTO_SALE_API_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$AUTO_SALE_API_KEY"
          echo "AUTO_SALE_API_KEY=$AUTO_SALE_API_KEY" >> "$GITHUB_ENV"

      - name: Deploy pinned Yandex revision
        run: |
          set -euo pipefail
          yc serverless container get --name "$YC_CONTAINER_NAME" --folder-id "$YC_FOLDER_ID" >/dev/null 2>&1 || \
            yc serverless container create --name "$YC_CONTAINER_NAME" --folder-id "$YC_FOLDER_ID"
          yc serverless container revision deploy \
            --container-name "$YC_CONTAINER_NAME" \
            --folder-id "$YC_FOLDER_ID" \
            --image "$AUTO_SALE_IMAGE" \
            --cores 1 \
            --memory 512MB \
            --execution-timeout 30s \
            --service-account-id "$YC_RUNTIME_SA_ID" \
            --environment "YDB_CONNECTION_STRING=$YDB_CONNECTION_STRING" \
            --environment "AUTO_SALE_API_KEY=$AUTO_SALE_API_KEY" \
            --environment "AUTO_SALE_PUBLIC_DEMO_WRITE=true" \
            --environment "AUTO_SALE_MEDIA_BUCKET=$AUTO_SALE_MEDIA_BUCKET"

      - name: Verify deployed catalog read-only
        run: |
          set -euo pipefail
          URL=$(yc serverless container get --name "$YC_CONTAINER_NAME" --folder-id "$YC_FOLDER_ID" --format json | jq -r '.url')
          test -n "$URL" && test "$URL" != "null"
          for attempt in $(seq 1 20); do
            if curl -fsS "${URL%/}/api/health" >/dev/null; then break; fi
            test "$attempt" -lt 20 || exit 1
            sleep 5
          done
          STAGING_URL="$URL" node --input-type=module <<'NODE'
          const ids=['3893','3902','3912','3922','3931','3941','3950','3960','3969'];
          for(const base of [process.env.STAGING_URL.replace(/\/$/,''),'https://auto-sale-demo.viiversion.com']){
            const stateR=await fetch(base+'/api/auto-sale/state',{cache:'no-store'});
            if(!stateR.ok)throw new Error('state_http_'+stateR.status+'_'+base);
            const s=await stateR.json();
            if((s.catalog||[]).length!==133)throw new Error('catalog_count_'+(s.catalog||[]).length+'_'+base);
            const byPost=new Map((s.catalog||[]).map(x=>[String(x.sourcePostId),x]));
            const missing=ids.filter(id=>!byPost.has(id));
            if(missing.length)throw new Error('missing_posts_'+missing.join('_')+'_'+base);
            const html=await fetch(base+'/?v='+Date.now(),{cache:'no-store'}).then(r=>r.text());
            if(!html.includes('АвтоМир Грузия'))throw new Error('brand_missing_'+base);
            console.log('AUTOWORLD_DEPLOY_OK',JSON.stringify({
              base,revision:s.revision,catalog:(s.catalog||[]).length,
              posts:ids.map(id=>({post:id,name:byPost.get(id).brand+' '+byPost.get(id).model}))
            }));
          }
          NODE
