name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Install Chromium + Python Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install chromium
      - name: Browser E2E
        run: python tests/e2e.py
      - uses: actions/upload-artifact@v4
        with:
          name: uniq-smart-rent-e2e
          path: e2e-results.json
