name: Validate AUTO SALE no-demo cleanup

on:
  push:
    branches: [cleanup/auto-sale-no-demo-20260924]
    paths:
      - .github/workflows/validate-auto-sale-no-demo.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Full application check
        run: npm run check
      - name: Validate D1 migration chain
        run: npx wrangler d1 migrations apply uniq-smart-rent-db --local
      - name: Validate Yandex runtime syntax
        run: |
          node --check server/auto-sale-rules.mjs
          node --check server/ydb-state.mjs
          node --check server/ydb-sync.mjs
          node --check server/yandex-server.mjs
      - name: Assert active production files contain no demo fallbacks
        run: |
          set -euo pipefail
          FILES=(
            public/auto-sale-app-v3.mjs
            public/auto-sale-core.mjs
            public/auto-sale-car-details.mjs
            public/auto-sale-director-team.mjs
            public/auto-sale-photo-catalog.mjs
            public/auto-sale-catalog-extra.mjs
            public/auto-sale-app.mjs
            public/auto-sale-app.js
            src/auto-sale/demo-business.ts
          )
          if grep -En 'L-101|Q-501|O-2301|bmw-x5-22|tesla-y-23|rav4-22|L-DEMO|Q-DEMO|O-DEMO|Demo Delivery|Demo Handoff|Демо-данные|пример автомобиля|images\.unsplash\.com' "${FILES[@]}"; then
            echo "Demo fallback residue found in active production files" >&2
            exit 1
          fi
          echo "AUTO_SALE_NO_DEMO_STATIC_OK"
      - name: Build Yandex image
        run: docker build -f Dockerfile.yandex -t auto-sale-no-demo:check .
