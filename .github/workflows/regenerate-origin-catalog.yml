name: Regenerate AUTO SALE origin catalog snapshot

on:
  push:
    branches: [feature/auto-sale-origin-logistics-20260925]
    paths:
      - .regenerate-origin-catalog

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/auto-sale-origin-logistics-20260925
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Regenerate normalized snapshot
        env:
          SOURCE_PATH: data/autoworld-georgia/cars.json
          OUTPUT_PATH: data/autoworld-georgia/catalog-import.json
          AUDIT_PATH: data/autoworld-georgia/catalog-import-audit.json
          DRY_RUN: 'true'
        run: |
          node scripts/import-autoworld-catalog.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows=JSON.parse(fs.readFileSync('data/autoworld-georgia/catalog-import.json','utf8'));
          if(rows.length!==133)throw new Error('catalog_count_'+rows.length);
          const counts={};
          for(const x of rows){
            if(!x.origin)throw new Error('origin_missing_'+x.id);
            counts[x.origin]=(counts[x.origin]||0)+1;
          }
          console.log('ORIGIN_SNAPSHOT_OK',JSON.stringify(counts));
          NODE
      - name: Commit snapshot safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/autoworld-georgia/catalog-import.json data/autoworld-georgia/catalog-import-audit.json
          if git diff --cached --quiet; then
            echo "Snapshot already current"
            exit 0
          fi
          git commit -m "Add vehicle origin to AutoWorld catalog snapshot"
          git fetch origin feature/auto-sale-origin-logistics-20260925
          git rebase origin/feature/auto-sale-origin-logistics-20260925
          git push origin HEAD:feature/auto-sale-origin-logistics-20260925
