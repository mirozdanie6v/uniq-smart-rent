name: Verify AUTO SALE client photo slider live

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - '.verify-client-slider-live'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DEMO_URL: https://auto-sale-demo.viiversion.com
    steps:
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright requests
          python -m playwright install --with-deps chromium >/dev/null

      - name: Verify popup slider arrows thumbnails and swipe
        run: |
          python - <<'PY'
          import os,copy,requests,time
          from playwright.sync_api import sync_playwright

          base=os.environ['DEMO_URL'].rstrip('/')
          state_url=base+'/api/auto-sale/state'

          def get_state():
              r=requests.get(state_url,timeout=30)
              r.raise_for_status()
              return r.json()

          def put_catalog(transform):
              for _ in range(10):
                  state=get_state()
                  catalog=copy.deepcopy(state.get('catalog',[]))
                  catalog=transform(catalog)
                  payload={
                    'baseRevision':int(state.get('revision',0)),
                    'leads':state.get('leads',[]),
                    'quotes':state.get('quotes',[]),
                    'orders':state.get('orders',[]),
                    'notes':state.get('notes',{}),
                    'team':state.get('team',[]),
                    'catalog':catalog
                  }
                  r=requests.put(state_url,json=payload,timeout=30)
                  if r.status_code==200:return r.json()
                  assert r.status_code==409,(r.status_code,r.text[:500])
                  time.sleep(.2)
              raise AssertionError('could not update demo catalog')

          initial=get_state()
          bmw=next(x for x in initial['catalog'] if x['id']=='bmw-x5-22')
          original=copy.deepcopy(bmw)
          images=[]
          for car in initial['catalog']:
              src=car.get('image')
              if src and src not in images:
                  images.append(src)
              if len(images)>=3:break
          assert len(images)>=3

          def inject(catalog):
              out=copy.deepcopy(catalog)
              for car in out:
                  if car.get('id')=='bmw-x5-22':
                      car['image']=images[0]
                      car['interiorPhotos']=[images[1]]
                      car['otherPhotos']=[images[2]]
              return out

          def restore(catalog):
              out=[]
              for car in catalog:
                  out.append(copy.deepcopy(original) if car.get('id')=='bmw-x5-22' else car)
              return out

          put_catalog(inject)
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
                  context=browser.new_context(viewport={'width':390,'height':844},is_mobile=True,has_touch=True,locale='ru-RU')
                  page=context.new_page()
                  page.goto(base,wait_until='networkidle',timeout=60000)
                  page.wait_for_timeout(1400)
                  page.locator('[data-role="client"]').click()
                  page.locator('.auto-bottom [data-go="catalog"]').click()
                  page.locator('[data-detail="bmw-x5-22"]').click()
                  page.locator('[data-car-slider]').wait_for(state='visible',timeout=5000)

                  assert page.locator('[data-car-slide]').count()==3
                  assert page.locator('[data-car-slide-thumb]').count()==3
                  assert page.locator('[data-car-slide-count]').inner_text().strip()=='1 / 3'
                  print('AUTO_SALE_CLIENT_SLIDER_OPEN_OK')

                  page.locator('[data-car-slide-next]').click()
                  page.wait_for_timeout(350)
                  assert page.locator('[data-car-slide-count]').inner_text().strip()=='2 / 3'
                  assert page.locator('[data-car-slide-thumb].active').get_attribute('data-car-slide-thumb')=='1'
                  print('AUTO_SALE_CLIENT_SLIDER_NEXT_OK')

                  page.locator('[data-car-slide-thumb="0"]').click()
                  page.wait_for_timeout(350)
                  assert page.locator('[data-car-slide-count]').inner_text().strip()=='1 / 3'
                  print('AUTO_SALE_CLIENT_SLIDER_THUMB_OK')

                  viewport=page.locator('[data-car-slider-viewport]')
                  box=viewport.bounding_box()
                  assert box
                  cdp=context.new_cdp_session(page)
                  y=box['y']+box['height']/2
                  x1=box['x']+box['width']*.78
                  x2=box['x']+box['width']*.22
                  cdp.send('Input.dispatchTouchEvent',{'type':'touchStart','touchPoints':[{'x':x1,'y':y}]})
                  cdp.send('Input.dispatchTouchEvent',{'type':'touchMove','touchPoints':[{'x':x2,'y':y}]})
                  cdp.send('Input.dispatchTouchEvent',{'type':'touchEnd','touchPoints':[]})
                  page.wait_for_timeout(400)
                  assert page.locator('[data-car-slide-count]').inner_text().strip()=='2 / 3'
                  print('AUTO_SALE_CLIENT_SLIDER_SWIPE_OK')
                  browser.close()
          finally:
              put_catalog(restore)

          final=get_state()
          restored=next(x for x in final['catalog'] if x['id']=='bmw-x5-22')
          assert restored==original
          print('AUTO_SALE_CLIENT_SLIDER_RESTORE_OK')
          PY
