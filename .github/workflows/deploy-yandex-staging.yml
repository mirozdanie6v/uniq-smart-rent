name: Deploy AUTO SALE to Yandex staging

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  YC_FOLDER_ID: b1g8u8vqkgehvtbj8n13
  YC_YDB_ID: etnr90ntl17oucsncg1k
  YDB_CONNECTION_STRING: grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1ggsmuiq7tb2d27f89q/etnr90ntl17oucsncg1k
  SOURCE_STATE_URL: https://auto-sale.viiversion.com/api/auto-sale/state
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
  YC_RUNTIME_SA_ID: ${{ vars.YC_RUNTIME_SA_ID }}
  YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
  YC_CONTAINER_NAME: auto-sale-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate Yandex configuration
        run: |
          set -euo pipefail
          for name in YC_DEPLOY_SA_ID YC_RUNTIME_SA_ID YC_REGISTRY_ID; do
            test -n "${!name:-}" || { echo "Missing GitHub repository variable: $name"; exit 1; }
          done

      - name: Validate application
        run: |
          npm install
          npm run check
          node --check server/ydb-state.mjs
          node --check server/yandex-server.mjs
          node --check scripts/migrate-auto-sale-to-ydb.mjs

      - name: Request GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken()
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Exchange OIDC token for Yandex IAM token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          IAM_TOKEN=$(curl -fsS -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token | jq -r '.access_token')
          test -n "$IAM_TOKEN" && test "$IAM_TOKEN" != "null"
          echo "::add-mask::$IAM_TOKEN"
          echo "YC_IAM_TOKEN=$IAM_TOKEN" >> "$GITHUB_ENV"

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Build and push image
        run: |
          set -euo pipefail
          IMAGE="cr.yandex/${YC_REGISTRY_ID}/auto-sale:${GITHUB_SHA}"
          echo "$YC_IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
          docker build -f Dockerfile.yandex -t "$IMAGE" .
          docker push "$IMAGE"
          echo "AUTO_SALE_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Import current Cloudflare state into YDB
        env:
          YDB_ACCESS_TOKEN_CREDENTIALS: ${{ env.YC_IAM_TOKEN }}
        run: |
          set -euo pipefail
          npm run migrate:yandex

      - name: Deploy private read-only Yandex container
        run: |
          set -euo pipefail
          YC=(yc --token "$YC_IAM_TOKEN" --folder-id "$YC_FOLDER_ID")
          "${YC[@]}" serverless container get --name "$YC_CONTAINER_NAME" >/dev/null 2>&1 || \
            "${YC[@]}" serverless container create --name "$YC_CONTAINER_NAME"
          "${YC[@]}" serverless container revision deploy \
            --container-name "$YC_CONTAINER_NAME" \
            --image "$AUTO_SALE_IMAGE" \
            --cores 1 \
            --memory 512MB \
            --execution-timeout 30s \
            --service-account-id "$YC_RUNTIME_SA_ID" \
            --metadata-options gce-http-endpoint=enabled \
            --environment "YDB_CONNECTION_STRING=${YDB_CONNECTION_STRING},YDB_METADATA_CREDENTIALS=1"

      - name: Verify Yandex staging with IAM
        run: |
          set -euo pipefail
          YC=(yc --token "$YC_IAM_TOKEN" --folder-id "$YC_FOLDER_ID")
          URL=$("${YC[@]}" serverless container get --name "$YC_CONTAINER_NAME" --format json | jq -r '.url')
          test -n "$URL" && test "$URL" != "null"
          for attempt in $(seq 1 20); do
            health=$(curl -fsS -H "Authorization: Bearer $YC_IAM_TOKEN" "${URL%/}/api/health" || true)
            if echo "$health" | jq -e '.ok == true and .persistence == "ydb-serverless"' >/dev/null 2>&1; then
              state=$(curl -fsS -H "Authorization: Bearer $YC_IAM_TOKEN" "${URL%/}/api/auto-sale/state")
              echo "$state" | jq -e '.initialized == true and (.leads|type=="array") and (.quotes|type=="array") and (.orders|type=="array")' >/dev/null
              echo "Yandex YDB staging verified: $URL"
              exit 0
            fi
            sleep 5
          done
          exit 1
