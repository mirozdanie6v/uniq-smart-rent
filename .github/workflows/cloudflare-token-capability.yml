name: Cloudflare token capability preflight

on:
  push:
    branches: [main]
    paths:
      - '.cloudflare-token-capability'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check user token permission groups
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/groups.json -w '%{http_code}'             'https://api.cloudflare.com/client/v4/user/tokens/permission_groups'             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H 'Content-Type: application/json')"
          echo "HTTP=$code"
          if [ "$code" != "200" ]; then
            cat /tmp/groups.json | jq '{success,errors}' || cat /tmp/groups.json
            exit 1
          fi
          jq -e '.success == true' /tmp/groups.json >/dev/null
          jq '[.result[] | select(.name=="Workers Scripts Write" or .name=="Workers Routes Write" or .name=="API Tokens Write") | {id,name,scopes,is_selectable}]' /tmp/groups.json
