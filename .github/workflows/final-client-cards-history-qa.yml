name: Final client, clickable cards and rental history QA

on:
  push:
    branches:
      - refactor/react-typescript-vite-demo
    paths:
      - '.github/workflows/final-client-cards-history-qa.yml'
      - '.hotfix-final-client-cards-trigger'
      - 'scripts/hotfix_final_client_cards.py'
      - 'scripts/hotfix_final_client_cards_postfix.py'
      - 'tests/final_client_cards_history.mjs'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/react-typescript-vite-demo
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply interface fixes
        run: |
          python scripts/hotfix_final_client_cards.py
          python scripts/hotfix_final_client_cards_postfix.py
      - name: Full project check
        run: |
          npm install
          npm run check
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Browser acceptance
        run: node tests/final_client_cards_history.mjs
      - name: Commit verified fixes
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/prototype/PrototypeApp.tsx src/features/crm/OwnerCRM.tsx src/features/crm/owner-crm.css styles.css tests/domain.test.mjs
          git commit -m 'Fix final client hero dashboard cards and owner rental history'
          git push origin HEAD:refactor/react-typescript-vite-demo
