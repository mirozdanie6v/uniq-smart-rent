name: Deploy AUTO SALE load/date fix

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - .deploy-auto-sale-load-date-fix

permissions:
  contents: read
  id-token: write

env:
  DEPLOY_SHA: cab492c619a1d68b136985e73ddfcfd77d62c426
  YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
  YC_RUNTIME_SA_ID: ${{ vars.YC_RUNTIME_SA_ID }}
  YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
  YC_CONTAINER_NAME: ${{ vars.YC_CONTAINER_NAME }}
  YDB_CONNECTION_STRING: ${{ vars.YDB_CONNECTION_STRING }}
  AUTO_SALE_MEDIA_BUCKET: viiversion-auto-sale-media

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          npm install
          npm run check
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('index.html','utf8');
          const app=fs.readFileSync('public/auto-sale-app-v3.mjs','utf8');
          if(html.includes('\\n  <!-- compatibility marker'))throw new Error('literal_newline_artifact_remains');
          if(!app.includes('Дата аукциона&nbsp;</span><b>'))throw new Error('auction_date_spacing_fix_missing');
          console.log('AUTO_SALE_LOAD_DATE_SOURCE_OK');
          NODE

      - name: Validate Yandex configuration
        run: |
          set -euo pipefail
          for name in YC_FOLDER_ID YC_DEPLOY_SA_ID YC_RUNTIME_SA_ID YC_REGISTRY_ID YC_CONTAINER_NAME YDB_CONNECTION_STRING AUTO_SALE_MEDIA_BUCKET; do
            test -n "${!name:-}" || { echo "Missing GitHub repository variable: $name"; exit 1; }
          done

      - name: Request GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Exchange OIDC token for Yandex IAM token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          test "$HTTP_CODE" = "200" || { echo "$BODY"; exit 1; }
          IAM_TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token')
          test -n "$IAM_TOKEN" && test "$IAM_TOKEN" != "null"
          echo "::add-mask::$IAM_TOKEN"
          echo "YC_IAM_TOKEN=$IAM_TOKEN" >> "$GITHUB_ENV"

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Build and push image
        run: |
          set -euo pipefail
          IMAGE="cr.yandex/${YC_REGISTRY_ID}/auto-sale:load-date-${DEPLOY_SHA}"
          echo "$YC_IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
          docker build -f Dockerfile.yandex -t "$IMAGE" .
          docker push "$IMAGE"
          echo "AUTO_SALE_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Generate API credential
        run: |
          set -euo pipefail
          AUTO_SALE_API_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$AUTO_SALE_API_KEY"
          echo "AUTO_SALE_API_KEY=$AUTO_SALE_API_KEY" >> "$GITHUB_ENV"

      - name: Deploy pinned Yandex revision
        run: |
          set -euo pipefail
          yc serverless container revision deploy \
            --container-name "$YC_CONTAINER_NAME" \
            --folder-id "$YC_FOLDER_ID" \
            --image "$AUTO_SALE_IMAGE" \
            --cores 1 \
            --memory 512MB \
            --execution-timeout 30s \
            --service-account-id "$YC_RUNTIME_SA_ID" \
            --environment "YDB_CONNECTION_STRING=$YDB_CONNECTION_STRING" \
            --environment "AUTO_SALE_API_KEY=$AUTO_SALE_API_KEY" \
            --environment "AUTO_SALE_PUBLIC_DEMO_WRITE=true" \
            --environment "AUTO_SALE_MEDIA_BUCKET=$AUTO_SALE_MEDIA_BUCKET"

      - name: Verify raw and custom domain
        run: |
          set -euo pipefail
          URL=$(yc serverless container get --name "$YC_CONTAINER_NAME" --folder-id "$YC_FOLDER_ID" --format json | jq -r '.url')
          test -n "$URL" && test "$URL" != "null"
          RAW_URL="$URL" node --input-type=module <<'NODE'
          const bases=[process.env.RAW_URL.replace(/\/$/,''),'https://auto-sale-demo.viiversion.com'];
          for(const base of bases){
            let ok=false;
            for(let attempt=0;attempt<20;attempt++){
              const q='?v='+Date.now();
              const [htmlR,appR,stateR]=await Promise.all([
                fetch(base+'/'+q,{cache:'no-store'}),
                fetch(base+'/auto-sale-app-v3.mjs'+q,{cache:'no-store'}),
                fetch(base+'/api/auto-sale/state',{cache:'no-store'})
              ]);
              const html=await htmlR.text();
              const app=await appR.text();
              if(htmlR.ok&&appR.ok&&stateR.ok&&!html.includes('\\n  <!-- compatibility marker')&&app.includes('Дата аукциона&nbsp;</span><b>')){
                const state=await stateR.json();
                if((state.catalog||[]).length!==133)throw new Error('catalog_changed_'+(state.catalog||[]).length);
                console.log('AUTO_SALE_LOAD_DATE_DEPLOY_OK',JSON.stringify({base,revision:state.revision,catalog:(state.catalog||[]).length}));
                ok=true;break;
              }
              await new Promise(r=>setTimeout(r,5000));
            }
            if(!ok)throw new Error('deployed_fix_not_visible_'+base);
          }
          NODE
