name: Audit latest AutoWorld Georgia page

on:
  push:
    branches:
      - prototype/auto-sale-usa
    paths:
      - .audit-autoworld-latest

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install requests beautifulsoup4
      - name: Print latest public channel messages
        run: |
          python - <<'PY'
          import json, requests
          from bs4 import BeautifulSoup
          url='https://t.me/s/AutoWorld_Georgia'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=40)
          r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          rows=[]
          for msg in soup.select('.tgme_widget_message'):
              data=msg.get('data-post','')
              if '/' not in data:
                  continue
              pid=data.rsplit('/',1)[-1]
              node=msg.select_one('.tgme_widget_message_text')
              text=node.get_text('\n',strip=True) if node else ''
              dt=msg.select_one('time[datetime]')
              photos=len(msg.select('.tgme_widget_message_photo_wrap, .tgme_widget_message_photo, .grouped_media_wrap'))
              rows.append({'postId':pid,'publishedAt':dt.get('datetime','') if dt else '','photos':photos,'text':text[:4000]})
          rows.sort(key=lambda x:int(x['postId']))
          print('AUTOWORLD_LATEST_PAGE_JSON='+json.dumps(rows,ensure_ascii=False))
          PY
