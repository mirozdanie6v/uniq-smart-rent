name: Inspect AutoWorld custom location markers

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - '.inspect-autoworld-markers'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests beautifulsoup4
      - name: Inspect latest post markup
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          html=requests.get('https://t.me/s/AutoWorld_Georgia?before=3970',headers={'User-Agent':'Mozilla/5.0'},timeout=30).text
          soup=BeautifulSoup(html,'html.parser')
          msgs=soup.select('.tgme_widget_message')
          for msg in msgs:
              pid=msg.get('data-post','')
              node=msg.select_one('.tgme_widget_message_text')
              print('\n===== POST',pid,'=====')
              if not node:
                  print('NO TEXT')
                  continue
              print('TEXT',node.get_text(' ',strip=True)[:700])
              found=[]
              for el in node.find_all(True):
                  attrs=' '.join(f'{k}={v}' for k,v in el.attrs.items())
                  markup=str(el)
                  if 'emoji' in attrs.lower() or 'emoji' in markup.lower() or 'custom' in attrs.lower():
                      found.append(markup[:700])
              print('EMOJI_NODES',len(found))
              for x in found[:40]:
                  print('EMOJI',x)
          PY
