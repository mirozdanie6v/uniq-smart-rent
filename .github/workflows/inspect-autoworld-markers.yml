name: Inspect AutoWorld custom location markers

on:
  push:
    branches: [prototype/auto-sale-usa]
    paths:
      - '.inspect-autoworld-markers'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests beautifulsoup4
      - name: Diagnose latest public archive parsing
        run: |
          python - <<'PY'
          import re,requests
          from bs4 import BeautifulSoup
          html=requests.get('https://t.me/s/AutoWorld_Georgia?cachebust=202609252240',headers={'User-Agent':'Mozilla/5.0'},timeout=30).text
          soup=BeautifulSoup(html,'html.parser')
          msgs=soup.select('.tgme_widget_message')
          print('MESSAGE_COUNT',len(msgs))
          for msg in msgs:
              pid=msg.get('data-post','')
              node=msg.select_one('.tgme_widget_message_text')
              text=node.get_text('\n',strip=True) if node else ''
              score=sum(1 for token in ['Пробег','Двигатель','Привод','Коробка','Торги','Цена','комплектация','VIN','Повреждения'] if token.lower() in text.lower())
              year=bool(re.search(r'\\b20\\d{2}\\b|\\b(?:0[1-9]|1[0-2])[/.-]\\d{2}\\b',text))
              ids=[x.get('emoji-id') for x in node.select('tg-emoji[emoji-id]')] if node else []
              print('POST',pid,'score',score,'year',year,'emoji',','.join(ids[:8]),'text',re.sub(r'\\s+',' ',text)[:260])
          PY
